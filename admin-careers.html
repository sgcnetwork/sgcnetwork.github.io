<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers & CVs | SGC Admin</title><style>body{font:15px Arial;background:#faf4ee;color:#261d29;margin:0}main{max-width:1100px;margin:35px auto;padding:20px}a{color:#705478}.row{background:white;border:1px solid #e5d9e2;padding:20px;margin:12px 0;border-radius:15px}button,select,input{padding:10px;border-radius:8px;border:1px solid #cbbac9}button{cursor:pointer}small{color:#777}h1{font:45px Georgia}#records a{margin-right:15px}</style></head><body><main><a href="dashboard.html">← SGC Dashboard</a><h1>Careers & CVs Received</h1><p>Position: <strong>Project Coordinator</strong></p><input id="search" placeholder="Search applicant or position"><select id="filter"><option value="">All statuses</option><option>New</option><option>Under Review</option><option>Shortlisted</option><option>Interview</option><option>Accepted</option><option>Rejected</option></select><p id="notice">Checking admin access…</p><section id="records"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bxpexanyoyubxeqqlggh.supabase.co','sb_publishable_Z0_Y-Bj_G5qw4hMgDbQlgA__jj8rGGq');</script><script>
let rows=[];const n=document.getElementById('notice'),out=document.getElementById('records');async function init(){const {data:{user}}=await db.auth.getUser();if(!user||user.email!=='netsgcwork@gmail.com'){n.textContent='Restricted to the authorised SGC Network administrator. Please sign in using your admin account.';return}const {data,error}=await db.from('career_applications').select('*').order('created_at',{ascending:false});if(error){n.textContent=error.message;return}rows=data||[];n.textContent=rows.length+' applications received';render()}function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function render(){out.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('filter').value;rows.filter(r=>(r.full_name+' '+r.position+' '+r.email).toLowerCase().includes(q)&&(!s||r.status===s)).forEach(r=>{const card=node('article','');card.className='row';card.append(node('h2',r.full_name+' — '+r.position),node('p',r.email+' · '+r.phone+' · '+r.city),node('small',new Date(r.created_at).toLocaleString()));if(r.introduction)card.append(node('p',r.introduction));for(const [label,path] of [['Download CV',r.cv_path],['Watch / download video',r.video_path]])if(path){const b=node('button',label);b.onclick=async()=>{const {data,error}=await db.storage.from('career-uploads').createSignedUrl(path,60);if(error)alert(error.message);else window.open(data.signedUrl,'_blank','noopener')};card.append(b)}const sel=document.createElement('select');for(const v of ['New','Under Review','Shortlisted','Interview','Accepted','Rejected']){const o=node('option',v);o.value=v;sel.append(o)}sel.value=r.status;sel.onchange=async()=>{const {error}=await db.from('career_applications').update({status:sel.value}).eq('id',r.id);if(error)alert(error.message);else r.status=sel.value};card.append(sel);out.append(card)})}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;init();
</script></body></html>
