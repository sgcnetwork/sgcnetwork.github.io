<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers & CVs | SGC Admin</title><style>body{font:15px Arial;background:#faf4ee;color:#261d29;margin:0}main{max-width:1100px;margin:35px auto;padding:20px}a{color:#705478}.row{background:white;border:1px solid #e5d9e2;padding:20px;margin:12px 0;border-radius:15px}button,select,input{padding:10px;border-radius:8px;border:1px solid #cbbac9}button{cursor:pointer}small{color:#777}h1{font:clamp(30px,6vw,45px) Georgia}*{box-sizing:border-box}body{overflow-x:hidden}#search{max-width:100%;width:min(350px,100%)}.row{overflow-wrap:anywhere}.row button,.row select{margin:6px 8px 6px 0}@media(max-width:600px){main{margin:10px auto;padding:16px}.row{padding:16px}}#records a{margin-right:15px}.candidate{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fff;border:1px solid #e5d9e2;border-radius:14px;padding:17px;margin:10px 0;cursor:pointer;color:#261d29}.candidate strong,.candidate small{display:block}.candidate small{margin-top:6px}.badge{background:#eee5f1;border-radius:20px;padding:7px 10px;font-size:12px;white-space:nowrap}.detail{background:#fff;border:1px solid #e5d9e2;border-radius:18px;padding:24px;margin-top:24px}.detail label{display:block;font-weight:bold}.detail select{display:block;margin:10px 0 15px;width:100%;max-width:340px}.detail h3{margin-top:30px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{background:#392a3e;color:#fff;border:0;cursor:pointer}.motivation{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere;background:#fbf7fa;padding:18px;border-radius:12px}@media(max-width:600px){.candidate{padding:13px;align-items:flex-start}.badge{font-size:10px}.detail{padding:16px}} </style></head><body><main><a href="admin-dashboard.html">← SGC Admin Dashboard</a><h1>Careers & CVs Received</h1><p>Position: <strong>Project Coordinator</strong></p><input id="search" placeholder="Search applicant or position"><select id="filter"><option value="">All statuses</option><option>New</option><option>In Review</option><option>Requested Interview</option><option>Interviewed</option><option>Shortlisted</option><option>Complete Hired</option><option>Not Suited</option><option>Closed</option></select><p id="notice">Checking admin access…</p><section id="records"></section><section id="detail" class="detail" hidden></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>const db=window.sgcSupabase;</script><script>
const statuses=['New','In Review','Requested Interview','Interviewed','Shortlisted','Complete Hired','Not Suited','Closed'];
let rows=[],selected=null;const n=document.getElementById('notice'),out=document.getElementById('records'),detail=document.getElementById('detail');
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function init(){if(!db){n.textContent='Unable to connect to SGC Network. Refresh and try again.';return}const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){n.textContent='Sign in to SGC Admin first.';return}const {data:profile,error:pe}=await db.from('profiles').select('role').eq('id',user.id).single();if(pe||profile?.role!=='admin'){n.textContent='Admin access required.';return}const {data,error}=await db.from('career_applications').select('*').order('created_at',{ascending:false});if(error){n.textContent='Could not load applications: '+error.message;return}rows=data||[];n.textContent=rows.length+' application(s) received';render()}
function render(){out.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;for(const r of rows.filter(x=>(x.full_name+' '+x.position).toLowerCase().includes(q)&&(!f||x.status===f))){const b=el('button',undefined,'candidate');const left=el('span');left.append(el('strong',r.full_name),el('small',r.position));b.append(left,el('span',r.status||'New','badge'));b.onclick=()=>show(r);out.append(b)}}
async function fileAction(path,download){const {data,error}=await db.storage.from('career-uploads').createSignedUrl(path,120);if(error)throw error;if(download){const a=document.createElement('a');a.href=data.signedUrl;a.download='SGC-application-file';a.target='_blank';a.rel='noopener';a.click()}else window.open(data.signedUrl,'_blank','noopener')}
function action(label,handler){const b=el('button',label,'action');b.onclick=async()=>{try{await handler()}catch(e){alert(e.message)}};return b}
function show(r){selected=r;detail.hidden=false;detail.replaceChildren();detail.append(el('h2',r.full_name),el('p','Applied for: '+r.position),el('p',r.email+' · '+r.phone+' · '+r.city),el('p','Received: '+new Date(r.created_at).toLocaleString()));const label=el('label','Recruitment stage');const select=document.createElement('select');for(const v of statuses){const o=el('option',v);o.value=v;select.append(o)}select.value=r.status||'New';select.onchange=async()=>{const {error}=await db.from('career_applications').update({status:select.value}).eq('id',r.id);if(error){alert(error.message);select.value=r.status;return}r.status=select.value;render();stage.textContent='Current stage: '+r.status};label.append(select);detail.append(label);const stage=el('p','Current stage: '+r.status);detail.append(stage);
detail.append(el('h3','CV'));const files=el('div',undefined,'actions');files.append(action('View CV',()=>fileAction(r.cv_path,false)),action('Download CV',()=>fileAction(r.cv_path,true)));detail.append(files);
detail.append(el('h3','Motivation'));if(r.introduction?.trim()){const text=el('div',r.introduction,'motivation');detail.append(text);detail.append(action('Export motivation as PDF',()=>{const doc=new window.jspdf.jsPDF();doc.setFontSize(16);doc.text('SGC Network | Applicant Motivation',15,20);doc.setFontSize(11);doc.text('Applicant: '+r.full_name,15,30);doc.text('Position: '+r.position,15,38);const lines=doc.splitTextToSize(r.introduction,180);let y=50;for(const line of lines){if(y>275){doc.addPage();y=20}doc.text(line,15,y);y+=6}doc.save('SGC-Motivation-'+r.full_name.replace(/[^a-z0-9]/gi,'-')+'.pdf')}))}else detail.append(el('p','No written motivation submitted.'));
if(r.video_path){detail.append(el('h3','Introduction video'));const v=el('video');v.controls=true;v.playsInline=true;v.style.width='100%';detail.append(v);const controls=el('div',undefined,'actions');controls.append(action('Play video',async()=>{const {data,error}=await db.storage.from('career-uploads').createSignedUrl(r.video_path,600);if(error)throw error;v.src=data.signedUrl;await v.play()}),action('Download video',()=>fileAction(r.video_path,true)));detail.append(controls)}
detail.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;init().catch(e=>n.textContent='Could not load: '+e.message);
</script></body></html>
