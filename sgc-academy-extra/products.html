<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGC Product Admin</title>
<style>
:root {
  --cream:#fffaf2;
  --pink:#f7dce5;
  --lav:#e8e0f5;
  --yellow:#fff0bc;
  --ink:#403744;
  --line:#e6dce1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:25px}
h1,h2,h3{font-family:Georgia,serif}
h1{font-size:38px}
a{color:var(--ink)}
header,nav{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
section,.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:25px;margin:20px 0}
.hero{background:var(--pink)}
label{display:block;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}
input[type=checkbox]{width:auto}
textarea{min-height:110px}
button{font:inherit;cursor:pointer;border:0;border-radius:20px;background:var(--ink);color:white;padding:12px 18px;margin:6px 8px 6px 0}
button:disabled{opacity:.5}
.muted{color:#716775;line-height:1.7}
.notice{white-space:pre-wrap;overflow-wrap:anywhere}
.hours{display:grid;grid-template-columns:130px 1fr 1fr;gap:8px;align-items:center;margin:8px 0}
[hidden]{display:none!important}
@media(max-width:650px){
  main{padding:15px}
  .hours{grid-template-columns:90px 1fr 1fr}
}
</style>
</head>
<body>
<main>
<header>
  <strong>SGC NETWORK · PRODUCT ADMIN</strong>
  <nav>
    <a href="admin.html">Main admin</a>
    <a href="../shop.html">View shop</a>
  </nav>
</header>

<section class="hero">
  <h1>Your products. Your schedule.</h1>
  <p id="identity"></p>
  <p>Manage learning resources, bookable assistance, coaching and student tasks.</p>
</section>

<p id="status" class="notice" role="status" aria-live="polite"></p>

<section id="login" hidden>
  <h2>Admin sign-in</h2>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button>Sign in</button>
  </form>
</section>

<div id="app" hidden>
  <nav>
    <button id="products-tab">Products</button>
    <button id="calendar-tab">Calendar connection</button>
    <button id="bookings-tab">Bookings</button>
    <button id="tasks-tab">Student tasks</button>
  </nav>
  <div id="content"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const sb = window.supabase?.createClient(
  'https://bxpexanyoyubxeqqlggh.supabase.co',
  'sb_publishable_Z0_Y-Bj_G5qw4hMgDbQlgA__jj8rGGq'
);

const categories = [
  ['memberships','Memberships & kits'],
  ['extras','Extras'],
  ['addons','Add-ons'],
  ['assistance','Assistance'],
  ['coaching','Personal coaching'],
  ['manuals','Manuals'],
  ['textbooks','Textbooks']
];

let user;
let products = [];
let hosts = [];
let methods = [];
let editing = null;
let busy = false;
let dirty = false;

function n(tag,text,cls) {
  const e = document.createElement(tag);
  if(text !== undefined) e.textContent = text;
  if(cls) e.className = cls;
  return e;
}

function check(r) {
  if(r.error) throw Error(r.error.message);
  return r.data;
}

async function admin(action,id=null,data={}) {
  return check(await sb.rpc('sgc_catalog_admin',{
    p_action:action,
    p_id:id,
    p_data:data
  }));
}

async function consoleRpc(table,action='list',record={},id=null,offset=0) {
  return check(await sb.rpc('sgc_console',{
    p_table:table,
    p_action:action,
    p_record:record,
    p_id:id,
    p_offset:offset
  }));
}

async function all(table) {
  let rows = [];
  let offset = 0;
  while(true) {
    const page = await consoleRpc(table,'list',{},null,offset);
    rows.push(...page);
    if(page.length < 200) return rows;
    offset += 200;
  }
}

async function api(body) {
  const r = await sb.functions.invoke('sgc-bookings',{body});
  if(r.error) {
    let msg = r.error.message;
    try {
      msg = (await r.error.context.json()).error || msg;
    } catch {}
    throw Error(msg);
  }
  if(r.data?.error) throw Error(r.data.error);
  return r.data;
}

async function act(fn) {
  if(busy) return;
  busy = true;
  const controls = [...document.querySelectorAll('button')];
  controls.forEach(b => b.disabled = true);
  $('status').textContent = 'Working…';

  try {
    await fn();
    if($('status').textContent === 'Working…') {
      $('status').textContent = '';
    }
  } catch(e) {
    $('status').textContent = e.message;
  } finally {
    busy = false;
    controls.forEach(b => b.disabled = false);
  }
}

function guard() {
  return !dirty || confirm('Discard unsaved product changes?');
}

function button(text,fn) {
  const b = n('button',text);
  b.type = 'button';
  b.onclick = () => act(fn);
  return b;
}

function field(root,label,id,value='',type='text') {
  const l = n('label',label);
  l.htmlFor = id;
  const e = n(type === 'textarea' ? 'textarea' : 'input');
  e.id = id;
  if(type !== 'textarea') e.type = type;
  e.value = value;
  root.append(l,e);
  return e;
}

function select(root,label,id,options,value) {
  const l = n('label',label);
  l.htmlFor = id;
  const e = n('select');
  e.id = id;
  for(const [v,t] of options) {
    const o = n('option',t);
    o.value = v;
    e.append(o);
  }
  e.value = value;
  root.append(l,e);
  return e;
}

function number(root,label,id,value,min,max) {
  const e = field(root,label,id,value,'number');
  e.min = min;
  e.max = max;
  e.required = true;
  return e;
}

async function reload() {
  [products,hosts,methods] = await Promise.all([
    admin('products'),
    admin('hosts'),
    all('sgc_payment_methods')
  ]);
}

async function productsView() {
  await reload();
  dirty = false;
  renderEditor();
}

function renderEditor() {
  const root = $('content');
  root.replaceChildren();

  const panel = n('section');
  root.append(panel);

  const choose = select(
    panel,'Choose product','product-choice',
    [
      ['','+ Add new product'],
      ...products.map(p => [
        p.id,
        p.name + (p.active ? ' · live' : ' · draft')
      ])
    ],
    editing?.id || ''
  );

  choose.onchange = () => {
    if(!guard()) {
      choose.value = editing?.id || '';
      return;
    }
    dirty = false;
    editing = products.find(p => p.id === choose.value) || null;
    renderEditor();
  };

  const p = editing || {};
  const s = p.settings || {};
  const ownAccess = p.access_level?.startsWith('product:')
    ? p.access_level
    : 'product:' + crypto.randomUUID();

  const form = n('form');
  panel.append(form);

  field(form,'Product name','name',p.name || '').required = true;
  field(form,'Unique slug (lowercase words with hyphens)','slug',p.slug || '').required = true;
  field(form,'Description','description',p.description || '','textarea');

  select(form,'Shop category','category',categories,s.category || 'extras');

  select(form,'Type of product','type',[
    ['digital','Digital resource'],
    ['video','Video'],
    ['pdf','PDF / manual'],
    ['presentation','Presentation'],
    ['meeting','Meeting'],
    ['call','Call'],
    ['coaching','Coaching'],
    ['membership','Membership'],
    ['kit','Kit']
  ],s.product_type || 'digital');

  select(form,'Delivery','delivery',[
    ['digital','Purchased digital resources'],
    ['appointment','Book a calendar slot'],
    ['task','Submit an assistance task']
  ],s.delivery || 'digital');

  select(form,'Card colour','colour',[
    ['yellow','Butter yellow'],
    ['pink','Pastel pink'],
    ['lavender','Lavender'],
    ['cream','Cream']
  ],s.colour || 'yellow');

  const price = number(
    form,
    'Price in ZAR — hourly rate for appointments, product price otherwise',
    'price',p.price_zar ?? 0,0,1000000
  );
  price.step = '.01';

  select(form,'Billing','billing',[
    ['once','Once-off'],
    ['monthly','Monthly — requires payment-provider subscription setup']
  ],p.billing || 'once');

  const access = [
    ['own','Only this product'],
    ['start','Start access'],
    ['build','Build access']
  ];

  for(const x of products) {
    if(x.access_level && !access.some(a => a[0] === x.access_level)) {
      access.push([x.access_level,x.name + ' access']);
    }
  }

  select(
    form,'Resource access level','access',access,
    p.access_level?.startsWith('product:') ? 'own' : p.access_level || 'own'
  );

  form.append(n(
    'p',
    'Only this product keeps files separate. Start / Build shares files with that membership. Appointments are charged once per slot; monthly recurring debits need a configured subscription provider.',
    'muted'
  ));

  field(
    form,'Stitch provider product code (if configured)',
    'provider',p.provider_code || ''
  );

  form.append(n('label','Payment methods'));
  const methodBox = n('div');

  for(const m of methods.filter(x => x.active)) {
    const l = n('label');
    const c = n('input');
    c.type = 'checkbox';
    c.value = m.id;
    c.checked = (p.payment_method_ids || []).includes(m.id);
    l.append(c,document.createTextNode(' ' + m.name));
    methodBox.append(l);
  }

  form.append(methodBox);

  if(!methodBox.children.length) {
    form.append(n(
      'p',
      'Add active payment methods in Main admin → Payment methods.',
      'muted'
    ));
  }

  const booking = n('section');
  booking.style.background = 'var(--lav)';
  booking.append(n('h3','Calendar availability'));

  select(
    booking,'Calendar','host',
    hosts.map(h => [
      h.id,
      h.label + (h.connected ? ' · connected' : ' · not connected')
    ]),
    s.host_id || hosts[0]?.id
  );

  number(booking,'Session duration (minutes)','duration',s.duration_minutes || 60,15,240);
  number(booking,'Break before and after each session (minutes)','buffer',s.buffer_minutes ?? 15,0,120);
  number(booking,'Minimum notice (minutes)','lead',s.lead_minutes ?? 120,0,43200);
  number(booking,'How many days ahead students can book','horizon',s.horizon_days || 30,1,90);

  booking.append(n(
    'p',
    'Working hours are in South African time. Slots start every 15 minutes.',
    'muted'
  ));

  const days = [
    'Sunday','Monday','Tuesday','Wednesday',
    'Thursday','Friday','Saturday'
  ];

  for(let d=0; d<7; d++) {
    const hours = s.working_hours?.[String(d)] ||
      (d>=1 && d<=5 && !s.working_hours ? ['09:00','17:00'] : null);

    const row = n('div',undefined,'hours');
    const label = n('label',days[d]);
    const cb = n('input');
    cb.type = 'checkbox';
    cb.id = 'day-' + d;
    cb.checked = !!hours;
    label.prepend(cb);

    const from = n('input');
    from.type = 'time';
    from.id = 'from-' + d;
    from.value = hours?.[0] || '09:00';
    from.setAttribute('aria-label',days[d] + ' start');

    const to = n('input');
    to.type = 'time';
    to.id = 'to-' + d;
    to.value = hours?.[1] || '17:00';
    to.setAttribute('aria-label',days[d] + ' end');

    row.append(label,from,to);
    booking.append(row);
  }

  field(
    booking,
    'Blocked dates — one YYYY-MM-DD date per line',
    'blocked',
    (s.blocked_dates || []).join('\n'),
    'textarea'
  );

  form.append(booking);

  select(form,'Publication','active',[
    ['false','Draft — hidden'],
    ['true','Published — visible in shop']
  ],String(p.active || false));

  form.append(n('button','Save product'));
  form.oninput = () => dirty = true;
  form.onchange = () => dirty = true;

  form.onsubmit = e => {
    e.preventDefault();

    act(async () => {
      const working = {};
      for(let d=0; d<7; d++) {
        if($('day-' + d).checked) {
          working[String(d)] = [
            $('from-' + d).value,
            $('to-' + d).value
          ];
        }
      }

      const saved = await admin('save',p.id || null,{
        product:{
          name:$('name').value.trim(),
          slug:$('slug').value.trim().toLowerCase(),
          description:$('description').value,
          price_zar:Number($('price').value),
          billing:$('billing').value,
          access_level:$('access').value === 'own'
            ? ownAccess
            : $('access').value,
          provider_code:$('provider').value.trim(),
          active:$('active').value === 'true',
          payment_method_ids:[
            ...methodBox.querySelectorAll('input:checked')
          ].map(x => x.value)
        },
        settings:{
          category:$('category').value,
          product_type:$('type').value,
          colour:$('colour').value,
          delivery:$('delivery').value,
          host_id:$('host').value,
          duration_minutes:Number($('duration').value),
          buffer_minutes:Number($('buffer').value),
          lead_minutes:Number($('lead').value),
          horizon_days:Number($('horizon').value),
          working_hours:working,
          blocked_dates:$('blocked').value
            .split(/[\n,]/)
            .map(x => x.trim())
            .filter(Boolean)
        }
      });

      dirty = false;
      await reload();
      editing = products.find(x => x.id === saved.id);
      renderEditor();
      $('status').textContent =
        'Saved. Refresh the student shop to see published changes.';
    });
  };

  function deliveryVisibility() {
    booking.hidden = $('delivery').value !== 'appointment';
  }

  deliveryVisibility();
  $('delivery').addEventListener('change',deliveryVisibility);

  if(p.id) {
    const resources = n('section');
    resources.append(n('h3','Private resource uploads'));

    const upload = n('input');
    upload.type = 'file';
    upload.accept = '.mp4,.pdf,.ppt,.pptx,.txt';

    resources.append(
      upload,
      n('p','Maximum 50 MB per file. Files are available only after the required access.','muted')
    );

    const list = n('div');

    resources.append(
      button('Upload selected file',async () => {
        const f = upload.files[0];
        if(!f) throw Error('Choose a file.');
        if(f.size > 52428800) throw Error('Maximum size is 50 MB.');

        const ext = f.name.split('.').pop().toLowerCase();
        const types = {
          mp4:['video','video/mp4'],
          pdf:['pdf','application/pdf'],
          ppt:['presentation','application/vnd.ms-powerpoint'],
          pptx:[
            'presentation',
            'application/vnd.openxmlformats-officedocument.presentationml.presentation'
          ],
          txt:['text','text/plain']
        };

        if(!types[ext]) {
          throw Error('Choose MP4, PDF, PPT, PPTX or TXT.');
        }

        const path = user.id + '/' + p.id + '/' +
          crypto.randomUUID() + '.' + ext;

        check(await sb.storage.from('sgc-products').upload(path,f,{
          contentType:types[ext][1],
          upsert:false
        }));

        try {
          await consoleRpc('sgc_product_files','insert',{
            product_id:p.id,
            title:f.name,
            path,
            kind:types[ext][0]
          });
        } catch(e) {
          await sb.storage.from('sgc-products').remove([path]);
          throw e;
        }

        upload.value = '';
        await filesView(p.id,list);
        $('status').textContent = 'File uploaded.';
      }),
      list
    );

    root.append(resources);

    filesView(p.id,list).catch(e => {
      $('status').textContent = e.message;
    });
  }
}

async function filesView(id,list) {
  const files = (await all('sgc_product_files'))
    .filter(f => f.product_id === id);

  list.replaceChildren();

  for(const f of files) {
    const row = n('p');
    row.append(
      document.createTextNode(f.title + ' '),
      button('Remove',async () => {
        if(!confirm('Remove this file from the product?')) return;
        await consoleRpc('sgc_product_files','delete',{},f.id);

        const deleted = await sb.storage
          .from('sgc-products').remove([f.path]);

        await filesView(id,list);
        $('status').textContent = deleted.error
          ? 'File unlinked; storage cleanup failed.'
          : 'File removed.';
      })
    );
    list.append(row);
  }

  if(!files.length) list.append(n('p','No uploaded files yet.'));
}

async function calendarView() {
  dirty = false;
  hosts = await admin('hosts');
  const root = $('content');
  root.replaceChildren();

  for(const h of hosts) {
    const section = n('section');
    section.append(
      n('h2',h.label),
      n('p',h.calendar_id),
      n('p',h.connected
        ? 'Google Calendar connected.'
        : 'Google Calendar needs authorisation.'),
      button(
        h.connected ? 'Reconnect Google Calendar' : 'Connect Google Calendar',
        async () => {
          const data = await api({
            action:'connect_calendar',
            host_id:h.id
          });
          const url = new URL(data.url);
          if(url.origin !== 'https://accounts.google.com') {
            throw Error('Invalid Google link.');
          }
          location.assign(url.href);
        }
      )
    );
    root.append(section);
  }

  root.append(n(
    'p',
    'This version connects the SGC Google account. Set Google OAuth server secrets before connecting.',
    'muted'
  ));
}

async function bookingsView() {
  dirty = false;
  const rows = await admin('bookings');
  const root = $('content');
  root.replaceChildren();
  root.append(button('Refresh bookings',bookingsView));

  for(const b of rows) {
    const section = n('section');

    section.append(
      n('h3',b.name),
      n('p',b.email),
      n('p',
        new Date(b.starts_at).toLocaleString('en-ZA',{
          timeZone:'Africa/Johannesburg'
        }) + ' · R' + Number(b.amount_zar).toFixed(2)
      ),
      n('p','Booking: ' + b.status + ' · Payment: ' + b.payment_status),
      n('p',b.notes || '','notice')
    );

    if(b.last_error) section.append(n('p',b.last_error,'notice'));

    if(b.payment_status === 'pending' && b.status === 'hold') {
      section.append(button('Verify received payment',async () => {
        const note = prompt('Record how you verified the actual payment.');
        if(!note) return;
        await api({
          action:'admin_confirm',
          booking_id:b.id,
          note
        });
        await bookingsView();
        $('status').textContent =
          'Payment recorded. Check the booking status below.';
      }));
    }

    if(['paid_pending_calendar','cancel_pending'].includes(b.status)) {
      section.append(button('Retry calendar update',async () => {
        await api({action:'retry',booking_id:b.id});
        await bookingsView();
      }));
    }

    if(!['cancelled','expired'].includes(b.status)) {
      section.append(button('Cancel booking',async () => {
        if(!confirm('Cancel this booking? Any refund must be handled separately.')) return;
        await api({action:'cancel',booking_id:b.id});
        await bookingsView();
      }));
    }

    root.append(section);
  }

  if(!rows.length) root.append(n('section','No bookings yet.'));
}

async function tasksView() {
  dirty = false;
  const rows = await admin('tasks');
  const root = $('content');
  root.replaceChildren();
  root.append(button('Refresh tasks',tasksView));

  for(const t of rows) {
    const card = n('section');

    card.append(
      n('h3',t.name),
      n('p',t.email),
      n('p',t.body,'notice')
    );

    const status = select(
      card,'Task status','task-' + t.id,[
        ['requested','Requested'],
        ['in_progress','In progress'],
        ['completed','Completed'],
        ['cancelled','Cancelled']
      ],
      t.status
    );

    card.append(button('Save task status',async () => {
      await admin('task_update',t.id,{status:status.value});
      $('status').textContent = 'Task updated.';
    }));

    root.append(card);
  }

  if(!rows.length) root.append(n('section','No student tasks yet.'));
}

for(const [id,fn] of [
  ['products-tab',productsView],
  ['calendar-tab',calendarView],
  ['bookings-tab',bookingsView],
  ['tasks-tab',tasksView]
]) {
  $(id).onclick = () => {
    if(guard()) act(fn);
  };
}

window.addEventListener('beforeunload',e => {
  if(dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

$('login-form').onsubmit = e => {
  e.preventDefault();
  act(async () => {
    check(await sb.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    }));
    $('password').value = '';
    await start();
  });
};

async function start() {
  if(!sb) throw Error('Supabase could not load.');
  user = (await sb.auth.getUser()).data.user;

  if(!user) {
    $('login').hidden = false;
    return;
  }

  if(check(await sb.rpc('sgc_extra_is_admin')) !== true) {
    throw Error('This account does not have admin access.');
  }

  $('login').hidden = true;
  $('app').hidden = false;
  $('identity').textContent = 'Signed in as ' + user.email;

  await productsView();

  if(new URLSearchParams(location.search).get('calendar') === 'connected') {
    $('status').textContent = 'Google Calendar connected.';
  }
}

start().catch(e => {
  $('status').textContent = e.message;
});
</script>
</body>
</html>
