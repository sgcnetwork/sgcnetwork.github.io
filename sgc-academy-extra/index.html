<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>SGC Academy</title><body><aside><div class="brand">SGC NETWORK</div><div class="eyebrow">ACADEMY</div><nav><a href="index.html">Learn</a><a href="admin.html">Admin studio</a><a href="/">Website</a></nav><small>LEARN · APPLY<br>IMPLEMENT · REVIEW</small></aside><main><header><div><span class="eyebrow">YOUR NEXT CHAPTER</span><h1>Build while you learn.</h1></div><button id="logout" class="secondary" hidden>Sign out</button></header><p id="status" role="status" aria-live="polite"></p><section id="login" class="panel"><h2>Welcome back.</h2><p class="muted">Sign in with your existing Academy account.</p><form id="loginform"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button> <button type="button" id="reset" class="secondary">Reset password</button></form></section><form id="newpass" hidden class="panel"><h2>Choose your new password</h2><input id="replacement" type="password" minlength="8" required autocomplete="new-password"><button>Save password</button></form><div id="student" hidden><p class="muted">Your classroom, implementation work and next steps, in one place.</p><div id="catalog" class="grid"></div><section id="reader" class="panel" hidden><span id="module" class="eyebrow"></span><h2 id="title"></h2><div id="media"></div><pre id="body" class="content"></pre><div id="downloads" class="row"></div><h2>Make it yours.</h2><p id="prompt"></p><form id="responseform"><label>Your implementation notes<textarea id="answer" required></textarea></label><label class="row"><input id="completed" type="checkbox"> Mark this section complete</label><br><button>Save my work</button></form></section></div></main><script src="config.js"></script><script src="app.js"></script></body></html>
