<title>SGC Business Admin</title>
<style>
:root{--bg:#0b0b0b;--panel:#151513;--gold:#c6a354;--line:#333027;--text:#f5efe1;--muted:#aaa394}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
a{color:var(--gold)}
[hidden]{display:none!important}
aside{position:fixed;width:230px;inset:0 auto 0 0;background:#10100e;border-right:1px solid var(--line);padding:24px;overflow:auto}
h1,h2,h3{font-family:Georgia,serif}
h1{font-size:34px}
h2{font-size:26px}
.brand{font:25px Georgia,serif;color:var(--gold);letter-spacing:.12em}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.nav{display:block;width:100%;background:none;border:0;color:var(--muted);text-align:left;padding:13px 0}
.nav.active{color:var(--gold)}
main{margin-left:230px;padding:28px;max-width:1700px}
.panel{background:var(--panel);border:1px solid var(--line);padding:24px;margin-bottom:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.btn{padding:11px 16px;background:var(--gold);border:1px solid var(--gold);color:#111}
.btn.alt{background:none;color:var(--gold)}
label{display:block;color:var(--muted);font-size:12px;margin:15px 0 7px}
input,textarea,select{width:100%;background:#0c0c0b;color:var(--text);padding:12px;border:1px solid var(--line)}
input[type=checkbox]{width:20px}
textarea{min-height:100px;line-height:1.6}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td{max-width:330px;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
.table-wrap{overflow:auto}
dialog{width:min(760px,95vw);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--gold)}
dialog::backdrop{background:#000b}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
.module{min-height:140px;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:22px}
.module strong{display:block;font:23px Georgia,serif;margin:12px 0}
.pill{color:var(--gold);font-size:11px}
#login{max-width:460px;margin:80px auto}
#ai-result{min-height:200px}
.classroom{display:grid;grid-template-columns:180px minmax(280px,1.6fr) minmax(270px,1fr);gap:18px;align-items:start}
.classroom .panel{padding:18px}
.lesson-list .btn{display:block;width:100%;text-align:left;margin:8px 0}
.media{aspect-ratio:16/9;background:linear-gradient(120deg,#10100c,#24200f);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:18px 0;overflow:hidden}
.media video,.media iframe{width:100%;height:100%;border:0}
.media-brand{font:70px Georgia;color:#73602c}
.sticky{background:#f2c9d6;color:#39272f;padding:18px;transform:rotate(-1deg);margin:24px 0 12px;box-shadow:3px 4px 0 #0003}
.sticky p{font:20px Georgia;line-height:1.5}
.sticky small{font-size:10px;letter-spacing:.1em}
.resource-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.question-edit{border:1px solid var(--line);padding:15px;margin:15px 0}
.tick{display:flex;gap:8px;align-items:center;font-size:14px}
.post-image{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:12px 0}
.comment{padding:10px 16px;border-left:2px solid var(--gold);margin:12px 0}
@media(max-width:1250px){.classroom{grid-template-columns:140px 1fr}.classroom>section:last-child{grid-column:2}}
@media(max-width:800px){.classroom{display:block}.lesson-list .btn{width:auto;display:inline-block}.classroom .panel{margin:15px 0}}
@media(max-width:750px){aside{position:static;width:100%}#menu{display:flex;flex-wrap:wrap;gap:12px}.nav{width:auto}main{margin:0;padding:16px}}
</style>

<script type="text/plain" id="setup-sql">
BEGIN;
CREATE OR REPLACE FUNCTION public.sgc_extra_base_has_product(level text)
RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path='' AS $$
 SELECT public.sgc_extra_is_demo() OR EXISTS(
   SELECT 1 FROM public.sgc_access_grants g WHERE g.user_id=auth.uid() AND g.active
   AND g.starts_at<=now() AND (g.ends_at IS NULL OR g.ends_at>now())
   AND (g.access_level=level OR (level='start' AND g.access_level='build'))
 ) OR EXISTS(
   SELECT 1 FROM public.memberships m WHERE m.user_id=auth.uid() AND m.status::text='active'
   AND m.started_at<=now() AND (m.current_period_end IS NULL OR m.current_period_end>now())
   AND ((level='start' AND m.membership_type::text IN ('start','build'))
        OR (level='build' AND m.membership_type::text='build'))
 ) OR EXISTS(
   SELECT 1 FROM public.customer_kits ck JOIN public.kits k ON k.id=ck.kit_id
   WHERE ck.user_id=auth.uid() AND ck.status::text IN ('active','unlocked')
   AND ck.total_price_zar>0 AND ck.amount_paid_zar>=ck.total_price_zar
   AND level='kit:'||lower(k.name)
 );
$$;

CREATE OR REPLACE FUNCTION public.sgc_feature_allowed(p_feature text)
RETURNS boolean LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path='' AS $$
DECLARE c jsonb; s jsonb; b jsonb;
BEGIN
 IF public.sgc_extra_is_demo() THEN RETURN true; END IF;
 SELECT content_value::jsonb INTO c FROM public.site_content WHERE content_key='sgc.memberships' LIMIT 1;
 s:=COALESCE(c->'start'->'features','["business_classes","qa","community"]'::jsonb);
 b:=COALESCE(c->'build'->'features','["recorded_lessons","live_discussions"]'::jsonb);
 RETURN (public.sgc_extra_base_has_product('start') AND s ? p_feature)
 OR (public.sgc_extra_base_has_product('build') AND (b ? p_feature OR (COALESCE((c->'build'->>'inherits_start')::boolean,true) AND s ? p_feature)))
 OR public.sgc_extra_base_has_product('feature:'||p_feature);
END;
$$;

CREATE OR REPLACE FUNCTION public.sgc_extra_has_product(level text)
RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path='' AS $$
 SELECT CASE WHEN level LIKE 'feature:%' THEN public.sgc_feature_allowed(substr(level,9)) ELSE public.sgc_extra_base_has_product(level) END;
$$;

CREATE OR REPLACE FUNCTION public.sgc_admin_v2(p_action text,p_data jsonb DEFAULT '{}'::jsonb)
RETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$
DECLARE r jsonb; q jsonb; lid uuid; mid integer; k text; rid uuid; oldkey text; plan text; prod uuid; c jsonb; cfg jsonb;
BEGIN
 IF NOT public.sgc_extra_is_admin() THEN RAISE EXCEPTION 'Admin access required'; END IF;
 IF p_action='version' THEN RETURN '2'::jsonb; END IF;
 IF p_action='save_lesson' THEN
  r:=p_data->'lesson';
  IF length(trim(r->>'title'))=0 OR (r->>'module_no')::int NOT BETWEEN 1 AND 12 THEN RAISE EXCEPTION 'Enter a lesson title and valid module'; END IF;
  IF NOT EXISTS(SELECT 1 FROM public.sgc_console_modules WHERE module_no=(r->>'module_no')::int) THEN RAISE EXCEPTION 'Save the module first'; END IF;
  lid:=NULLIF(p_data->>'id','')::uuid;
  r:=public.sgc_console('sgc_extra_lessons',CASE WHEN lid IS NULL THEN 'insert' ELSE 'update' END,r,lid);
  lid:=(r->>'id')::uuid;
  IF jsonb_typeof(p_data->'questions')<>'array' THEN RAISE EXCEPTION 'Questions must be an array'; END IF;
  DELETE FROM public.sgc_quiz_questions WHERE lesson_id=lid AND NOT EXISTS(SELECT 1 FROM jsonb_array_elements(p_data->'questions') x WHERE NULLIF(x->>'id','')::uuid=sgc_quiz_questions.id);
  FOR q IN SELECT value FROM jsonb_array_elements(p_data->'questions') LOOP
   rid:=NULLIF(q->>'id','')::uuid;
   IF rid IS NOT NULL AND NOT EXISTS(SELECT 1 FROM public.sgc_quiz_questions WHERE id=rid AND lesson_id=lid) THEN RAISE EXCEPTION 'Question does not belong to this lesson'; END IF;
   PERFORM public.sgc_console('sgc_quiz_questions',CASE WHEN rid IS NULL THEN 'insert' ELSE 'update' END,(q-'id')||jsonb_build_object('lesson_id',lid),rid);
  END LOOP;
  k:='sgc.lesson.'||lid;
  SELECT id INTO rid FROM public.site_content WHERE content_key=k LIMIT 1;
  PERFORM public.sgc_console('site_content',CASE WHEN rid IS NULL THEN 'insert' ELSE 'update' END,jsonb_build_object('content_key',k,'content_type','json','content_value',(p_data->'settings')::text),rid);
  RETURN r;
 ELSIF p_action='publish_module' THEN
  mid:=(p_data->>'module_no')::int;
  IF NOT EXISTS(SELECT 1 FROM public.sgc_extra_lessons WHERE module_no=mid) THEN RAISE EXCEPTION 'Add and save a lesson before publishing'; END IF;
  IF EXISTS(SELECT 1 FROM public.sgc_extra_lessons WHERE module_no=mid AND length(trim(title))=0) THEN RAISE EXCEPTION 'Every lesson needs a title'; END IF;
  FOR r IN SELECT to_jsonb(l) FROM public.sgc_extra_lessons l WHERE module_no=mid LOOP
   PERFORM public.sgc_console('sgc_extra_lessons','update',jsonb_build_object('published',COALESCE((p_data->>'published')::boolean,true)),(r->>'id')::uuid);
  END LOOP;
  RETURN jsonb_build_object('published',COALESCE((p_data->>'published')::boolean,true));
 ELSIF p_action='save_memberships' THEN
  cfg:=p_data;
  FOR plan IN SELECT unnest(ARRAY['start','build']) LOOP
   c:=cfg->plan;
   IF (c->>'price_zar')::numeric<0 OR jsonb_typeof(c->'features')<>'array' THEN RAISE EXCEPTION 'Invalid membership settings'; END IF;
   prod:=NULLIF(c->>'product_id','')::uuid;
   IF prod IS NULL THEN SELECT id INTO prod FROM public.sgc_products WHERE access_level=plan AND billing='monthly' ORDER BY created_at LIMIT 1; END IF;
   IF prod IS NOT NULL AND NOT EXISTS(SELECT 1 FROM public.sgc_products WHERE id=prod AND access_level=plan AND billing='monthly') THEN RAISE EXCEPTION 'Invalid membership product'; END IF;
   r:=public.sgc_console('sgc_products',CASE WHEN prod IS NULL THEN 'insert' ELSE 'update' END,jsonb_build_object('name',c->>'name','slug','sgc-membership-'||plan,'description',COALESCE(c->>'description',''),'price_zar',(c->>'price_zar')::numeric,'billing','monthly','access_level',plan,'active',COALESCE((c->>'active')::boolean,true)),prod);
   cfg:=jsonb_set(cfg,ARRAY[plan,'product_id'],r->'id');
  END LOOP;
  SELECT id INTO rid FROM public.site_content WHERE content_key='sgc.memberships' LIMIT 1;
  PERFORM public.sgc_console('site_content',CASE WHEN rid IS NULL THEN 'insert' ELSE 'update' END,jsonb_build_object('content_key','sgc.memberships','content_type','json','content_value',cfg::text),rid);
  RETURN cfg;
 ELSIF p_action='change_membership_access' THEN
  IF p_data->>'membership_type' NOT IN ('start','build') THEN RAISE EXCEPTION 'Select Start or Build'; END IF;
  UPDATE public.memberships SET membership_type=(p_data->>'membership_type')::public.membership_type,updated_at=now() WHERE id=(p_data->>'id')::uuid RETURNING to_jsonb(memberships.*) INTO r;
  IF r IS NULL THEN RAISE EXCEPTION 'Membership not found'; END IF;
  INSERT INTO public.sgc_console_audit(actor,action,table_name,record_id) VALUES(auth.uid(),'update_access','memberships',(r->>'id')::uuid);
  RETURN r;
 ELSIF p_action='broadcast_status' THEN
  SELECT COALESCE(jsonb_agg(t),'[]'::jsonb) INTO r FROM(SELECT email,status,error,updated_at FROM public.sgc_broadcast_deliveries WHERE campaign_id=(p_data->>'campaign_id')::uuid ORDER BY email) t; RETURN r;
 END IF;
 RAISE EXCEPTION 'Unknown admin action';
END;
$$;

DO $$ DECLARE c record; BEGIN
 FOR c IN SELECT conname FROM pg_constraint WHERE conrelid='public.sgc_extra_resources'::regclass AND contype='c' AND pg_get_constraintdef(oid) LIKE '%kind%' LOOP
  EXECUTE format('ALTER TABLE public.sgc_extra_resources DROP CONSTRAINT %I',c.conname);
 END LOOP;
END $$;
ALTER TABLE public.sgc_extra_resources ADD CONSTRAINT sgc_resource_kind_v2 CHECK(kind IN('video','download','admin','presentation'));
UPDATE storage.buckets SET allowed_mime_types=ARRAY['application/pdf','video/mp4','text/plain','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation'],file_size_limit=52428800 WHERE id='sgc-academy-extra';

INSERT INTO storage.buckets(id,name,public,file_size_limit,allowed_mime_types) VALUES('sgc-public-assets','sgc-public-assets',true,5242880,ARRAY['image/jpeg','image/png','image/webp']) ON CONFLICT(id) DO NOTHING;
DROP POLICY IF EXISTS sgc_assets_admin_insert ON storage.objects;
CREATE POLICY sgc_assets_admin_insert ON storage.objects FOR INSERT TO authenticated WITH CHECK(bucket_id='sgc-public-assets' AND public.sgc_extra_is_admin());
DROP POLICY IF EXISTS sgc_assets_admin_delete ON storage.objects;
CREATE POLICY sgc_assets_admin_delete ON storage.objects FOR DELETE TO authenticated USING(bucket_id='sgc-public-assets' AND public.sgc_extra_is_admin());

CREATE TABLE IF NOT EXISTS public.sgc_post_images(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),post_id uuid NOT NULL REFERENCES public.community_posts(id) ON DELETE CASCADE,path text UNIQUE NOT NULL);
ALTER TABLE public.sgc_post_images ENABLE ROW LEVEL SECURITY;
INSERT INTO storage.buckets(id,name,public,file_size_limit,allowed_mime_types) VALUES('sgc-community','sgc-community',false,5242880,ARRAY['image/jpeg','image/png','image/webp']) ON CONFLICT(id) DO NOTHING;
DROP POLICY IF EXISTS sgc_community_image_read ON storage.objects;
CREATE POLICY sgc_community_image_read ON storage.objects FOR SELECT TO authenticated USING(bucket_id='sgc-community' AND (public.sgc_extra_is_admin() OR EXISTS(SELECT 1 FROM public.sgc_post_images i JOIN public.community_posts p ON p.id=i.post_id WHERE i.path=storage.objects.name AND public.sgc_group_allowed(p.group_id))));
DROP POLICY IF EXISTS sgc_community_image_upload ON storage.objects;
CREATE POLICY sgc_community_image_upload ON storage.objects FOR INSERT TO authenticated WITH CHECK(bucket_id='sgc-community' AND (storage.foldername(name))[1]=auth.uid()::text AND public.sgc_extra_has_product('start'));
DROP POLICY IF EXISTS sgc_community_image_delete ON storage.objects;
CREATE POLICY sgc_community_image_delete ON storage.objects FOR DELETE TO authenticated USING(bucket_id='sgc-community' AND (public.sgc_extra_is_admin() OR (storage.foldername(name))[1]=auth.uid()::text));

CREATE OR REPLACE FUNCTION public.sgc_attach_post_image(p_post uuid,p_path text)
RETURNS void LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$
BEGIN
 IF NOT EXISTS(SELECT 1 FROM public.community_posts WHERE id=p_post AND user_id=auth.uid() AND public.sgc_group_allowed(group_id)) OR split_part(p_path,'/',1)<>auth.uid()::text OR NOT EXISTS(SELECT 1 FROM storage.objects WHERE bucket_id='sgc-community' AND name=p_path) THEN RAISE EXCEPTION 'Post image not allowed'; END IF;
 IF (SELECT count(*) FROM public.sgc_post_images WHERE post_id=p_post)>=5 THEN RAISE EXCEPTION 'Maximum five images per post'; END IF;
 INSERT INTO public.sgc_post_images(post_id,path) VALUES(p_post,p_path);
END;
$$;

DROP POLICY IF EXISTS sgc_post_images_read ON public.sgc_post_images;
CREATE POLICY sgc_post_images_read ON public.sgc_post_images FOR SELECT TO authenticated USING(public.sgc_extra_is_admin() OR EXISTS(SELECT 1 FROM public.community_posts p WHERE p.id=post_id AND public.sgc_group_allowed(p.group_id)));
GRANT SELECT ON public.sgc_post_images TO authenticated;

CREATE TABLE IF NOT EXISTS public.sgc_contact_preferences(email text PRIMARY KEY,unsubscribed boolean NOT NULL DEFAULT false);
CREATE TABLE IF NOT EXISTS public.sgc_broadcast_deliveries(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),campaign_id uuid NOT NULL REFERENCES public.sgc_email_campaigns(id),email text NOT NULL,status text NOT NULL DEFAULT 'pending' CHECK(status IN('pending','sending','sent','failed')),provider_id text,error text,unsubscribe_token uuid NOT NULL DEFAULT gen_random_uuid(),updated_at timestamptz NOT NULL DEFAULT now(),UNIQUE(campaign_id,email));
ALTER TABLE public.sgc_contact_preferences ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.sgc_broadcast_deliveries ENABLE ROW LEVEL SECURITY;

CREATE OR REPLACE FUNCTION public.sgc_broadcast_recipients(p_campaign uuid)
RETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$
DECLARE c public.sgc_email_campaigns; r jsonb;
BEGIN
 IF NOT public.sgc_extra_is_admin() THEN RAISE EXCEPTION 'Admin access required'; END IF;
 SELECT * INTO c FROM public.sgc_email_campaigns WHERE id=p_campaign;
 IF c.id IS NULL THEN RAISE EXCEPTION 'Campaign not found'; END IF;
 SELECT COALESCE(jsonb_agg(t ORDER BY t.email),'[]'::jsonb) INTO r FROM(
 WITH contacts AS(
 SELECT lower(trim(email)) AS email FROM auth.users WHERE email_confirmed_at IS NOT NULL AND email IS NOT NULL
 UNION SELECT lower(trim(email)) FROM public.sgc_academy_waitlist WHERE email_confirmed AND email IS NOT NULL
 UNION SELECT lower(trim(email)) FROM public.academy_waitlist WHERE email IS NOT NULL
 )
 SELECT DISTINCT x.email FROM contacts x WHERE x.email~'^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$'
 AND NOT EXISTS(SELECT 1 FROM public.sgc_contact_preferences p WHERE p.email=x.email AND p.unsubscribed)
 AND NOT EXISTS(SELECT 1 FROM auth.users u JOIN public.sgc_email_preferences e ON e.user_id=u.id WHERE lower(trim(u.email))=x.email AND e.unsubscribed)
 AND (c.category<>'marketing' OR EXISTS(SELECT 1 FROM auth.users u JOIN public.sgc_email_preferences e ON e.user_id=u.id WHERE lower(trim(u.email))=x.email AND e.marketing_opt_in AND NOT e.unsubscribed))
 )t; RETURN r;
END;
$$;

CREATE OR REPLACE FUNCTION public.sgc_broadcast_unsubscribe(p_token uuid)
RETURNS void LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$
DECLARE target text;
BEGIN
 SELECT email INTO target FROM public.sgc_broadcast_deliveries WHERE unsubscribe_token=p_token;
 IF target IS NULL THEN RAISE EXCEPTION 'Invalid unsubscribe link'; END IF;
 INSERT INTO public.sgc_contact_preferences(email,unsubscribed) VALUES(target,true) ON CONFLICT(email) DO UPDATE SET unsubscribed=true;
END;
$$;

REVOKE ALL ON FUNCTION public.sgc_admin_v2(text,jsonb),public.sgc_feature_allowed(text),public.sgc_extra_base_has_product(text),public.sgc_attach_post_image(uuid,text),public.sgc_broadcast_recipients(uuid),public.sgc_broadcast_unsubscribe(uuid) FROM PUBLIC,anon;
GRANT EXECUTE ON FUNCTION public.sgc_admin_v2(text,jsonb),public.sgc_feature_allowed(text),public.sgc_extra_base_has_product(text),public.sgc_attach_post_image(uuid,text),public.sgc_broadcast_recipients(uuid) TO authenticated;
GRANT EXECUTE ON FUNCTION public.sgc_broadcast_unsubscribe(uuid) TO service_role;

CREATE OR REPLACE FUNCTION public.sgc_broadcast_lock()
RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$
DECLARE cid uuid;
BEGIN
 IF TG_TABLE_NAME='sgc_email_campaigns' THEN cid:=OLD.id;
 ELSIF OLD.content_key LIKE 'sgc.campaign.%' THEN cid:=substr(OLD.content_key,14)::uuid;
 ELSE RETURN NEW; END IF;
 IF EXISTS(SELECT 1 FROM public.sgc_broadcast_deliveries WHERE campaign_id=cid) THEN RAISE EXCEPTION 'This broadcast has started. Create a new draft to change its contents'; END IF;
 RETURN NEW;
END;
$$;

DROP TRIGGER IF EXISTS sgc_broadcast_campaign_lock ON public.sgc_email_campaigns;
CREATE TRIGGER sgc_broadcast_campaign_lock BEFORE UPDATE ON public.sgc_email_campaigns FOR EACH ROW EXECUTE FUNCTION public.sgc_broadcast_lock();
DROP TRIGGER IF EXISTS sgc_broadcast_meta_lock ON public.site_content;
CREATE TRIGGER sgc_broadcast_meta_lock BEFORE UPDATE ON public.site_content FOR EACH ROW EXECUTE FUNCTION public.sgc_broadcast_lock();
NOTIFY pgrst,'reload schema';
COMMIT;
</script>

<script type="text/plain" id="setup-server">
import { createClient } from "npm:@supabase/supabase-js@2";

const cors = {
  "Access-Control-Allow-Origin": "https://sgcnetwork.co.za",
  "Access-Control-Allow-Headers": "authorization, apikey, content-type, x-client-info",
  "Access-Control-Allow-Methods": "POST, OPTIONS"
};

function response(data, status = 200) {
  return new Response(JSON.stringify(data), {
    status,
    headers: { ...cors, "Content-Type": "application/json" }
  });
}

function check(result) {
  if (result.error) throw result.error;
  return result.data;
}

async function remote(url, init) {
  const r = await fetch(url, {
    ...init,
    signal: AbortSignal.timeout(45000)
  });
  const data = await r.json();
  if (!r.ok) throw Error(data.error?.message || data.message || "Provider request failed");
  return data;
}

Deno.serve(async req => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: cors });

  if (req.method === "GET") {
    try {
      const token = new URL(req.url).searchParams.get("unsubscribe");
      if (!token || !/^[0-9a-f-]{36}$/i.test(token)) {
        return response({ error: "Invalid unsubscribe link" }, 400);
      }
      const service = createClient(
        Deno.env.get("SUPABASE_URL"),
        Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")
      );
      check(await service.rpc("sgc_broadcast_unsubscribe", { p_token: token }));
      return new Response("You have been unsubscribed from SGC Network broadcasts.", {
        headers: { ...cors, "Content-Type": "text/plain" }
      });
    } catch {
      return response({ error: "Invalid unsubscribe link" }, 400);
    }
  }

  if (req.method !== "POST") return response({ error: "POST required" }, 405);

  try {
    const url = Deno.env.get("SUPABASE_URL");
    const anon = Deno.env.get("SUPABASE_ANON_KEY");
    const authorization = req.headers.get("Authorization") || "";

    if (!authorization.startsWith("Bearer ")) {
      return response({ error: "Sign in required" }, 401);
    }

    const client = createClient(url, anon, {
      global: { headers: { Authorization: authorization } },
      auth: { persistSession: false, autoRefreshToken: false }
    });

    const token = authorization.slice(7);
    const { data: auth, error: authError } = await client.auth.getUser(token);
    if (authError || !auth.user || !auth.user.email_confirmed_at) {
      return response({ error: "Confirmed login required" }, 401);
    }

    const body = await req.json();

    if (body.action === "checkout") {
      const product = check(await client.from("sgc_products")
        .select("*").eq("id", body.product_id).eq("active", true).single());

      const method = check(await client.from("sgc_payment_methods")
        .select("*").eq("id", body.method_id).eq("active", true).single());

      if (!Array.isArray(product.payment_method_ids) ||
          !product.payment_method_ids.includes(method.id)) {
        throw Error("Payment method is not assigned to this product");
      }

      if (method.provider === "eft") {
        return response({
          instructions: method.instructions,
          amount_zar: product.price_zar,
          reference: auth.user.id + ":" + product.id
        });
      }

      if (!product.provider_code) {
        throw Error("This product needs a supported Stitch provider code");
      }

      const payment = await remote(url + "/functions/v1/create-stitch-payment", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: authorization,
          apikey: anon
        },
        body: JSON.stringify({
          amount: Number(product.price_zar),
          payerName: auth.user.user_metadata?.full_name || "SGC Customer",
          email: auth.user.email,
          userId: auth.user.id,
          product: product.provider_code,
          productName: product.name
        })
      });

      if (!payment.success || !payment.checkoutUrl) {
        throw Error(payment.error || "Checkout is not connected");
      }

      const destination = new URL(payment.checkoutUrl);
      const allowedHosts = (Deno.env.get("STITCH_CHECKOUT_HOSTS") || "")
        .split(",").map(x => x.trim()).filter(Boolean);

      if (destination.protocol !== "https:" ||
          !allowedHosts.includes(destination.hostname)) {
        throw Error("Set STITCH_CHECKOUT_HOSTS to the verified checkout host used by your existing Stitch function");
      }

      return response({ checkoutUrl: destination.href });
    }

    if (!check(await client.rpc("sgc_extra_is_admin"))) {
      return response({ error: "Admin access required" }, 403);
    }

    if (body.action === "ai") {
      const key = Deno.env.get("OPENAI_API_KEY");
      const model = Deno.env.get("OPENAI_MODEL");

      if (!key || !model) {
        throw Error("Set OPENAI_API_KEY and OPENAI_MODEL in Edge Function secrets");
      }

      if (typeof body.prompt !== "string" ||
          !body.prompt.trim() || body.prompt.length > 12000) {
        throw Error("Enter a prompt below 12000 characters");
      }

      const result = await remote("https://api.openai.com/v1/responses", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + key,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model,
          store: false,
          max_output_tokens: 2000,
          instructions: "Draft practical SGC Network teaching and business content for South Africa. Focus on implementation. Do not claim to publish, send emails, alter accounts or process payments. Return only a draft for admin review.",
          input: body.prompt
        })
      });

      return response({
        text: (result.output || [])
          .flatMap(o => o.content || [])
          .filter(c => c.type === "output_text")
          .map(c => c.text).join("\n") || "No text draft returned."
      });
    }

    if (body.action === "send_campaign") {
      const key = Deno.env.get("RESEND_API_KEY");
      const from = "SGC Network <noreply@sgcnetwork.co.za>";

      if (!key) throw Error("Set RESEND_API_KEY and verify sgcnetwork.co.za in Resend first");

      const campaign = check(await client.rpc("sgc_console", {
        p_table: "sgc_email_campaigns",
        p_action: "get",
        p_id: body.campaign_id
      }));

      if (!campaign) throw Error("Campaign not found");

      const service = createClient(
        url,
        Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
        { auth: { persistSession: false } }
      );

      const metaRow = check(await service.from("site_content")
        .select("content_value")
        .eq("content_key", "sgc.campaign." + campaign.id).maybeSingle());

      const meta = metaRow ? JSON.parse(metaRow.content_value) : {};

      const existing = check(await service.from("sgc_broadcast_deliveries")
        .select("id").eq("campaign_id", campaign.id).limit(1));

      if (!existing.length) {
        const recipients = check(await client.rpc("sgc_broadcast_recipients", {
          p_campaign: campaign.id
        }));

        if (!recipients.length) return response({ results: [], done: true, total: 0 });

        for (let i = 0; i < recipients.length; i += 200) {
          check(await service.from("sgc_broadcast_deliveries").upsert(
            recipients.slice(i, i + 200).map(r => ({
              campaign_id: campaign.id,
              email: r.email
            })),
            { onConflict: "campaign_id,email", ignoreDuplicates: true }
          ));
        }
      }

      const pending = check(await service.from("sgc_broadcast_deliveries")
        .select("*").eq("campaign_id", campaign.id)
        .eq("status", "pending").order("email").limit(10));

      const escape = s => String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));

      const asset = value => {
        const u = new URL(String(value));
        if (u.protocol !== "https:" ||
            u.origin !== new URL(url).origin ||
            !u.pathname.startsWith("/storage/v1/object/public/sgc-public-assets/")) {
          throw Error("Email images must be uploaded through this admin");
        }
        return u.href;
      };

      const imageHtml = (Array.isArray(meta.images) ? meta.images : [])
        .slice(0, 8).map(u =>
          '<p><img alt="SGC Network" style="max-width:100%;height:auto" src="' +
          escape(asset(u)) + '"></p>'
        ).join("");

      const signature = String(meta.signature ||
        "SGC Network\nIdeas into implementation.\nhttps://sgcnetwork.co.za");

      const results = [];

      for (const recipient of pending) {
        const prefs = check(await service.from("sgc_contact_preferences")
          .select("unsubscribed").eq("email", recipient.email).maybeSingle());

        const eligible = check(await client.rpc("sgc_broadcast_recipients", {
          p_campaign: campaign.id
        }));

        if (prefs?.unsubscribed || !eligible.some(r => r.email === recipient.email)) {
          check(await service.from("sgc_broadcast_deliveries").update({
            status: "failed",
            error: "Recipient no longer eligible"
          }).eq("id", recipient.id));
          continue;
        }

        const claimed = check(await service.from("sgc_broadcast_deliveries")
          .update({ status: "sending", updated_at: new Date().toISOString() })
          .eq("id", recipient.id).eq("status", "pending").select("id"));

        if (!claimed.length) continue;

        try {
          const unsubscribe = url + "/functions/v1/sgc-business?unsubscribe=" +
            recipient.unsubscribe_token;

          const sent = await remote("https://api.resend.com/emails", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + key,
              "Content-Type": "application/json",
              "Idempotency-Key": "sgc/" + campaign.id + "/" + recipient.id
            },
            body: JSON.stringify({
              from,
              to: [recipient.email],
              subject: campaign.subject,
              text: campaign.body + "\n\n" + signature +
                "\n\nManage email preferences: " + unsubscribe,
              html: '<div style="max-width:640px;margin:auto;font-family:Arial;line-height:1.7">' +
                '<h2>SGC Network</h2><div style="white-space:pre-wrap">' +
                escape(campaign.body) + "</div>" + imageHtml +
                '<hr><div style="white-space:pre-wrap">' +
                escape(signature) + '</div><p><a href="' +
                escape(unsubscribe) + '">Unsubscribe</a></p></div>'
            })
          });

          check(await service.from("sgc_broadcast_deliveries").update({
            status: "sent",
            provider_id: sent.id,
            updated_at: new Date().toISOString()
          }).eq("id", recipient.id));

          results.push({ email: recipient.email, status: "accepted by email provider" });
        } catch (err) {
          check(await service.from("sgc_broadcast_deliveries").update({
            status: "failed",
            error: err.message,
            updated_at: new Date().toISOString()
          }).eq("id", recipient.id));

          results.push({ email: recipient.email, status: "failed" });
        }

        await new Promise(resolve => setTimeout(resolve, 600));
      }

      const left = await service.from("sgc_broadcast_deliveries")
        .select("id", { count: "exact", head: true })
        .eq("campaign_id", campaign.id).eq("status", "pending");

      if (left.error) throw left.error;
      return response({ results, done: left.count === 0, remaining: left.count });
    }

    throw Error("Unknown action");
  } catch (err) {
    return response({
      error: err instanceof Error ? err.message : String(err?.message || err)
    }, 400);
  }
});
</script>

function n(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function check(r) {
  if (r.error) throw r.error;
  return r.data;
}
function say(text) { $("status").textContent = text; }

function safe(fn) {
  return async (...args) => {
    if (workingV2) return;
    workingV2 = true;
    const controls = [...document.querySelectorAll("button")].filter(x => !x.disabled);
    controls.forEach(x => x.disabled = true);
    try { await fn(...args); }
    catch (e) { say(e.message || String(e)); }
    finally {
      controls.forEach(x => { if (x.isConnected) x.disabled = false; });
      workingV2 = false;
    }
  };
}

function button(text, fn, alt = false) {
  const b = n("button", text, "btn" + (alt ? " alt" : ""));
  b.type = "button";
  b.onclick = safe(fn);
  return b;
}
function panel(title) {

async function rpc(table, action = "list", record = {}, id = null, start = 0) {

    p_table: table, p_action: action, p_record: record, p_id: id, p_offset: start
  }));
}

async function all(table) {
  let page, rows = [];
  do {
    page = await rpc(table, "list", {}, null, rows.length);
    rows.push(...page);
  } while (page.length === 200);
  return rows;
}

function parsedV2(value, fallback = {}) {
  try { return JSON.parse(value); }
  catch { return fallback; }
}

async function reloadV2() {
  contentV2 = await all("site_content");

  const result = await rpc("site_content", existing ? "update" : "insert", {

  for (const f of plansV2.features || []) {
    map.set("feature:" + f.key, "Feature: " + f.label);
  }
  return [...map];
}

function selectV2(options, value) {
  const s = n("select");
  for (const [v, label] of options) {
    const o = n("option", label);
    o.value = v;
    s.append(o);
  }
  if (value && !options.some(x => x[0] === value)) {
    const o = n("option", value + " (existing access)");
    o.value = value;
    s.append(o);
  }
  s.value = value || options[0]?.[0] || "";
  return s;
}

function fieldV2(parent, label, value = "", kind = "text") {
  const l = n("label", label);
  const input = n(kind === "area" ? "textarea" : "input");
  if (kind !== "area") input.type = kind;
  input.value = value ?? "";
  parent.append(l, input);
  return input;
}

function tickV2(parent, label, value) {
  const l = n("label", undefined, "tick");
  const i = n("input");
  i.type = "checkbox";
  i.checked = !!value;
  l.append(i, document.createTextNode(" " + label));
  parent.append(l);
  return i;
}

}

async function openEditor(table, record = {}, defaults = {}) {
  await reloadV2();
  editContext = { table, record, defaults };
  $("fields").replaceChildren();
  $("edit-status").textContent = "";
  $("editor-title").textContent =
    (record.id ? "Edit " : "Add ") + table.replaceAll("_", " ");

  for (const [key, type] of Object.entries(schema[table])) {
    const id = "field-" + key;
    const label = n("label", key.replaceAll("_", " "));
    label.htmlFor = id;

    let input;
    const value = record[key] ?? defaults[key] ??
      (type === "bool" ? false : type === "number" ? 1 : type === "json" ? [] : "");

    if (key === "access_level") {
      input = selectV2(accessOptionsV2(), value || "start");
    } else if (table === "sgc_access_grants" && key === "user_id") {
      input = selectV2(
        (await all("students")).filter(x => x.email_confirmed_at).map(x => [x.id, x.email]),
        value
      );
    } else if (key === "payment_method_ids") {
      input = n("select");
      input.multiple = true;
      input.size = 5;
      for (const method of await all("sgc_payment_methods")) {
        const o = n("option", method.name + (method.active ? "" : " (inactive)"));
        o.value = method.id;
        o.selected = Array.isArray(value) && value.includes(method.id);
        input.append(o);
      }
    } else if (key === "correct_index") {
      input = selectV2(
        (record.options || defaults.options || []).map((text, i) =>
          [String(i), String(i + 1) + ". " + text]),
        String(value)
      );
    } else if (Array.isArray(type)) {
      input = selectV2(type.map(x => [x, x]), value || type[0]);
    } else {
      input = n(type === "area" || type === "json" ? "textarea" : "input");
      if (type === "bool") {
        input.type = "checkbox";
        input.checked = !!value;
      } else {
        if (input.tagName === "INPUT") input.type = type === "number" ? "number" : "text";
        if (type === "number") {
          input.step = key === "price_zar" ? "0.01" : "1";
          input.required = true;
        }
        input.value = key === "options" ? value.join("\n") :
          type === "json" ? JSON.stringify(value, null, 2) : value;
      }
    }

    input.id = id;
    input.name = key;
    $("fields").append(label, input);

    if (key === "access_level") {
      $("fields").append(n("p",
        "Select a membership, product or feature. Saving updates this record.", "muted"));
    }

    if (key === "options") {
      $("fields").append(n("p", "Enter 2–8 answers, one per line.", "muted"));
      input.oninput = () => {
        const target = $("field-correct_index");
        if (!target) return;
        const selected = target.value;
        target.replaceChildren();
        input.value.split("\n").filter(x => x.trim()).forEach((text, i) => {
          const o = n("option", String(i + 1) + ". " + text);
          o.value = String(i);
          target.append(o);
        });
        target.value = selected;
      };
    }

    if (key === "payment_method_ids") {
      $("fields").append(n("p",
        "Select the payment methods available for this product. Hold Ctrl to select more than one.",
        "muted"));
    }
  }
  $("editor").showModal();
}

function sgcReportLocalDate(value){

  const d=new Date(value);
  if(!Number.isFinite(d.getTime()))return null;
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Johannesburg',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const get=t=>p.find(x=>x.type===t)?.value||'';
  return get('year')+'-'+get('month')+'-'+get('day');
}
function sgcReportStatus(row){
  return String(row.status??row.payment_status??(row.active===true?'active':row.active===false?'inactive':'')).toLowerCase();
}
async function sgcReportFetch(source){
  // Students is a virtual source served by the existing admin console RPC.
  if(source==='students')return await all('students');
  // SQL RPC pages at 200; keep reading until all matching records are fetched.
  const rows=[];
  for(let start=0;;start+=200){
    const page=check(await sb.rpc('sgc_reports_read',{p_source:source,p_offset:start,p_limit:200}));
    if(!Array.isArray(page))throw Error('Unexpected response for '+source);
    rows.push(...page);
    if(page.length<200)break;
    if(start>=1000000)throw Error('Too many rows for browser export. Narrow the date range.');
  }
  return rows;
}

        else if(status.value==='active')sgcReportRows=allRows.filter(r=>!r.archived_in_admin&&['confirmed','paid','active','completed'].includes(sgcReportStatus(r)));
        else sgcReportRows=allRows;
      } else sgcReportRows=allRows;
      sgcReportColumns=[...new Set([...cfg.fields.filter(k=>sgcReportRows.some(r=>Object.prototype.hasOwnProperty.call(r,k))),...sgcReportRows.flatMap(r=>Object.keys(r))])];

      download.disabled=!sgcReportRows.length;renderPreview();
    }catch(err){summary.textContent='Report failed: '+err.message;results.replaceChildren();console.error(err);}
    finally{generate.disabled=false;}
  });
}

// CSV exports use full admin-authorized datasets, not just visible table pages.
function sgcDownloadCSV(filename, rows) {
  if (!Array.isArray(rows) || !rows.length) { alert('No records available to export.'); return; }
  const columns = [...new Set(rows.flatMap(r => Object.keys(r || {})))];
  const cell = value => {
    let str = value == null ? '' : typeof value === 'object' ? JSON.stringify(value) : String(value);
    // Prevent CSV formula injection when opened in Excel or other spreadsheet software.
    if (/^[\s\u0000-\u001f]*[=+@-]/.test(str)) str = "'" + str;
    return '"' + str.replace(/"/g, '""') + '"';
  };
  const csv = '\uFEFF' + [columns.map(cell).join(','), ...rows.map(row => columns.map(k => cell(row[k])).join(','))].join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename.replace(/[^a-zA-Z0-9_.-]/g,'_');
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function tableView(parent, table, rows, editable = true, extra) {
  const wrap = n("div", undefined, "table-wrap");

  const keys = rows.length ? Object.keys(rows[0]) : [];

  for (const k of keys) head.append(n("th", k.replaceAll("_", " ")));
  head.append(n("th", "Actions"));
  t.append(head);

  for (const row of rows) {
    const tr = n("tr");
    for (const k of keys) {
      const v = typeof row[k] === "object" && row[k] !== null ?
        JSON.stringify(row[k]) : String(row[k] ?? "");
      tr.append(n("td", v.length > 250 ? v.slice(0, 250) + "…" : v));
    }

    const actions = n("td");
    actions.append(button("View", () => {
      const p = panel("Record details");
      p.append(n("pre", JSON.stringify(row, null, 2)));
      p.scrollIntoView();
    }, true));

    if (editable && schema[table]) {
      actions.append(button("Edit", () => openEditor(table, row), true));

    if (editable && [
      "sgc_console_modules", "sgc_extra_lessons", "sgc_quiz_questions",
      "sgc_products", "sgc_payment_methods", "sgc_groups",
      "community_posts", "community_comments", "academy_messages"

        await show();

    }

    if (extra) extra(actions, row);

    t.append(tr);
  }

  wrap.append(t);
  parent.append(wrap);
  if (!rows.length) parent.append(n("p", "No records yet.", "muted"));

async function upload(parentId, isProduct) {
  const f = n("input");
  f.type = "file";
  f.accept = ".pdf,.mp4,.txt";
  const title = prompt("Resource title");
  if (!title) return;

  f.onchange = safe(async () => {
    const file = f.files[0];
    if (!file) return;
    if (file.size > 52428800) throw Error("Maximum upload size is 50 MB.");
    const ext = file.name.split(".").pop().toLowerCase();
    const kinds = { mp4: "video", pdf: "pdf", txt: "text" };
    const mime = { mp4: "video/mp4", pdf: "application/pdf", txt: "text/plain" };
    const kind = kinds[ext];
    if (!kind) throw Error("Choose a PDF, MP4 or text file.");
    if (!isProduct && kind === "text") throw Error("Put lesson text in its body field.");

    const bucket = isProduct ? "sgc-products" : "sgc-academy-extra";
    const path = parentId + "/" + crypto.randomUUID() + "." + ext;
    say("Uploading…");
    check(await sb.storage.from(bucket).upload(path, file, { contentType: mime[ext] }));

    try {
      await rpc(isProduct ? "sgc_product_files" : "sgc_extra_resources", "insert",
        isProduct ?
          { product_id: parentId, title, path, kind } :
          { lesson_id: parentId, title, path, kind: kind === "pdf" ? "download" : "video" });
    } catch (e) {
      await sb.storage.from(bucket).remove([path]);
      throw e;
    }
    await show();
    say("Uploaded and attached.");
  });
  f.click();
}

  }

  right.append(n("span", "IMPLEMENT · REFLECTION", "pill"));
  const reflection = fieldV2(right, "Reflection heading", settings.reflection_title);
  const intro = fieldV2(right, "Reflection introduction", settings.reflection_intro, "area");
  const promptInput = fieldV2(right, "Reflection instructions", selected.prompt, "area");

  right.append(n("h3", "Select-and-submit questions"));
  const questionList = n("div");
  right.append(questionList);
  let questionEditors = [];

  function addQuestion(q = {
    prompt: "", options: ["", ""], correct_index: 0, points: 1
  }) {
    const box = n("div", undefined, "question-edit");
    questionList.append(box);
    const question = fieldV2(box, "Question", q.prompt, "area");
    const opts = fieldV2(box, "Answers — one per line", q.options.join("\n"), "area");
    const correct = selectV2(
      q.options.map((x, i) => [String(i), (i + 1) + ". " + (x || "Answer")]),
      String(q.correct_index)
    );
    const points = fieldV2(box, "Points", q.points, "number");
    points.min = "1";
    points.step = "1";
    box.append(n("label", "Correct answer"), correct);

    opts.oninput = () => {
      const prev = correct.value;
      const replacement = selectV2(
        opts.value.split("\n").map(x => x.trim()).filter(Boolean)
          .map((x, i) => [String(i), (i + 1) + ". " + x]),
        prev
      );
      correct.replaceChildren(...replacement.children);
      correct.value = prev;
      dirtyV2 = true;
    };

    const item = { id: q.id, box, promptInput: question, opts, correct, points };
    questionEditors.push(item);
    box.append(button("Remove question", () => {
      box.remove();
      questionEditors = questionEditors.filter(x => x !== item);
      dirtyV2 = true;
    }, true));
  }

  qs.forEach(addQuestion);
  right.append(button("+ Add question", () => { addQuestion(); dirtyV2 = true; }, true));

  const status = n("p", selected.published ?
    "Currently published. Save draft to take this lesson offline while editing." :
    "Draft lesson. Publish when ready.", "muted");

  async function save(publish = false) {
    if (!title.value.trim()) throw Error("Enter a lesson topic");
    if (!Number.isInteger(Number(pos.value)) || Number(pos.value) < 1) {
      throw Error("Lesson order must be a positive whole number");
    }

    const questions = questionEditors.map((q, i) => {
      const options = q.opts.value.split("\n").map(x => x.trim()).filter(Boolean);
      const ci = q.correct.value === "" ? -1 : Number(q.correct.value);
      if (!q.promptInput.value.trim() || options.length < 2 || options.length > 8 ||
          !Number.isInteger(ci) || ci < 0 || ci >= options.length ||
          !Number.isInteger(Number(q.points.value)) || Number(q.points.value) < 1) {
        throw Error("Every question needs text, 2–8 answers, a selected correct answer and positive whole-number points.");
      }
      return {
        id: q.id || null, prompt: q.promptInput.value.trim(), options,
        correct_index: ci, points: Number(q.points.value), sort_order: i + 1
      };
    });

    if (external.value.trim() &&
        new URL(external.value.trim()).protocol !== "https:") {
      throw Error("Use an HTTPS video link");
    }

    const saved = await v2("save_lesson", {
      id: selected.id || null,
      lesson: {
        module_no: module.module_no, position: Number(pos.value),
        title: title.value.trim(), body: notes.value, prompt: promptInput.value,
        published: publish, access_level: access.value
      },
      questions,
      settings: {
        ...settings,
        reflection_title: reflection.value,
        reflection_intro: intro.value,
        video_url: external.value.trim(),
        media_path: mediaSelect.value || null
      }
    });

    selected.id = saved.id;
    dirtyV2 = false;
    status.textContent = publish ? "Lesson published." : "Draft saved.";
    return saved;
  }

  async function reopen(saved) {
    await reloadV2();
    const ll = (await all("sgc_extra_lessons"))
      .filter(x => x.module_no === module.module_no)
      .sort((a, b) => a.position - b.position);
    $("content").replaceChildren();
    await lessonWorkspaceV2(module, ll, ll.find(x => x.id === saved.id));
  }

  right.append(status);

  centre.append(button("Upload video / PDF / PowerPoint / workbook", async () => {
    const saved = await save(false);
    const input = n("input");
    input.type = "file";
    input.accept = ".mp4,.pdf,.ppt,.pptx";

    input.onchange = safe(async () => {
      const f = input.files[0];
      if (!f) return;
      if (f.size > 52428800) throw Error("Maximum file size is 50 MB");
      const ext = f.name.split(".").pop().toLowerCase();
      const mime = {
        mp4: "video/mp4", pdf: "application/pdf",
        ppt: "application/vnd.ms-powerpoint",
        pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
      }[ext];
      if (!mime) throw Error("Choose MP4, PDF, PPT or PPTX");

      const path = saved.id + "/" + crypto.randomUUID() + "." + ext;
      check(await sb.storage.from("sgc-academy-extra")
        .upload(path, f, { contentType: mime }));

      try {
        await rpc("sgc_extra_resources", "insert", {
          lesson_id: saved.id, title: f.name, path,
          kind: ext === "mp4" ? "video" : ext === "pdf" ? "download" : "presentation"
        });
      } catch (e) {
        await sb.storage.from("sgc-academy-extra").remove([path]);
        throw e;
      }
      await reopen(saved);
      say("Uploaded. Select this file as the lesson media if needed, then save.");
    });
    input.click();
  }));

  right.append(
    button("Save lesson draft", async () => {
      const saved = await save(false);
      await reopen(saved);
      say("Draft saved.");
    }),
    button("Save & publish lesson", async () => {
      const saved = await save(true);
      await reopen(saved);
      say("Lesson published.");
    }),
    button("Save & next lesson →", async () => {
      const saved = await save(false);
      await reloadV2();
      const ll = (await all("sgc_extra_lessons"))
        .filter(x => x.module_no === module.module_no)
        .sort((a, b) => a.position - b.position);
      const i = ll.findIndex(x => x.id === saved.id);
      $("content").replaceChildren();
      await lessonWorkspaceV2(module, ll, ll[i + 1] || {
        module_no: module.module_no,
        position: Math.max(...ll.map(x => x.position)) + 1,
        title: "", body: "", prompt: "", published: false, access_level: "build"
      });
    }),
    button("Save & publish entire module", async () => {
      await save(false);
      await v2("publish_module", { module_no: module.module_no, published: true });
      dirtyV2 = false;
      await show();
      say("Every saved lesson in this module is now published.");
    }),
    button("Unpublish module", async () => {
      if (!confirm("Take every lesson in this module offline?")) return;
      await v2("publish_module", { module_no: module.module_no, published: false });
      await show();
      say("Module unpublished.");
    }, true)
  );

  layout.querySelectorAll("input,textarea,select").forEach(i =>
    i.addEventListener("input", () => dirtyV2 = true));

  await mediaRefresh();
}

async function broadcastPreviewV2(campaign) {
  const p = panel("Review broadcast: " + campaign.subject);
  const meta = parsedV2(
    contentV2.find(x => x.content_key === "sgc.campaign." + campaign.id)?.content_value, {});

  const recipients = upgradeV2 ?
    check(await sb.rpc("sgc_broadcast_recipients", { p_campaign: campaign.id })) : [];

  p.append(
    n("p", "SGC Network <noreply@sgcnetwork.co.za> → ALL eligible contacts", "muted"),
    n("pre", campaign.body)
  );

  for (const url of meta.images || []) {
    const img = n("img");
    img.src = url;
    img.alt = "Email picture";
    img.className = "post-image";
    p.append(img);
  }

  p.append(
    n("pre", meta.signature || ""),
    n("p", recipients.length + " eligible contacts. Duplicate emails are combined.", "muted")
  );

  const names = n("details");
  names.append(n("summary", "Review recipient emails"),
    n("pre", recipients.map(x => x.email).join("\n")));
  p.append(names);

  const result = n("pre");
  p.append(result);
  let completed = false;

  const send = button("Send next 10 contacts", async () => {
    if (completed) return;
    if (!upgradeV2) throw Error("Run the database setup first");
    if (!confirm("Send this reviewed broadcast to the next batch of eligible contacts?")) return;
    const data = await invoke({ action: "send_campaign", campaign_id: campaign.id });
    result.textContent = JSON.stringify(data, null, 2);
    if (data.done) {
      completed = true;
      send.textContent = "All batches processed";
    }
  });

$("edit-form").onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  busy = true;
  const c = editContext;
  const submit = e.target.querySelector('button:not([type="button"])');
  if (submit) submit.disabled = true;

  try {
    const data = {};
    for (const [key, type] of Object.entries(schema[c.table])) {
      const input = $("field-" + key);
      data[key] = key === "options" ?
        input.value.split("\n").map(x => x.trim()).filter(Boolean) :
        key === "payment_method_ids" ? [...input.selectedOptions].map(o => o.value) :
        type === "bool" ? input.checked :
        type === "number" ? Number(input.value) :
        type === "json" ? JSON.parse(input.value) :
        type === "nullable" ? input.value.trim() || null : input.value;

      if (type === "number" && !Number.isFinite(data[key])) throw Error("Invalid " + key);
    }

    if (c.table === "sgc_quiz_questions") {
      if (data.options.length < 2 || data.options.length > 8) {
        throw Error("Enter 2–8 answers, one per line.");
      }
      if (!Number.isInteger(data.correct_index) ||
          data.correct_index < 0 || data.correct_index >= data.options.length) {
        throw Error("Select the correct answer.");
      }
      if (!Number.isInteger(data.points) || data.points < 1) {
        throw Error("Points must be a positive whole number.");
      }
    }

    await rpc(c.table, c.record.id ? "update" : "insert", data, c.record.id || null);
    $("editor").close();
    await show();
    say("Saved. Connected student pages load published updates on refresh.");
  } catch (err) {
    $("edit-status").textContent = err.message;
  } finally {
    busy = false;
    if (submit) submit.disabled = false;
  }
};

const SGCProducts = (() => {
const $ = id => document.getElementById('sgcp-' + id);
const categories = [
  ['memberships','Memberships & kits'],
  ['extras','Extras'],
  ['addons','Add-ons'],
  ['assistance','Assistance'],
  ['coaching','Personal coaching'],
  ['manuals','Manuals'],
  ['textbooks','Textbooks']
];

let user;
let products = [];
let hosts = [];
let methods = [];
let editing = null;
let busy = false;
let dirty = false;

function n(tag,text,cls) {
  const e = document.createElement(tag);
  if(text !== undefined) e.textContent = text;
  if(cls) e.className = cls;
  return e;
}

function check(r) {
  if(r.error) throw Error(r.error.message);
  return r.data;
}

async function admin(action,id=null,data={}) {
  return check(await sb.rpc('sgc_catalog_admin',{
    p_action:action,
    p_id:id,
    p_data:data
  }));
}

async function consoleRpc(table,action='list',record={},id=null,offset=0) {
  return check(await sb.rpc('sgc_console',{
    p_table:table,
    p_action:action,
    p_record:record,
    p_id:id,
    p_offset:offset
  }));
}

async function all(table) {
  let rows = [];
  let offset = 0;
  while(true) {
    const page = await consoleRpc(table,'list',{},null,offset);
    rows.push(...page);
    if(page.length < 200) return rows;
    offset += 200;
  }
}

async function api(body) {
  const r = await sb.functions.invoke('sgc-bookings',{body});
  if(r.error) {
    let msg = r.error.message;
    try {
      msg = (await r.error.context.json()).error || msg;
    } catch {}
    throw Error(msg);
  }
  if(r.data?.error) throw Error(r.data.error);
  return r.data;
}

async function act(fn) {
  if(busy) return;
  busy = true;
  const controls = [...document.getElementById('sgcp-manager').querySelectorAll('button')];
  controls.forEach(b => b.disabled = true);
  $('status').textContent = 'Working…';

  try {
    await fn();
    if($('status').textContent === 'Working…') {
      $('status').textContent = '';
    }
  } catch(e) {
    $('status').textContent = e.message;
  } finally {
    busy = false;
    controls.forEach(b => b.disabled = false);
  }
}

function guard() {
  return !dirty || confirm('Discard unsaved product changes?');
}

function button(text,fn) {
  const b = n('button',text);
  b.type = 'button';
  b.onclick = () => act(fn);
  return b;
}

function field(root,label,id,value='',type='text') {
  const l = n('label',label);
  l.htmlFor = 'sgcp-' + id;
  const e = n(type === 'textarea' ? 'textarea' : 'input');
  e.id = 'sgcp-' + id;
  if(type !== 'textarea') e.type = type;
  e.value = value;
  root.append(l,e);
  return e;
}

function select(root,label,id,options,value) {
  const l = n('label',label);
  l.htmlFor = 'sgcp-' + id;
  const e = n('select');
  e.id = 'sgcp-' + id;
  for(const [v,t] of options) {
    const o = n('option',t);
    o.value = v;
    e.append(o);
  }
  e.value = value;
  root.append(l,e);
  return e;
}

function number(root,label,id,value,min,max) {
  const e = field(root,label,id,value,'number');
  e.min = min;
  e.max = max;
  e.required = true;
  return e;
}

async function reload() {
  [products,hosts,methods] = await Promise.all([
    admin('products'),
    admin('hosts'),
    all('sgc_payment_methods')
  ]);
}

async function productsView() {
  await reload();
  dirty = false;
  renderEditor();
}

function renderEditor() {
  const root = $('content');
  root.replaceChildren();

  const panel = n('section');
  root.append(panel);

  const choose = select(
    panel,'Choose product','product-choice',
    [
      ['','+ Add new product'],
      ...products.map(p => [
        p.id,
        p.name + (p.active ? ' · live' : ' · draft')
      ])
    ],
    editing?.id || ''
  );

  choose.onchange = () => {
    if(!guard()) {
      choose.value = editing?.id || '';
      return;
    }
    dirty = false;
    editing = products.find(p => p.id === choose.value) || null;
    renderEditor();
  };

  const p = editing || {};
  const s = p.settings || {};
  const ownAccess = p.access_level?.startsWith('product:')
    ? p.access_level
    : 'product:' + crypto.randomUUID();

  const form = n('form');
  panel.append(form);

  field(form,'Product name','name',p.name || '').required = true;
  field(form,'Unique slug (lowercase words with hyphens)','slug',p.slug || '').required = true;
  field(form,'Description','description',p.description || '','textarea');

  select(form,'Shop category','category',categories,s.category || 'extras');

  select(form,'Type of product','type',[
    ['digital','Digital resource'],
    ['video','Video'],
    ['pdf','PDF / manual'],
    ['presentation','Presentation'],
    ['meeting','Meeting'],
    ['call','Call'],
    ['coaching','Coaching'],
    ['membership','Membership'],
    ['kit','Kit']
  ],s.product_type || 'digital');

  select(form,'Delivery','delivery',[
    ['digital','Purchased digital resources'],
    ['appointment','Book a calendar slot'],
    ['task','Submit an assistance task']
  ],s.delivery || 'digital');

  select(form,'Card colour','colour',[
    ['yellow','Butter yellow'],
    ['pink','Pastel pink'],
    ['lavender','Lavender'],
    ['cream','Cream']
  ],s.colour || 'yellow');

  const price = number(
    form,
    'Price in ZAR — total price for the selected session duration',
    'price',p.price_zar ?? 0,0,1000000
  );
  price.step = '.01';

  select(form,'Billing','billing',[
    ['once','Once-off'],
    ['monthly','Monthly — requires payment-provider subscription setup']
  ],p.billing || 'once');

  const access = [
    ['own','Only this product'],
    ['start','Start access'],
    ['build','Build access']
  ];

  for(const x of products) {
    if(x.access_level && !access.some(a => a[0] === x.access_level)) {
      access.push([x.access_level,x.name + ' access']);
    }
  }

  select(
    form,'Resource access level','access',access,
    p.access_level?.startsWith('product:') ? 'own' : p.access_level || 'own'
  );

  form.append(n(
    'p',
    'Only this product keeps files separate. Start / Build shares files with that membership. Appointments are charged once per slot; monthly recurring debits need a configured subscription provider.',
    'muted'
  ));

  field(
    form,'Stitch provider product code (if configured)',
    'provider',p.provider_code || ''
  );

  form.append(n('label','Payment methods'));
  const methodBox = n('div');

  for(const m of methods.filter(x => x.active)) {
    const l = n('label');
    const c = n('input');
    c.type = 'checkbox';
    c.value = m.id;
    c.checked = (p.payment_method_ids || []).includes(m.id);
    l.append(c,document.createTextNode(' ' + m.name));
    methodBox.append(l);
  }

  form.append(methodBox);

  if(!methodBox.children.length) {
    form.append(n(
      'p',
      'Add active payment methods in Main admin → Payment methods.',
      'muted'
    ));
  }

  const booking = n('section');
  booking.style.background = 'var(--lav)';
  booking.append(n('h3','Calendar availability'));

  select(
    booking,'Calendar','host',
    hosts.map(h => [
      h.id,
      h.label + (h.connected ? ' · connected' : ' · not connected')
    ]),
    s.host_id || hosts[0]?.id
  );

  number(booking,'Session duration (minutes)','duration',s.duration_minutes || 60,15,240);
  number(booking,'Break before and after each session (minutes)','buffer',s.buffer_minutes ?? 15,0,120);
  number(booking,'Minimum notice (minutes)','lead',s.lead_minutes ?? 120,0,43200);
  number(booking,'How many days ahead students can book','horizon',s.horizon_days || 30,1,90);

  booking.append(n(
    'p',
    'Working hours are in South African time. Slots start every 15 minutes.',
    'muted'
  ));

  const days = [
    'Sunday','Monday','Tuesday','Wednesday',
    'Thursday','Friday','Saturday'
  ];

  for(let d=0; d<7; d++) {
    const hours = s.working_hours?.[String(d)] ||
      (d>=1 && d<=5 && !s.working_hours ? ['09:00','17:00'] : null);

    const row = n('div',undefined,'hours');
    const label = n('label',days[d]);
    const cb = n('input');
    cb.type = 'checkbox';
    cb.id = 'sgcp-' + 'day-' + d;
    cb.checked = !!hours;
    label.prepend(cb);

    const from = n('input');
    from.type = 'time';
    from.id = 'sgcp-' + 'from-' + d;
    from.value = hours?.[0] || '09:00';
    from.setAttribute('aria-label',days[d] + ' start');

    const to = n('input');
    to.type = 'time';
    to.id = 'sgcp-' + 'to-' + d;
    to.value = hours?.[1] || '17:00';
    to.setAttribute('aria-label',days[d] + ' end');

    row.append(label,from,to);
    booking.append(row);
  }

  field(
    booking,
    'Blocked dates — one YYYY-MM-DD date per line',
    'blocked',
    (s.blocked_dates || []).join('\n'),
    'textarea'
  );

  form.append(booking);

  select(form,'Publication','active',[
    ['false','Draft — hidden'],
    ['true','Published — visible in shop']
  ],String(p.active || false));

  form.append(n('button','Save product'));
  form.oninput = () => dirty = true;
  form.onchange = () => dirty = true;

  form.onsubmit = e => {
    e.preventDefault();

    act(async () => {
      const working = {};
      for(let d=0; d<7; d++) {
        if($('day-' + d).checked) {
          working[String(d)] = [
            $('from-' + d).value,
            $('to-' + d).value
          ];
        }
      }

      const saved = await admin('save',p.id || null,{
        product:{
          name:$('name').value.trim(),
          slug:$('slug').value.trim().toLowerCase(),
          description:$('description').value,
          price_zar:Number($('price').value),
          billing:$('billing').value,
          access_level:$('access').value === 'own'
            ? ownAccess
            : $('access').value,
          provider_code:$('provider').value.trim(),
          active:$('active').value === 'true',
          payment_method_ids:[
            ...methodBox.querySelectorAll('input:checked')
          ].map(x => x.value)
        },
        settings:{
          category:$('category').value,
          product_type:$('type').value,
          colour:$('colour').value,
          delivery:$('delivery').value,
          host_id:$('host').value,
          duration_minutes:Number($('duration').value),
          buffer_minutes:Number($('buffer').value),
          lead_minutes:Number($('lead').value),
          horizon_days:Number($('horizon').value),
          working_hours:working,
          blocked_dates:$('blocked').value
            .split(/[\n,]/)
            .map(x => x.trim())
            .filter(Boolean)
        }
      });

      dirty = false;
      await reload();
      editing = products.find(x => x.id === saved.id);
      renderEditor();
      $('status').textContent =
        'Saved. Refresh the student shop to see published changes.';
    });
  };

  function deliveryVisibility() {
    booking.hidden = $('delivery').value !== 'appointment';
  }

  deliveryVisibility();
  $('delivery').addEventListener('change',deliveryVisibility);

  if(p.id) {
    const resources = n('section');
    resources.append(n('h3','Private resource uploads'));

    const upload = n('input');
    upload.type = 'file';
    upload.accept = '.mp4,.pdf,.ppt,.pptx,.txt';

    resources.append(
      upload,
      n('p','Maximum 50 MB per file. Files are available only after the required access.','muted')
    );

    const list = n('div');

    resources.append(
      button('Upload selected file',async () => {
        const f = upload.files[0];
        if(!f) throw Error('Choose a file.');
        if(f.size > 52428800) throw Error('Maximum size is 50 MB.');

        const ext = f.name.split('.').pop().toLowerCase();
        const types = {
          mp4:['video','video/mp4'],
          pdf:['pdf','application/pdf'],
          ppt:['presentation','application/vnd.ms-powerpoint'],
          pptx:[
            'presentation',
            'application/vnd.openxmlformats-officedocument.presentationml.presentation'
          ],
          txt:['text','text/plain']
        };

        if(!types[ext]) {
          throw Error('Choose MP4, PDF, PPT, PPTX or TXT.');
        }

        const path = user.id + '/' + p.id + '/' +
          crypto.randomUUID() + '.' + ext;

        check(await sb.storage.from('sgc-products').upload(path,f,{
          contentType:types[ext][1],
          upsert:false
        }));

        try {
          await consoleRpc('sgc_product_files','insert',{
            product_id:p.id,
            title:f.name,
            path,
            kind:types[ext][0]
          });
        } catch(e) {
          await sb.storage.from('sgc-products').remove([path]);
          throw e;
        }

        upload.value = '';
        await filesView(p.id,list);
        $('status').textContent = 'File uploaded.';
      }),
      list
    );

    root.append(resources);

    filesView(p.id,list).catch(e => {
      $('status').textContent = e.message;
    });
  }
}

async function filesView(id,list) {
  const files = (await all('sgc_product_files'))
    .filter(f => f.product_id === id);

  list.replaceChildren();

  for(const f of files) {
    const row = n('p');
    row.append(
      document.createTextNode(f.title + ' '),
      button('Remove',async () => {
        if(!confirm('Remove this file from the product?')) return;
        await consoleRpc('sgc_product_files','delete',{},f.id);

        const deleted = await sb.storage
          .from('sgc-products').remove([f.path]);

        await filesView(id,list);
        $('status').textContent = deleted.error
          ? 'File unlinked; storage cleanup failed.'
          : 'File removed.';
      })
    );
    list.append(row);
  }

  if(!files.length) list.append(n('p','No uploaded files yet.'));
}
