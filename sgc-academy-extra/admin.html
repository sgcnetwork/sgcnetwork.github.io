  root.replaceChildren();

  for(const h of hosts) {
    const section = n('section');
    section.append(
      n('h2',h.label),
      n('p',h.calendar_id),
      n('p',h.connected
        ? 'Google Calendar connected.'
        : 'Google Calendar needs authorisation.'),
      button(
        h.connected ? 'Reconnect Google Calendar' : 'Connect Google Calendar',
        async () => {
          const data = await api({
            action:'connect_calendar',
            host_id:h.id
          });
          const url = new URL(data.url);
          if(url.origin !== 'https://accounts.google.com') {
            throw Error('Invalid Google link.');
          }
          location.assign(url.href);
        }
      )
    );
    root.append(section);
  }

  root.append(n(
    'p',
    'This version connects the SGC Google account. Set Google OAuth server secrets before connecting.',
    'muted'
  ));
}

async function recordingApi(body){
 const r=await sb.functions.invoke('sgc-recordings',{body});
 if(r.error){let msg=r.error.message;try{msg=(await r.error.context.json()).error||msg;}catch{}throw Error(msg);}
 if(r.data?.error)throw Error(r.data.error);return r.data;
}
async function openAdminRecording(recordingId){
 const data=await recordingApi({action:'play',recording_id:recordingId});
 const url=new URL(data.url);
 if(url.protocol!=='https:'||url.hostname!=='drive.google.com')throw Error('Invalid Google Drive recording link.');
 const link=n('a','Open recording in Google Drive ↗');
 link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';
 link.click();
}
async function deleteAdminRecording(recordingId,title,refresh){
 if(!confirm('Delete "'+title+'" from SGC?\n\nThe student will lose access through their SGC dashboard immediately. The original Google Drive video will NOT be deleted.'))return;
 check(await sb.rpc('sgc_delete_meeting_recording',{p_recording:recordingId}));
 say('Recording deleted from SGC. Original Google Drive video unchanged.');
 await refresh();
}
async function recordingControls(card,booking){
 const rows=check(await sb.rpc('sgc_recordings_admin',{p_booking:booking.id}));
 if(booking.status==='confirmed')card.append(button('Attach Drive recording',async()=>{
  const drive_link=prompt('Paste the Google Drive video file link.');if(!drive_link)return;
  const title=prompt('Recording title',booking.name+' recording');if(!title)return;
  const saved=await recordingApi({action:'publish',booking_id:booking.id,drive_link,title});
  say('Published. Student access ends '+new Date(saved.student_expires_at).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'})+'.');
  card.append(n('p',saved.title+' — recording attached. Refresh this view to watch.'));
 }));
 for(const r of rows){
  const block=n('div');
  block.append(n('p',r.title+' · Student access '+(Date.parse(r.student_expires_at)>Date.now()?'until '+new Date(r.student_expires_at).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'}):'expired')+' · Admin access retained'));
  block.append(button('Watch recording',()=>openAdminRecording(r.id),true));
  block.append(button('Delete recording',()=>deleteAdminRecording(r.id,r.title,async()=>{
   block.remove();
  }),true));
  card.append(block);
 }
}
async function recordingLibraryView(){
 dirty=false;const root=$('content');root.replaceChildren();
 root.append(button('Back to meeting products',meetingProductsView));
 const rows=check(await sb.rpc('sgc_recordings_admin',{p_booking:null}));
 root.append(n('h2','SGC bookings recordings'));
  root.append(button('Download recordings CSV',()=>sgcDownloadCSV('SGC_recordings_'+new Date().toISOString().slice(0,10)+'.csv',rows)));
 if(!rows.length)root.append(n('p','No recordings attached yet. Record your call, upload it to Google Drive, then attach it under Bookings.'));
 for(const r of rows){
  const card=n('section');
  card.append(n('h3',r.title),n('p',r.booking_name),n('p','Student visibility ends: '+new Date(r.student_expires_at).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'})));
  card.append(button('Watch recording',()=>openAdminRecording(r.id),true));
  card.append(button('Delete recording',()=>deleteAdminRecording(r.id,r.title,recordingLibraryView),true));
  root.append(card);
 }
}
async function meetingProductsView() {
  dirty=false;await reload();
  const root=$('content');root.replaceChildren();
  const section=n('section');section.append(n('h2','Meeting products'));
  section.append(button('Bookings',bookingsView),button('Recordings library',recordingLibraryView));
  section.append(button('Add meeting product',async()=>{
    editing={settings:{category:'coaching',product_type:'meeting',delivery:'appointment',duration_minutes:60}};
    renderEditor();
  }));
  for(const product of products.filter(p=>p.settings?.delivery==='appointment')){
    const card=n('section');card.append(n('h3',product.name),n('p','R'+Number(product.price_zar).toFixed(2)+' / '+product.settings.duration_minutes+' minutes'),button('Edit meeting product',async()=>{editing=product;renderEditor();}));section.append(card);
  }
  if(!products.some(p=>p.settings?.delivery==='appointment'))section.append(n('p','No meeting products yet.'));
  root.append(section);
}

async function bookingsView() {
  dirty = false;
  const rows = await admin('bookings');
  const root = $('content');
  root.replaceChildren();
  root.append(button('Back to meeting products',meetingProductsView),button('Refresh bookings',bookingsView));
  root.append(button('Download ALL bookings CSV',async()=>{
    const allBookings=await admin('bookings');
    const archiveRows=check(await sb.rpc('sgc_admin_booking_archive',{p_action:'list'}))||[];
    const archivedIds=new Set(archiveRows.map(x=>typeof x==='string'?x:x.booking_id));
    sgcDownloadCSV('SGC_all_bookings_'+new Date().toISOString().slice(0,10)+'.csv',allBookings.map(b=>({...b,archived_in_admin:archivedIds.has(b.id)})));
  }));
  const archivedRows=check(await sb.rpc('sgc_admin_booking_archive',{p_action:'list'}))||[];
  const archivedIds=new Set(archivedRows.map(x=>typeof x==='string'?x:x.booking_id));
  let showArchived=false;
  const toggleArchive=button('Show archived bookings',()=>{
    showArchived=!showArchived;
    for(const entry of archiveEntries)entry.tr.hidden=showArchived?!entry.archived:entry.archived;
    toggleArchive.textContent=showArchived?'Show active bookings':'Show archived bookings';
  });
  root.append(toggleArchive);
  const archiveEntries=[];
  root.append(n('h2','Meeting bookings'));
  const styleId='sgc-bookings-table-styles';
  if(!document.getElementById(styleId)) {
    const st=n('style');st.id=styleId;
    st.textContent=`.sgc-bookings-wrap{width:100%;overflow-x:auto;margin-top:18px;border:1px solid #665a43;border-radius:12px}.sgc-bookings-table{width:100%;min-width:1420px;border-collapse:collapse;background:#111;color:#f7f1e6;font:13px/1.5 Arial,sans-serif}.sgc-bookings-table th{background:#28231c;color:#e9ce8a;text-align:left;white-space:nowrap;padding:13px 12px;position:sticky;top:0}.sgc-bookings-table td{padding:13px 12px;border-top:1px solid #413a30;vertical-align:top;max-width:240px;overflow-wrap:anywhere}.sgc-bookings-table tr:hover td{background:#1e1a16}.sgc-bookings-table .sgc-sub{display:block;font-size:11px;color:#b8b1a4;margin-top:4px}.sgc-bookings-table .sgc-actions{display:flex;flex-wrap:wrap;gap:6px;min-width:200px}.sgc-bookings-table .sgc-actions button{font-size:11px;padding:6px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}.sgc-bookings-table .sgc-complete{color:#a9e7bd;font-weight:bold}.sgc-bookings-table .sgc-comment{white-space:pre-wrap;max-width:240px}`;
    document.head.append(st);
  }
  if(!rows.length){root.append(n('section','No bookings yet.'));return;}
  const fmtDate=value=>value?new Date(value).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'}):'—';
  const wrap=n('div');wrap.className='sgc-bookings-wrap';
  const table=n('table');table.className='sgc-bookings-table';
  const thead=n('thead'),head=n('tr');
  ['Meeting name','Client / username','Email','Booked on','Duration','Scheduled for','Amount','Booking status','Payment / method','Comment','Actions'].forEach(label=>head.append(n('th',label)));
  thead.append(head);table.append(thead);
  const tbody=n('tbody');table.append(tbody);wrap.append(table);root.append(wrap);
  let completedIds=[];
  try { completedIds=check(await sb.rpc('sgc_admin_completed_meetings',{p_action:'list'}))||[]; }
  catch(err){ console.warn('Meeting completion tracking not yet enabled:',err); }
  const completed=new Set(completedIds.map(x=>typeof x==='string'?x:x.booking_id));
  for(const b of rows){
    const tr=n('tr');
    const isArchived=archivedIds.has(b.id);
    tr.hidden=isArchived;
    archiveEntries.push({tr,archived:isArchived});
    const add=(value,cls)=>{const td=n('td',String(value??'—'));if(cls)td.className=cls;tr.append(td);return td;};
    add(b.name||'—');
    // The booking API currently returns email but not a separate student username.
    add(b.username||b.client_username||b.client_name||'Not provided');
    add(b.email||'—');
    add(fmtDate(b.created_at));
    add(b.starts_at&&b.ends_at?Math.round((Date.parse(b.ends_at)-Date.parse(b.starts_at))/60000)+' min':'—');
    add(fmtDate(b.starts_at));
    add('R'+Number(b.amount_zar||0).toFixed(2));
    const status=add(b.status||'—');
    if(completed.has(b.id)){const sub=n('span','Meeting held ✓','sgc-sub sgc-complete');status.append(sub);}
    add((b.payment_status||'—')+(b.payment_method?' · '+b.payment_method:''));
    const notes=add(b.notes||'—','sgc-comment');
    if(b.last_error)notes.append(n('span','Error: '+b.last_error,'sgc-sub'));
    const actions=n('td');const actionBox=n('div');actionBox.className='sgc-actions';actions.append(actionBox);tr.append(actions);
    if(isArchived){
      actionBox.append(button('Restore booking',async()=>{
        if(!confirm('Restore this booking to the active admin list?'))return;
        check(await sb.rpc('sgc_admin_booking_archive',{p_action:'restore',p_booking:b.id}));
        await bookingsView();say('Booking restored in admin list.');
      }));
    } else {
      actionBox.append(button('Archive booking',async()=>{
        if(!confirm('Archive this booking from the active admin list?\n\nThis does NOT cancel the meeting, refund a payment, remove student access, or delete any recordings.'))return;
        check(await sb.rpc('sgc_admin_booking_archive',{p_action:'archive',p_booking:b.id}));
        await bookingsView();say('Booking archived. It is preserved under Show archived bookings.');
      }));
    }

    if(b.payment_status==='pending'&&b.status==='hold'){
      actionBox.append(button('Verify payment',async()=>{
        const note=prompt('Record how you verified the actual payment.');if(!note)return;
        await api({action:'admin_confirm',booking_id:b.id,note});await bookingsView();
        $('status').textContent='Payment recorded. Check the booking status below.';
      }));
    }
    if(['paid_pending_calendar','cancel_pending'].includes(b.status)){
      actionBox.append(button('Retry calendar',async()=>{await api({action:'retry',booking_id:b.id});await bookingsView();}));
    }
    if(!['cancelled','expired'].includes(b.status)){
      actionBox.append(button('Cancel booking',async()=>{
        if(!confirm('Cancel this booking? Any refund must be handled separately.'))return;
        await api({action:'cancel',booking_id:b.id});await bookingsView();
      }));
    }
    if(b.status==='confirmed'){
      actionBox.append(button('Attach recording',async()=>{
        const drive_link=prompt('Paste the Google Drive video file link.');if(!drive_link)return;
        const title=prompt('Recording title',b.name+' recording');if(!title)return;
        const saved=await recordingApi({action:'publish',booking_id:b.id,drive_link,title});
        say('Published. Student access ends '+fmtDate(saved.student_expires_at)+'.');await bookingsView();
      }));
    }
    try{
      const recordings=check(await sb.rpc('sgc_recordings_admin',{p_booking:b.id}))||[];
      for(const r of recordings){
        actionBox.append(button('Watch recording',()=>openAdminRecording(r.id)));
        actionBox.append(button('Delete recording',()=>deleteAdminRecording(r.id,r.title,bookingsView)));
      }
    }catch(err){console.error('Unable to load recordings for booking',b.id,err);actionBox.append(n('span','Recordings unavailable','sgc-sub'));}
    if(completed.has(b.id)){
      actionBox.append(n('span','✓ Completed','sgc-complete'));
    }else if(b.status==='confirmed'){
      actionBox.append(button('Completed — meeting held',async()=>{
        if(!confirm('Mark this meeting as completed and held? This does not change the payment or cancel the booking.'))return;
        check(await sb.rpc('sgc_admin_completed_meetings',{p_action:'complete',p_booking:b.id}));
        await bookingsView();say('Meeting marked as held.');
      }));
    }
    tbody.append(tr);
  }
}

async function tasksView() {
  dirty = false;
  const rows = await admin('tasks');
  const root = $('content');
  root.replaceChildren();
  root.append(button('Refresh tasks',tasksView));

  for(const t of rows) {
    const card = n('section');

    card.append(
      n('h3',t.name),
      n('p',t.email),
      n('p',t.body,'notice')
    );

    const status = select(
      card,'Task status','task-' + t.id,[
        ['requested','Requested'],
        ['in_progress','In progress'],
        ['completed','Completed'],
        ['cancelled','Cancelled']
      ],
      t.status
    );

    card.append(button('Save task status',async () => {
      await admin('task_update',t.id,{status:status.value});
      $('status').textContent = 'Task updated.';
    }));

    root.append(card);
  }

  if(!rows.length) root.append(n('section','No student tasks yet.'));
}


window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
return {
 guard(){if(!guard())return false;dirty=false;return true;},
 async appendStudentRecordings(card,booking){await recordingControls(card,booking);},
 async mount(root,authUser){
  user=authUser;dirty=false;
  const shell=n('div');shell.id='sgcp-manager';
  const intro=n('section');intro.append(n('h2','Products, add-ons & appointments'),n('p','Edit your shop categories, pricing, private files and appointment availability here.'));
  const nav=n('nav');const status=n('p');status.id='sgcp-status';status.className='notice';status.setAttribute('role','status');
  const content=n('div');content.id='sgcp-content';
  for(const [label,fn]of [['Products & add-ons',productsView],['Calendar connection',calendarView],['Meeting products',meetingProductsView],['Student tasks',tasksView]]){
   nav.append(button(label,async()=>{if(guard()){dirty=false;await fn();}}));
  }
  shell.append(intro,nav,status,content);root.append(shell);
  await productsView();
  if(new URLSearchParams(location.search).get('calendar')==='connected'){
   await calendarView();status.textContent='Google Calendar connected.';
  }
 }
};
})();

if (new URLSearchParams(location.search).get("calendar") === "connected") section = "Products & files";

if (sb) ready().catch(e => $("login-status").textContent = e.message);
else $("login-status").textContent = "Supabase library could not load.";
</script>
