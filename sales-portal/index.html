x solid #f1dce0;padding:9px 14px;border-radius:30px;font-size:12px}.steps b{color:#ad3d6b}.progress{height:7px;background:#f8e6ed;border-radius:9px;overflow:hidden;margin-bottom:12px}.progress i{display:block;height:100%;background:#d75a88;border-radius:9px}#toast{position:fixed;bottom:20px;right:20px;background:#432334;color:white;padding:14px 22px;border-radius:15px;z-index:8;box-shadow:0 8px 24px #43233444}#queue{max-height:420px;overflow:auto} @media(max-width:1200px){.workspace{grid-template-columns:1fr 1.4fr}.workspace>section:last-child{grid-column:1/-1}}@media(max-width:650px){aside{border-radius:0}main{padding:12px}.workspace{grid-template-columns:1fr}.workspace>section:last-child{grid-column:auto}.stats{gap:8px}.card{padding:15px}header{padding:18px}nav button{white-space:nowrap}}body{font-family:system-ui;background:#f9f5ef}aside{background:#f5dce8;color:#392637;border:1px solid #e9cbdc;border-radius:0 32px 32px 0}aside h1{color:#392637}aside p{color:#79566d!important}nav button{color:#392637}nav button.active{background:#382636;color:#fff;box-shadow:none}header{position:relative;overflow:hidden;min-height:210px;background:#f8e69c;border:0;align-items:flex-start;padding:32px}header:after{content:'↗';position:absolute;right:6%;top:-50px;font-size:300px;line-height:1;color:#eaa8c4;transform:rotate(-12deg);animation:float 5s ease-in-out infinite;pointer-events:none}header>div{position:relative;z-index:1;max-width:75%}header h2{font-size:clamp(30px,4vw,56px);line-height:1.02;letter-spacing:-2px}header .pill{z-index:2;background:#fff9df}header p{color:#634858}.heroaction{background:#382636;color:white;margin-top:12px;border-radius:30px;padding:14px 22px}.card{border:1px solid #eadfe2;box-shadow:none;background:#fffdf9}.stats .card{min-height:125px;animation:rise .5s both}.stats .card:nth-child(2){animation-delay:.07s;background:#f6d9e6}.stats .card:nth-child(3){animation-delay:.14s;background:#e8e8fa}.stats .card:nth-child(4){animation-delay:.21s;background:#e ight:140px;background:#f8dce9}.productTile:nth-child(even){background:#fff0bc}.stats{grid-template-columns:repeat(3,1fr)}.stats .card:last-child{background:#e8def3;color:#382636}.desk textarea{min-height:110px}@media(max-width:750px){.desk{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}</style><aside><h1>SGC</h1><small>NETWORK</small><p>Sales Studio</p><nav id="nav"></nav></aside><main><header><div><small>✦ SGC NETWORK / SALES STUDIO</small><h2 id="heading">Your sales dashboard.</h2><p>Connect. Create. Convert.</p></div><span class="pill">Demo workspace</span></header><div class="notice">Demo only — fictional data. Secure login, email delivery, WhatsApp delivery and payment gateway are not connected.</div><div id="view"></div></main><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'R '+n.toFixed(2);
const products=[['Website development','350 / month'],['E-commerce & online payments','750 / month'],['Booking systems','750 / month'],['Business automation','Custom quote'],['Financial dashboards','Custom quote'],['Academy & learning','900 / month'],['Ready-made business','1500 / month'],['Premium business package','3500 / month']];
let leads=[{name:'Example Beauty Studio',sector:'Salon',email:'',phone:'',status:'New',consent:'Unknown',log:[]},{name:'Example Retail Co.',sector:'Retail',status:'New',consent:'Unknown',log:[]}],idx=0,page='Dashboard',channel='Call',bcc='',consultant='';
const pages=['Dashboard','Lead Generation','Preview Requests','Closed Deals','Commission Tracker','Settings'];function go(p){page=p;render()}function field(k,v){leads[idx][k]=v}function update(k,v){field(k,v);render()}function choose(c){channel=c;render()}function input(k,label,type='text'){return '<label>'+label+'</label><input type="'+type+'" value="'+esc(leads[idx][k])+'" onchange="field(\''+k+'\',this.value)">'}function select(k,label,opts){return '<label>'+label+'</label><select onchange="update(\''+k+'\',this.value)">'+opts.map(x=>'<option '+(leads[idx][k]===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'}
function render(){ $('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+p+'</button>').join('');$('heading').textContent=page==='Dashboard'?'Your sales dashboard.':page;let l=leads[idx],closed=leads.filter(x=>x.status==='Closed'),earn=closed.reduce((a,x)=>a+(Number(x.verified)||0)*.3,0);
if(page==='Dashboard'){$('view').innerHTML='<div class="grid stats">'+[['Total earnings',money(earn)],['Total leads',leads.length],['Total closed',closed.length]].map(([k,v])=>'<div class="card stat">'+k+'<strong>'+v+'</strong></div>').join('')+'</div><h2>What we offer</h2><div class="grid products" style="margin-top:18px">'+products.map(([n,p])=>'<div class="card productTile"><span class="pill">SGC SOLUTIONS</span><h3 style="margin-top:20px">'+n+'</h3><p>'+p+'</p></div>').join('')+'</div>';return}
if(page==='Settings'){$('view').innerHTML='<div class="card"><h3>Consultant email settings</h3><label>Consultant company email</label><input value="'+esc(consultant)+'" onchange="consultant=this.value"><label>Required SGC Network BCC address</label><input type="email" value="'+esc(bcc)+'" onchange="bcc=this.value"><p>Configure the actual SGC mailbox before drafting. The email client controls the sending account.</p></div>';return}
if(page==='Preview Requests'||page==='Closed Deals'||page==='Commission Tracker'){$('view').innerHTML='<div class="card"><h3>'+page+'</h3>'+(page==='Commission Tracker'?'<h2>'+money(earn)+'</h2><p>Demo verified first payments × 30%. Recurring 10% for next 11 paid months; eligible once-off 20%.</p>':'')+leads.filter(x=>page==='Preview Requests'?x.requested:x.status==='Closed').map(x=>'<div class="notice"><b>'+esc(x.name)+'</b><p>'+esc(x.system)+' · '+esc(x.theme)+'</p><p>'+esc(x.requested||'')+'</p></div>').join('')+'</div>';return}
let script='Hello, I’m calling from SGC Network. Is now a convenient time to speak?\n\nWe help businesses grow with professional websites, online bookings, payments and automated business systems.\n\nMay I ask what type of business you run? What system would make your day-to-day work easier?\n\nWhat colours, theme and overall vibe do you prefer? What features would you like?\n\nWe can prepare a free preview within 2–5 days. May we contact you by email or WhatsApp to share it? We will record your permission and respect any opt-out.';
let pitch='Hi '+l.name+',\n\nI’m contacting you from SGC Network. We create websites, online stores, booking systems and business automations. We would love to prepare a free preview tailored to your business within 2–5 days.\n\nExplore our services: https://sgcnetwork.co.za/\n'+(l.preview?'Your preview: '+l.preview+'\n':'')+'\nPlease let me know what system, colours and style you would prefer. If you do not wish to receive further messages, please let us know.\n\nKind regards,\nSGC Network'+(consultant?' | '+consultant:'');
$('view').innerHTML='<div class="desk"><section class="card"><h3>Customer workspace</h3><div class="tabs"><button onclick="add()">+ Demo lead</button><button onclick="document.getElementById(\'csv\').click()">Upload CSV</button><input id="csv" type="file" accept=".csv" hidden onchange="upload(this)"></div><label>Select lead</label><select onchange="idx=Number(this.value);render()">'+leads.map((x,i)=>'<option value="'+i+'" '+(idx===i?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'+input('name','Business name')+input('sector','Type of business')+input('email','Email','email')+input('phone','Phone / WhatsApp')+select('status','Lead outcome',['New','Contacted','Interested','Preview requested','Accepted','Closed','Not interested','Opted out'])+select('consent','POPIA permission',['Unknown','Granted','Refused','Withdrawn'])+input('evidence','Consent evidence / source / date / channel')+input('followup','Follow-up date','date')+'<h3 style="margin-top:24px">Business discovery</h3>'+select('system','Type of system',['Select a product',...products.map(x=>x[0])])+input('theme','Theme, colours & vibes')+input('features','Required functionality')+input('preview','Approved HTML preview URL','url')+'<button class="pink" style="margin-top:15px" onclick="request()">Request free preview · 2–5 days</button><h3 style="margin-top:24px">Acceptance & payment</h3><button onclick="payment()">Generate monthly payment link</button><p class="muted">PayGate integration pending. No payment links are fabricated.</p></section><section class="card"><h3>Outreach studio</h3><div class="tabs">'+['Call','Email','WhatsApp'].map(c=>'<button class="'+(c===channel?'on':'')+'" onclick="choose(\''+c+'\')">'+c+'</button>').join('')+'</div><h2>'+channel+' '+(channel==='Call'?'script':'draft')+'</h2>'+(channel==='Call'?'<div class="script">'+esc(script)+'</div><button style="margin-top:12px" onclick="log(\'Call outcome recorded\')">Log call outcome</button>':'<p>Review and personalise the message before sending.</p><textarea id="draft" style="min-height:330px">'+esc(pitch)+'</textarea>'+(channel==='Email'?'<p>BCC: '+esc(bcc||'Not configured')+'</p>':'')+'<button class="pink" onclick="draft()">Prepare '+channel+' draft</button>')+'<h3 style="margin-top:24px">Activity timeline</h3>'+l.log.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section></div>'}
function add(){leads.push({name:'Example business '+(leads.length+1),status:'New',consent:'Unknown',log:[]});idx=leads.length-1;render()}async function upload(el){if(!el.files[0]||!confirm('Only fictional demo data is permitted. Continue?'))return;(await el.files[0].text()).split(/\r?\n/).slice(1).forEach(r=>{let [name,sector]=r.split(',');if(name)leads.push({name,sector,status:'New',consent:'Unknown',log:[]})});render()}function log(s){leads[idx].log.push(new Date().toLocaleString()+' — '+s);render()}function allowed(){let l=leads[idx];return l.consent==='Granted'&&l.evidence&&l.status!=='Opted out'}function request(){let l=leads[idx];if(!allowed()||!l.system||l.system==='Select a product'||!l.theme){alert('Record permission, system and design requirements first.');return}l.requested=new Date().toLocaleDateString();l.status='Preview requested';log('Demo preview request captured; not transmitted')}function payment(){alert('PayGate merchant subscription integration is not connected. No real payment link can be generated yet.')}function draft(){if(!allowed()){alert('Record valid channel permission and evidence first.');return}if(channel==='Email'&&(!bcc||!consultant)){alert('Configure consultant and SGC BCC email in Settings first.');return}let t=$('draft').value;navigator.clipboard?.writeText(t).then(()=>alert('Demo draft copied. No message sent.')).catch(()=>alert('Select and copy the draft manually.'));}render();
</script></html>
