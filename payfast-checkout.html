<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Secure checkout | SGC Network</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="/css/policy-links.css"></head><body><main class="container" style="max-width:640px;padding:70px 24px"><h1>Review your payment.</h1><div id="summary" class="sgc-policy-summary" hidden></div><p id="status" role="status">Connecting to PayFast…</p><form id="checkout" method="post"></form><a href="shop.html">Return to SGC</a></main><script>
(async()=>{const status=document.getElementById('status');try{const reference=new URLSearchParams(location.hash.slice(1)).get('reference');if(!reference)throw Error('Missing checkout reference. Please start checkout again.');const response=await fetch('https://bxpexanyoyubxeqqlggh.supabase.co/functions/v1/create-payfast-payment?reference='+encodeURIComponent(reference));if(!response.ok)throw Error(await response.text());const result=await response.json();if(result.action!=='https://www.payfast.co.za/eng/process'||!result.fields?.signature)throw Error('Invalid checkout response.');const form=document.getElementById('checkout');form.action=result.action;const summary=document.getElementById('summary');const name=document.createElement('strong');name.textContent=result.fields.item_name;const amount=document.createElement('p');amount.textContent='Due now: R'+Number(result.fields.amount).toFixed(2);summary.append(name,amount);if(result.fields.subscription_type==='1'){const recurring=document.createElement('p');recurring.textContent='Then R'+Number(result.fields.recurring_amount||result.fields.amount).toFixed(2)+' automatically every month until you cancel. Manage cancellation under Payments & subscriptions. Paid access continues until its end date.';summary.append(recurring);}summary.hidden=false;for(const [name,value] of Object.entries(result.fields)){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=String(value);form.append(input);}const consent=document.createElement('label');consent.className='sgc-consent';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.required=true;const description=document.createElement('span');description.innerHTML='I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and the applicable <a href="refunds.html" target="_blank" rel="noopener">Refund Policy</a> and <a href="subscriptions.html" target="_blank" rel="noopener">Subscription &amp; Cancellation Policy</a>. I have read the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.';consent.append(checkbox,description);form.append(consent);const button=document.createElement('button');button.type='submit';button.textContent='Continue to PayFast';form.append(button);status.textContent='Check your selection and policies, then continue to PayFast to authorise payment.';}catch(error){status.textContent=error.message||'Checkout unavailable. Please try again.';}})();
</script><footer class="sgc-policy-footer"><div class="sgc-policy-inner"><span>SGC Network · Customer information</span><nav aria-label="SGC policies"><a href="/policies.html">All policies</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/refunds.html">Refunds</a><a href="/subscriptions.html">Subscriptions &amp; cancellation</a><a href="/enquiry.html">Contact</a></nav></div></footer></body></html>
