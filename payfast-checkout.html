<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Secure checkout | SGC Network</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container" style="max-width:640px;padding:70px 24px"><h1>Secure checkout.</h1><p id="status" role="status">Connecting to PayFast…</p><form id="checkout" method="post"></form><a href="shop.html">Return to SGC</a></main><script>
(async()=>{const status=document.getElementById('status');try{const reference=new URLSearchParams(location.hash.slice(1)).get('reference');if(!reference)throw Error('Missing checkout reference. Please start checkout again.');const response=await fetch('https://bxpexanyoyubxeqqlggh.supabase.co/functions/v1/create-payfast-payment?reference='+encodeURIComponent(reference));if(!response.ok)throw Error(await response.text());const result=await response.json();if(result.action!=='https://www.payfast.co.za/eng/process'||!result.fields?.signature)throw Error('Invalid checkout response.');const form=document.getElementById('checkout');form.action=result.action;for(const [name,value] of Object.entries(result.fields)){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=String(value);form.append(input);}const button=document.createElement('button');button.type='submit';button.textContent='Continue to PayFast';form.append(button);form.submit();}catch(error){status.textContent=error.message||'Checkout unavailable. Please try again.';}})();
</script></body></html>
