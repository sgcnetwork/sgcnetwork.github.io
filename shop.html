/* SGC editorial shop */
:root{--cream:#faf7f2;--ink:#29242c;--muted:#79717b;--line:#e4dde2}
body{background:var(--cream);font-family:Arial,sans-serif}
main{max-width:1320px;padding:32px 44px 80px}

.brand{font-size:24px}nav a{font-size:13px}

.hero #account{font-size:12px;margin-top:26px}
.eyebrow{font-size:10px;letter-spacing:3px}
label[for="category-menu"]{font-size:11px;text-transform:uppercase;letter-spacing:2px}
.shortcuts{max-width:360px;margin:12px 0 35px}

#catalogue>h2{font:38px Georgia,serif;letter-spacing:-.025em;margin-bottom:8px}

async function showNamedMemberships(){
  const categorySelected=!params.get('product') && selected==='memberships';
  if(!categorySelected)return;
  const host=$('catalogue');
  const section=node('section',undefined,'section');section.append(node('h2','SGC Memberships'));
  const grid=node('div',undefined,'grid');section.append(grid);
  const response=await sb.from('sgc_named_membership_plans').select('id,name,price_zar,billing,description,features').eq('state','published').order('created_at');
  if(response.error){section.append(node('p','Membership catalogue is temporarily unavailable.','muted'));host.append(section);return;}
  let featureNames=new Map([
    ['business_classes','Business classes'],['qa','Q&As'],['community','Academy community'],
    ['recorded_lessons','Recorded lessons'],['live_discussions','Live discussions']
  ]);
  const featureResult=await sb.rpc('sgc_public_membership_features');
  if(!featureResult.error && Array.isArray(featureResult.data)){
    featureNames=new Map(featureResult.data.map(f=>[f.key,f.label]));
  }
  for(const p of response.data||[]){
    const card=node('article',undefined,'card');
    card.append(node('h3',p.name),node('p','R'+Number(p.price_zar).toFixed(2)+(p.billing==='monthly'?' / month':' once-off'),'price'),node('p',p.description||''));
    card.append(node('h4',"What's included"));
    const benefits=Array.isArray(p.features)?p.features:[];
    if(benefits.length){
      const ul=node('ul');ul.style.cssText='padding-left:20px;line-height:1.8';
      for(const key of benefits){ul.append(node('li','✓ '+(featureNames.get(key)||key.replaceAll('_',' '))));}
      card.append(ul);
    }else{card.append(node('p','Benefits will be confirmed by SGC Network.','muted'));}
    const pay=node('button','Pay Now');pay.type='button';
    pay.onclick=()=>{location.assign('payment.html?membershipId='+encodeURIComponent(p.id));};
    card.append(pay,node('p','Secure checkout via Stitch. Once payment is verified, the features included in your membership unlock automatically.','muted'));
    grid.append(card);
  }
  host.append(section);
}

e.textContent=e.message;}finally{working=false;load.disabled=false;}};box.append(day,load,note,slots,message);return box;}
async function bookingPayment(booking,product){$('checkout-title').textContent=booking.name;$('checkout-price').textContent='R'+Number(booking.amount_zar).toFixed(2);$('methods').replaceChildren();$('checkout-status').textContent='Your slot is held until '+new Date(booking.hold_expires_at).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'})+'. Booking is confirmed after payment is verified.';if(!$('checkout').open)$('checkout').showModal();try{if(!product)product=check(await sb.from('sgc_products').select('*').eq('id',booking.product_id).single());const methods=check(await sb.from('sgc_payment_methods').select('*').eq('active',true));const assigned=methods.filter(m=>(product.payment_method_ids||[]).includes(m.id));if(!assigned.length)$('checkout-status').textContent+=' No active payment methods are assigned. Contact SGC.';for(const m of assigned){const b=node('button',m.name);b.type='button';b.onclick=async()=>{if(paymentBusy)return;paymentBusy=true;const buttons=[...$('methods').querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);$('close').disabled=true;try{const r=await bookingApi({action:'checkout',booking_id:booking.id,method_id:m.id});if(r.checkoutUrl){const url=new URL(r.checkoutUrl);if(url.protocol!=='https:')throw Error('Invalid checkout link.');location.assign(url.href);return;}$('checkout-status').textContent='Amount: R'+Number(r.amount_zar).toFixed(2)+'\nReference: '+r.reference+'\n\n'+r.instructions+'\n\nPay before '+new Date(r.hold_expires_at).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'})+'. EFT needs SGC verification before this hold expires; late payments require SGC to arrange another slot or refund.';}catch(e){$('checkout-status').textContent=e.message;}finally{paymentBusy=false;buttons.forEach(x=>x.disabled=false);$('close').disabled=false;}};$('methods').append(b);}}catch(e){$('checkout-status').textContent=e.message;}}
function taskForm(product){const form=node('form');form.append(node('h3','Tell us what you need assistance with'),node('p','After purchasing or receiving access, submit your assistance task here.','muted'));const body=node('textarea');body.required=true;body.minLength=10;body.maxLength=5000;body.setAttribute('aria-label','Assistance task');const send=node('button','Submit assistance task');send.type='submit';const message=node('p');form.append(body,send,message);form.onsubmit=async e=>{e.preventDefault();if(!user){message.textContent='Sign in first.';return;}send.disabled=true;try{check(await sb.rpc('sgc_service_request',{p_product:product.id,p_body:body.value.trim()}));body.value='';message.textContent='Your assistance task has been saved for SGC.';}catch(e){message.textContent=e.message;}finally{send.disabled=false;}};return form;}
start().catch(e=>{$('status').textContent=e.message;});
