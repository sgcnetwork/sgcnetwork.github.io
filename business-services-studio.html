<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Services | SGC Studio</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font:13px 'DM Sans',sans-serif;background:#f2f0ed;color:#181818}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #dedbd5;background:white;padding:10px;border-radius:6px}button:hover{border-color:#d9a54e}.gold{background:#e7b75f;border:0;font-weight:700}.top{height:55px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;gap:8px}.top strong{background:#121619;color:white;padding:12px}.workspace{display:grid;grid-template-columns:145px 170px minmax(0,1fr) 255px;height:calc(100vh - 55px)}.tools{background:#101719;color:#fff;padding:14px 8px;overflow:auto}.tools button{display:block;width:100%;text-align:left;background:transparent;color:white;border:0;padding:9px}.pages,.settings{background:#fff;overflow:auto;padding:15px;border-right:1px solid #e8e5e0}.pages button{width:100%;text-align:left;margin:4px 0}.pages .active{background:#f7e9d5}.canvas{overflow:auto;padding:12px}.site{max-width:1100px;margin:auto;background:white;min-height:90%;box-shadow:0 3px 22px #0001}.site.mobile{max-width:390px}.site.tablet{max-width:720px}.contactbar{background:#f5f2ee;padding:8px 6%;font-size:11px}.sitehead{display:flex;align-items:center;justify-content:space-between;padding:18px 6%;gap:12px;flex-wrap:wrap}.sitehead strong{font:28px Georgia,serif}.sitehead nav{display:flex;gap:18px;flex-wrap:wrap}.sitehead a{color:inherit;text-decoration:none}.hero{padding:75px 9%;min-height:340px;background:linear-gradient(90deg,#f6eee6 0%,#f6eee6d9 45%,#ffffff00 100%),url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1500') center/cover}.hero h1{font:clamp(35px,4vw,62px)/1.06 'Playfair Display',Georgia,serif;max-width:520px;margin:14px 0}.hero p{max-width:440px;line-height:1.7;font-size:15px}.cta{display:inline-block;background:var(--accent,#d9a54e);padding:13px 23px;border-radius:5px;text-decoration:none;color:#111;margin:12px 8px 0 0}.section{padding:48px 7%;text-align:center}.section h1,.section h2{font:36px 'Playfair Display',Georgia,serif}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin-top:25px}.item{border:1px solid #eee;padding:20px;text-align:left;border-radius:9px;background:#fff}.item img{width:100%;height:130px;object-fit:cover}.item h3{font:20px Georgia,serif}.footer{padding:30px;background:#171b1d;color:white;text-align:center}[contenteditable]:focus{outline:2px solid #d9a54e;outline-offset:3px}.settings label{display:block;margin:15px 0 5px;font-weight:700}.settings input,.settings textarea,.settings select{width:100%;padding:9px;border:1px solid #ddd;border-radius:5px}.settings textarea{min-height:85px}.muted{font-size:11px;color:#6d6d6d}.tabs{display:flex;gap:5px}.tabs button{flex:1;font-size:11px;padding:7px}.row{display:flex;gap:5px;flex-wrap:wrap}.row button{flex:1}.notice{padding:9px;background:#fff3dc;margin:12px 0;border-radius:6px}dialog{border:1px solid #ddd;border-radius:12px;padding:25px;max-width:400px}dialog::backdrop{background:#0008}@media(max-width:900px){.workspace{grid-template-columns:55px 125px minmax(0,1fr)}.tools button{font-size:10px}.settings{position:fixed;right:0;top:55px;bottom:0;width:min(300px,85vw);box-shadow:0 0 30px #0002;display:none}.settings.open{display:block}.top{height:auto;flex-wrap:wrap}.workspace{height:calc(100vh - 95px)}}@media(max-width:560px){.workspace{grid-template-columns:48px minmax(0,1fr)}.pages{position:fixed;left:48px;top:95px;bottom:0;width:175px;z-index:3;display:none;box-shadow:0 0 15px #0002}.pages.open{display:block}.canvas{padding:5px}.hero{padding:45px 8%;background-position:center}.sitehead nav{font-size:10px}}</style></head><body><header class="top"><strong>SGC Studio · Business Services</strong><div class="row"><button onclick="togglePages()">Pages</button><button onclick="toggleSettings()">Design / Edit</button><button onclick="setDevice('desktop')">▣</button><button onclick="setDevice('tablet')">▤</button><button onclick="setDevice('mobile')">▯</button><button onclick="undo()">↶ Undo</button><button onclick="redo()">↷ Redo</button><button onclick="save()">Save Draft</button><button onclick="preview()">Preview</button><button class="gold" onclick="publish()">Publish Website</button></div></header><div class="workspace"><aside class="tools"><b>+ Add</b><div id="elements"></div></aside><aside class="pages" id="pages"><h3>Pages</h3><button onclick="addPage()">+ Add Page</button><div id="pageList"></div></aside><main class="canvas"><div class="site" id="site"></div></main><aside class="settings" id="settings"><h3 id="editTitle">Edit Website</h3><div class="tabs"><button onclick="tab('Content')">Content</button><button onclick="tab('Style')">Style</button><button onclick="tab('Advanced')">Advanced</button></div><div id="fields"></div><p class="muted">Changes update the live preview. Save Draft stores this design in this browser.</p></aside></div><dialog id="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="row"><button onclick="modal.close()">Close</button><button class="gold" id="modalAction" onclick="modal.close()">OK</button></div></dialog><script>
const K='sgc_business_studio_v1',defaults={brand:'BusinessPro',accent:'#d9a54e',hero:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1500',pages:['Home','About Us','Services','Products','Categories','Blog','Contact'],data:{Home:{title:'Helping Businesses Grow & Succeed',desc:'We provide expert business consulting, strategy, and digital solutions tailored to your goals.',sections:['Services','Products']},'About Us':{title:'About Our Business',desc:'Helping ambitious businesses achieve meaningful growth.'},Services:{title:'Professional Services for Your Business',items:[{name:'Business Consulting',desc:'Strategic advice to improve efficiency and drive growth.'},{name:'Digital Marketing',desc:'Grow your online presence and reach new customers.'},{name:'IT Support',desc:'Reliable IT solutions to keep your business running.'}]},Products:{title:'Our Products',items:[{name:'Business Plan Template',price:299,desc:'Professional business planning template',category:'Templates'},{name:'Marketing Strategy Toolkit',price:399,category:'Business Tools'},{name:'Financial Tracker',price:249,category:'Finance'}]},Categories:{title:'Product Categories',items:[{name:'Templates'},{name:'Business Tools'},{name:'Guides'},{name:'Bundles'},{name:'Consulting Services'},{name:'Marketing'},{name:'Finance'},{name:'IT & Tech'},{name:'Other'}]},Blog:{title:'Latest Insights',items:[{name:'5 Tips to Grow Your Small Business',desc:'Practical tips to help you thrive.'}]},Contact:{title:'Get in Touch',desc:'We would love to hear from you.'}}};let state;try{state=JSON.parse(localStorage.getItem(K))||structuredClone(defaults)}catch{state=structuredClone(defaults)};let current='Home',selected=null,activeTab='Content',history=[],future=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));function checkpoint(){history.push(JSON.stringify(state));if(history.length>60)history.shift();future=[]}function change(fn){checkpoint();fn();render()}function undo(){if(history.length){future.push(JSON.stringify(state));state=JSON.parse(history.pop());render()}}function redo(){if(future.length){history.push(JSON.stringify(state));state=JSON.parse(future.pop());render()}}function save(){localStorage.setItem(K,JSON.stringify(state));message('Draft saved','Your edits are saved locally in this browser. Cloud syncing is not yet connected.')}function message(title,body){$('modalTitle').textContent=title;$('modalText').textContent=body;$('modalAction').onclick=()=>$('modal').close();$('modal').showModal()}function publish(){message('Publishing not yet connected','This editor does not have a verified Supabase publishing connection. Your draft has not been published.')}function preview(){const w=window.open('','_blank');if(!w)return message('Preview blocked','Allow popups to open the preview.');w.document.write('<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">'+document.querySelector('style').outerHTML+'</head><body>'+ $('site').outerHTML+'</body></html>');w.document.close()}function setDevice(v){$('site').className='site '+(v==='desktop'?'':v)}function toggleSettings(){$('settings').classList.toggle('open')}function togglePages(){$('pages').classList.toggle('open')}function selectPage(p){current=p;selected=null;render()}function addPage(){const name='Custom Page '+(state.pages.length+1);change(()=>{state.pages.push(name);state.data[name]={title:name,desc:'Your page description'}});selectPage(name)}function removePage(p){if(p==='Home')return;change(()=>{state.pages=state.pages.filter(x=>x!==p);delete state.data[p]});selectPage('Home')}function addItem(){change(()=>{const d=state.data[current];(d.items??=[]).push({name:'New '+current.slice(0,-1),desc:'Edit this description',price:0})});selected={type:'item',index:state.data[current].items.length-1};render()}function addElement(name){change(()=>{const d=state.data[current];(d.sections??=[]).push(name)});selected={type:'section',index:state.data[current].sections.length-1};render()}function editable(value,key){return '<span contenteditable="true" data-key="'+key+'">'+esc(value)+'</span>'}function render(){const d=state.data[current]||{};$('site').style.setProperty('--accent',state.accent);$('pageList').innerHTML=state.pages.map(p=>'<button class="'+(p===current?'active':'')+'" data-page="'+esc(p)+'">'+esc(p)+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>selectPage(b.dataset.page));let body='<section class="section"><h1>'+editable(d.title||current,'title')+'</h1>'+(d.desc?'<p>'+editable(d.desc,'desc')+'</p>':'');if(d.items)body+='<div class="cards">'+d.items.map((item,i)=>'<article class="item" data-item="'+i+'"><h3>'+esc(item.name)+'</h3><p>'+esc(item.desc||'')+'</p>'+(item.price!=null&&current==='Products'?'<b>R'+esc(item.price)+'</b>':'')+'</article>').join('')+'</div><button class="gold" id="addItem">+ Add '+esc(current==='Products'?'Product':current==='Categories'?'Category':'Item')+'</button>';if(d.sections)body+=d.sections.map((v,i)=>'<div class="item" data-section="'+i+'"><h3>'+esc(v)+'</h3><p>Click to edit or remove this section</p></div>').join('');if(current==='Contact')body+='<form onsubmit="event.preventDefault();alert(&quot;Form submission requires backend connection&quot;)"><input placeholder="Name" required><input placeholder="Email" type="email" required><textarea placeholder="Message" required></textarea><button>Send Message</button></form>';body+='</section>';$('site').innerHTML='<div class="contactbar">☎ 010 123 4567　 ·　 info@businesspro.co.za</div><div class="sitehead"><strong>'+editable(state.brand,'brand')+'</strong><nav>'+state.pages.slice(0,7).map(p=>'<a href="#" data-nav="'+esc(p)+'">'+esc(p)+'</a>').join('')+'</nav><a class="cta" href="#" data-nav="Contact">Get a Quote</a></div>'+(current==='Home'?'<section class="hero" style="background-image:linear-gradient(90deg,#f6eee6 0%,#f6eee6d9 45%,#ffffff00 100%),url(&quot;'+esc(state.hero)+'&quot;)"><small>BUSINESS SOLUTIONS</small><h1>'+editable(d.title,'title')+'</h1><p>'+editable(d.desc,'desc')+'</p><a class="cta" href="#" data-nav="Contact">Get Started →</a><a class="cta" href="#" data-nav="Services">Our Services</a></section>':body)+(current==='Home'?'<section class="section"><h2>Our Expertise</h2><div class="cards">'+state.data.Services.items.map(x=>'<article class="item"><h3>'+esc(x.name)+'</h3><p>'+esc(x.desc)+'</p></article>').join('')+'</div></section>':'')+'<footer class="footer">© '+esc(state.brand)+' · Powered by SGC Network</footer>';document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();selectPage(a.dataset.nav)});$('site').querySelectorAll('[contenteditable]').forEach(el=>el.onblur=()=>{const k=el.dataset.key,v=el.innerText;if(k==='brand')change(()=>state.brand=v);else change(()=>state.data[current][k]=v)});$('site').querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>{selected={type:'item',index:+el.dataset.item};renderFields()});$('site').querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>{selected={type:'section',index:+el.dataset.section};renderFields()});const b=$('addItem');if(b)b.onclick=addItem;renderFields()}function tab(v){activeTab=v;renderFields()}function renderFields(){const f=$('fields');let html='<label>Business name</label><input data-setting="brand" value="'+esc(state.brand)+'"><label>Accent colour</label><input type="color" data-setting="accent" value="'+esc(state.accent)+'"><label>Hero image URL</label><input data-setting="hero" value="'+esc(state.hero)+'">';if(selected){const obj=selected.type==='item'?state.data[current].items[selected.index]:{name:state.data[current].sections[selected.index]};html+='<h4>Edit '+selected.type+'</h4>'+Object.entries(obj).filter(([k,v])=>typeof v!=='object').map(([k,v])=>'<label>'+esc(k)+'</label><input data-object="'+esc(k)+'" value="'+esc(v)+'">').join('')+'<button id="removeSelected">Remove '+selected.type+'</button>'}else html+='<label>Page heading</label><input data-pagefield="title" value="'+esc(state.data[current]?.title||'')+'"><label>Page description</label><textarea data-pagefield="desc">'+esc(state.data[current]?.desc||'')+'</textarea>';f.innerHTML=html;f.querySelectorAll('[data-setting]').forEach(el=>el.onchange=()=>change(()=>state[el.dataset.setting]=el.value));f.querySelectorAll('[data-pagefield]').forEach(el=>el.onchange=()=>change(()=>state.data[current][el.dataset.pagefield]=el.value));f.querySelectorAll('[data-object]').forEach(el=>el.onchange=()=>change(()=>{if(selected.type==='item')state.data[current].items[selected.index][el.dataset.object]=el.dataset.object==='price'?Number(el.value):el.value;else state.data[current].sections[selected.index]=el.value}));const rem=$('removeSelected');if(rem)rem.onclick=()=>{change(()=>{if(selected.type==='item')state.data[current].items.splice(selected.index,1);else state.data[current].sections.splice(selected.index,1)});selected=null;render()}}const elements=['Text','Heading','Image','Button','Video','Section','Container','Icon','Divider','Spacer','Form','Map','FAQ','Testimonial','Team Member','Gallery','Pricing Table','Service Card','Product Listing','Blog','Social Icons','HTML Embed'];$('elements').innerHTML=elements.map(x=>'<button data-add="'+x+'">+ '+x+'</button>').join('');document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>addElement(el.dataset.add));render();
</script></body></html>
