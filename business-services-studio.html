ion h2{font-size:34px;margin:6px 0}.section>p{font-size:12px;color:#777}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-top:25px}.card{background:white;border:1px solid #eee;border-radius:var(--radius);padding:17px;text-align:left;box-shadow:0 3px 16px #00000009;cursor:pointer}.card:hover{outline:2px solid var(--accent)}.card h3{font-size:19px;margin:9px 0}.card p{font-size:12px;line-height:1.55;color:#626262}.card img{width:100%;height:130px;object-fit:cover;border-radius:4px}.card .price{font-weight:700;font-size:14px}.card .cta{font-size:11px;padding:9px 13px}.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:20px 0}.chips button{border:1px solid #eee;background:#f8f6f2;padding:7px 11px;border-radius:4px}.chips button.active{background:#f1d4a0}.sitefooter{background:#171c1f;color:#fff;text-align:center;padding:30px}.sitefooter h3{color:white}.site [contenteditable]{cursor:text}.site [contenteditable]:hover{outline:1px dashed #4b8fff}.site [contenteditable]:focus{outline:2px solid #3b86ff;outline-offset:4px}.site.mobile .contactbar{display:none}.site.mobile .sitehead{flex-wrap:wrap}.site.mobile .sitehead nav{gap:10px}.site.mobile .sitehead nav a{font-size:9px}.site.mobile .hero{min-height:470px;background-position:65% center}.site.mobile .hero h1{font-size:38px}.site.mobile .cards,.site.tablet .cards{grid-template-columns:1fr}.site.mobile .section{padding:35px 7%}.site.mobile .section h2{font-size:27px}.panel{background:#fff;border-left:1px solid #ddd;overflow:auto}.panelhead{padding:15px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}.panelhead h3{margin:0;font-size:14px}.panelhead button{border:0;background:transparent}.tabs{display:flex;border-bottom:1px solid #ddd}.tabs button{flex:1;background:white;border:0;padding:12px 3px;font-size:11px}.tabs button.active{border-bottom:2px solid #151719;font-weight:700}.fields{padding:14px}.fields label{display:block;f </style></head><body>
<header class="top"><div class="brand"><span class="round">1</span><span><b>Website Builder</b><small>Business Services</small></span></div><div class="topmenus"><button onclick="togglePages()">Pages⌄</button><button onclick="showDesign()">Design⌄</button><button onclick="showAdvanced()">Settings⌄</button><button onclick="help()">Help⌄</button></div><div class="topactions"><button title="Desktop" onclick="device('desktop')">▣</button><button title="Mobile" onclick="device('mobile')">▯</button><button title="Tablet" onclick="device('tablet')">▤</button><button title="Undo" onclick="undo()">↶</button><button title="Redo" onclick="redo()">↷</button><button class="preview" onclick="preview()">Preview</button><button class="publish" onclick="publish()">Publish Website</button></div></header>
<div class="workspace"><aside class="elements"><button class="add" onclick="addElement('Section')">＋ Add Element</button><div id="toolList"></div></aside><aside class="pages" id="pages"><h3>Pages</h3><button class="addpage" onclick="addPage()">＋ Add Page</button><div id="pageList"></div></aside><main class="canvas"><div class="canvasbar"><span id="canvasLabel">Home · Live editor</span><span><button onclick="save()">Save draft</button> <button onclick="togglePanel()">Edit controls ⚙</button></span></div><div id="site" class="site"></div></main><aside class="panel" id="panel"><div class="panelhead"><h3 id="panelTitle">Edit Website</h3><button onclick="togglePanel(false)">✕</button></div><div class="tabs"><button id="tabContent" onclick="setTab('Content')">Content</button><button id="tabStyle" onclick="setTab('Style')">Style</button><button id="tabAdvanced" onclick="setTab('Advanced')">Advanced</button></div><div class="fields" id="fields"></div></aside></div>
<dialog id="dialog"><h3 id="dialogTitle"></h3><p id="dialogText"></p><div style="display:flex;justify-content:flex-end;gap:8px"><button onclick="document.getElementById('dialog').close()">Cancel</button><button id="dialogOk" onclick="document.getElementById('dialog').close()">OK</button></div></dialog>
<script>
const KEY='sgc_business_studio_complete_v1';
const seed={brand:'BusinessPro',accent:'#e5b65e',hero:'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1600&q=85',pages:['Home','About Us','Services','Products','Categories','Blog','Contact'],hidden:[],theme:{header:'#ffffff',footer:'#171c1f',heading:'#111111',text:'#333333',background:'#ffffff',headingFont:'Playfair Display',bodyFont:'DM Sans',fontSize:61,buttonRadius:6,spacing:54,showContact:true,showFooter:true,showServices:true,showProducts:true},data:{Home:{title:'Helping Businesses Grow & Succeed',desc:'We provide expert business consulting, strategy, and digital solutions tailored to your goals.',eyebrow:'BUSINESS SOLUTIONS',button:'Get Started'},'About Us':{title:'About BusinessPro',desc:'Your trusted partner in business strategy, innovation and growth.'},Services:{title:'Professional Services for Your Business',desc:'From strategy to implementation, we offer a full range of business services.',items:[{name:'Business Consulting',desc:'Strategic advice to improve efficiency and drive growth.',button:'Learn More',image:''},{name:'Digital Marketing',desc:'Grow your online presence and reach new customers.',button:'Learn More',image:''},{name:'IT Support',desc:'Reliable IT solutions to keep your business running.',button:'Learn More',image:''}]},Products:{title:'Our Products',desc:'Tools, templates and resources to help you run a smarter business.',items:[{name:'Business Plan Template',desc:'A complete plan template to help you create a professional business plan.',price:299,category:'Templates',image:'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=500'},{name:'Marketing Strategy Kit',desc:'Build your marketing strategy.',price:399,category:'Business Tools',image:'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=500'},{name:'Financial Tracker',desc:'Manage your business finances.',price:249,category:'Finance',image:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=500'}]},Categories:{title:'Product Categories',items:[{name:'Templates',desc:'Business templates and resources',image:''},{name:'Business Tools',desc:'Tools for entrepreneurs',image:''},{name:'Guides',desc:'Guides and learning material',image:''},{name:'Bundles',desc:'Product bundles',image:''},{name:'Consulting Services',desc:'Professional assistance',image:''},{name:'Marketing',desc:'Marketing resources',image:''},{name:'Finance',desc:'Financial tools',image:''},{name:'IT & Tech',desc:'Technology resources',image:''},{name:'Other',desc:'More products',image:''}]},Blog:{title:'Latest Insights',desc:'Tips, strategies and resources to help your business grow.',items:[{name:'5 Tips to Grow Your Small Business',desc:'Practical tips to help you thrive.',category:'Business',image:'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=500'},{name:'Marketing Strategies That Work',desc:'Discover effective marketing.',category:'Marketing',image:'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=500'},{name:'How to Improve Business Efficiency',desc:'Work smarter and grow faster.',category:'Strategy',image:'https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=500'}]},Contact:{title:'Get in Touch',desc:"We'd love to hear from you. Send us a message and we'll get back to you soon.",fields:['Name','Email','Subject','Message'],button:'Send Message'}},extras:{}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){state=structuredClone(seed)};state.theme={...seed.theme,...state.theme};state.extras=state.extras||{};let current='Home',selected=null,tab='Content',filter='All',deviceMode='desktop',previewing=false,past=[],future=[];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c])),copy=v=>JSON.parse(JSON.stringify(v));
function snapshot(){past.push(JSON.stringify(state));if(past.length>70)past.shift();future=[]}
function update(fn){snapshot();fn();render()}
function undo(){if(!past.length)return;future.push(JSON.stringify(state));state=JSON.parse(past.pop());render()}
function redo(){if(!future.length)return;past.push(JSON.stringify(state));state=JSON.parse(future.pop());render()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));notice('Draft saved','Changes are saved in this browser. Cloud publishing is not connected to this standalone editor.')}
function notice(title,text,confirm){$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogOk').onclick=()=>{$('dialog').close();if(confirm)confirm()};$('dialog').showModal()}
function help(){notice('SGC Business Services Studio','Click text directly to edit. Click a card to edit its properties. Use the Pages menu to switch pages, and Design to change the theme. Save draft stores data locally.')}
function publish(){notice('Publishing not connected','This editor cannot safely publish to your customer website yet. No website was published.')}
function preview(){previewing=!previewing;document.body.classList.toggle('previewmode',previewing);render()}
function device(v){deviceMode=v;render()}
function togglePages(){ $('pages').classList.toggle('open') }
function togglePanel(force){$('panel').classList.toggle('open',typeof force==='boolean'?force:!$('panel').classList.contains('open'))}
function showDesign(){tab='Style';selected=null;renderFields();togglePanel(true)}
function showAdvanced(){tab='Advanced';selected=null;renderFields();togglePanel(true)}
function setTab(t){tab=t;renderFields()}
function page(p){current=p;selected=null;filter='All';render();$('pages').classList.remove('open')}
function addPage(){const name='Custom Page '+(state.pages.length+1);update(()=>{state.pages.push(name);state.data[name]={title:name,desc:'Add your page description here.',items:[]}});page(name)}
function removePage(){if(current==='Home')return;const old=current;notice('Delete page?','Delete '+old+' from this draft?',()=>{update(()=>{state.pages=state.pages.filter(x=>x!==old);delete state.data[old]});page('Home')})}
function duplicatePage(){let name=current+' Copy';let n=2;while(state.pages.includes(name))name=current+' Copy '+n++;update(()=>{state.pages.push(name);state.data[name]=copy(state.data[current])});page(name)}
function movePage(dir){const i=state.pages.indexOf(current),j=i+dir;if(j<0||j>=state.pages.length)return;update(()=>{[state.pages[i],state.pages[j]]=[state.pages[j],state.pages[i]]})}
function addItem(){const item=current==='Products'?{name:'New Product',desc:'Product description',price:0,category:'Other',image:''}:current==='Categories'?{name:'New Category',desc:'Category description',image:''}:current==='Blog'?{name:'New Blog Post',desc:'Post excerpt',category:'Business',image:''}:{name:'New Service',desc:'Service description',button:'Learn More',image:''};update(()=>{(state.data[current].items??=[]).push(item)});selected={kind:'item',index:state.data[current].items.length-1};renderFields()}
function addElement(name){update(()=>{(state.extras[current]??=[]).push({type:name,title:'New '+name,body:'Click to customise this element.'})});selected={kind:'extra',index:state.extras[current].length-1};renderFields();togglePanel(true)}
function chooseItem(i){selected={kind:'item',index:i};tab='Content';renderFields();togglePanel(true)}
function chooseExtra(i){selected={kind:'extra',index:i};tab='Content';renderFields();togglePanel(true)}
function editable(key,value){return '<span contenteditable="'+(!previewing)+'" data-edit="'+esc(key)+'">'+esc(value)+'</span>'}
function imageCard(item){return item.image?'<img src="'+esc(item.image)+'" alt="'+esc(item.name)+'" loading="lazy">':''}
function itemCard(item,i){return '<article class="card" data-item="'+i+'">'+imageCard(item)+'<h3>'+esc(item.name)+'</h3><p>'+esc(item.desc||'')+'</p>'+(current==='Products'?'<div class="price">R'+Number(item.price||0).toFixed(2)+'</div><button class="cta" type="button">Add to Cart</button>':current==='Services'?'<span style="color:#b58b47">'+esc(item.button||'Learn More')+' →</span>':'')+'</article>'}
function pageBody(){const d=state.data[current]||{};if(current==='Home'){let body='<section class="hero" style="background-image:linear-gradient(90deg,#f7f2edeb 0%,#f7f2edd8 40%,#ffffff00 78%),url(&quot;'+esc(state.hero)+'&quot;)"><div class="hero-inner"><div class="eyebrow">'+editable('eyebrow',d.eyebrow)+'</div><h1>'+editable('title',d.title)+'</h1><p>'+editable('desc',d.desc)+'</p><a class="cta" href="#" data-nav="Contact">'+editable('button',d.button)+' →</a><a class="cta outline" href="#" data-nav="Services">Our Services</a></div></section>';if(state.theme.showServices)body+='<section class="section"><small class="eyebrow">OUR SERVICES</small><h2>Professional Services for Your Business</h2><p>Expert support tailored to your business goals</p><div class="cards">'+state.data.Services.items.map((it,i)=>'<article class="card" data-home-service="'+i+'"><h3>'+esc(it.name)+'</h3><p>'+esc(it.desc)+'</p><span style="color:#bd8e46">Learn More →</span></article>').join('')+'</div></section>';if(state.theme.showProducts)body+='<section class="section"><h2>Featured Products</h2><div class="cards">'+state.data.Products.items.slice(0,3).map((it,i)=>'<article class="card" data-home-product="'+i+'">'+imageCard(it)+'<h3>'+esc(it.name)+'</h3><p>R'+Number(it.price||0).toFixed(2)+'</p></article>').join('')+'</div></section>';return body}
let html='<section class="section"><h2>'+editable('title',d.title||current)+'</h2>'+(d.desc?'<p>'+editable('desc',d.desc)+'</p>':'');
if(current==='Products'){const cats=['All',...state.data.Categories.items.map(x=>x.name)];html+='<div class="chips">'+cats.map(c=>'<button class="'+(filter===c?'active':'')+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'}
if(current==='Categories'){html+='<div class="cards">'+d.items.map((it,i)=>'<article class="card" data-category="'+i+'">'+imageCard(it)+'<h3>'+esc(it.name)+'</h3><p>'+esc(it.desc||'')+'</p><span style="color:#bd8e46">View products →</span></article>').join('')+'</div>'}
else if(d.items){html+='<div class="cards">'+d.items.map((it,i)=>current==='Products'&&filter!=='All'&&it.category!==filter?'':itemCard(it,i)).join('')+'</div>'}
if(current==='Contact')html+='<form id="contactForm">'+(d.fields||[]).map(f=>f==='Message'?'<textarea placeholder="'+esc(f)+'" required></textarea>':'<input placeholder="'+esc(f)+'" '+(f==='Email'?'type="email"':'')+' required>').join('')+'<button class="cta" type="submit">'+esc(d.button||'Send Message')+'</button></form>';
html+='</section>';return html}
function render(){const site=$('site'),d=state.theme;site.className='site '+(deviceMode==='desktop'?'':deviceMode);site.style.setProperty('--accent',state.accent);site.style.setProperty('--headfont',"'"+d.headingFont+"'");site.style.setProperty('--bodyfont',"'"+d.bodyFont+"'");site.style.setProperty('--headingcolor',d.heading);site.style.setProperty('--bodycolor',d.text);site.style.setProperty('--radius',d.buttonRadius+'px');site.style.setProperty('--space',d.spacing+'px');site.style.background=d.background;
$('canvasLabel').textContent=current+' · '+(previewing?'Preview':'Live editor');
$('pageList').innerHTML=state.pages.map(p=>'<button class="pagebtn '+(current===p?'active':'')+'" data-page="'+esc(p)+'"><span>♧ &nbsp; '+esc(p)+(state.hidden.includes(p)?' ◌':'')+'</span><span>›</span></button>').join('');
const nav=state.pages.filter(p=>!state.hidden.includes(p)&&p!=='Categories').slice(0,7);
site.innerHTML=(d.showContact?'<div class="contactbar">☎ &nbsp; 010 123 4567 &nbsp; · &nbsp; ✉ info@businesspro.co.za <span style="float:right">f　◎　▣</span></div>':'')+'<header class="sitehead" style="background:'+esc(d.header)+'"><strong>▥ '+editable('brand',state.brand)+'</strong><nav>'+nav.map(p=>'<a href="#" data-nav="'+esc(p)+'">'+esc(p)+'</a>').join('')+'</nav><a href="#" class="cta" data-nav="Contact">Get a Quote</a></header>'+pageBody()+(state.extras[current]||[]).map((it,i)=>'<section class="section" data-extra="'+i+'"><h2>'+esc(it.title)+'</h2><p>'+esc(it.body)+'</p></section>').join('')+(d.showFooter?'<footer class="sitefooter" style="background:'+esc(d.footer)+'"><h3>'+esc(state.brand)+'</h3>© '+new Date().getFullYear()+' · Powered by SGC Network</footer>':'');
site.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('blur',()=>{const k=el.dataset.edit,v=el.innerText.trim();if(k==='brand')update(()=>state.brand=v);else update(()=>state.data[current][k]=v)}));
site.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();page(el.dataset.nav)});
site.querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>chooseItem(Number(el.dataset.item)));
site.querySelectorAll('[data-home-service]').forEach(el=>el.onclick=()=>{page('Services');chooseItem(Number(el.dataset.homeService))});
site.querySelectorAll('[data-home-product]').forEach(el=>el.onclick=()=>{page('Products');chooseItem(Number(el.dataset.homeProduct))});
site.querySelectorAll('[data-category]').forEach(el=>el.onclick=()=>{const cat=state.data.Categories.items[Number(el.dataset.category)];page('Products');filter=cat.name;render()});
site.querySelectorAll('[data-extra]').forEach(el=>el.onclick=()=>chooseExtra(Number(el.dataset.extra)));
site.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});
site.querySelectorAll('.card .cta').forEach(el=>el.onclick=e=>{e.stopPropagation();notice('Checkout connection pending','This template editor is not connected to checkout yet.')});
const form=$('contactForm');if(form)form.onsubmit=e=>{e.preventDefault();notice('Contact form preview','Form delivery needs a connected website backend.')};
document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>page(el.dataset.page));renderFields()}
function field(label,value,key,type='text'){return '<label>'+esc(label)+'</label>'+(type==='textarea'?'<textarea data-field="'+esc(key)+'">'+esc(value)+'</textarea>':'<input type="'+type+'" data-field="'+esc(key)+'" value="'+esc(value)+'">')}
function control(label,value,key,type='text'){return '<label>'+esc(label)+'</label><input type="'+type+'" data-theme="'+esc(key)+'" value="'+esc(value)+'">'}
function renderFields(){const f=$('fields'),d=state.data[current]||{},t=state.theme;document.querySelectorAll('.tabs button').forEach(el=>el.classList.toggle('active',el.id==='tab'+tab));let html='';
if(tab==='Style'){html='<h4>Colour Palette</h4><div class="swatches">'+['#111111','#d9a54e','#f8e7e2','#f5bec5','#ececec'].map(c=>'<button style="background:'+c+'" data-swatch="'+c+'"></button>').join('')+'</div>'+control('Primary accent',state.accent,'accent','color')+control('Header background',t.header,'header','color')+control('Footer background',t.footer,'footer','color')+control('Heading colour',t.heading,'heading','color')+control('Body text colour',t.text,'text','color')+control('Background',t.background,'background','color')+'<h4>Fonts</h4><label>Heading font</label><select data-theme="headingFont">'+['Playfair Display','DM Sans','Georgia','Arial'].map(x=>'<option '+(x===t.headingFont?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Body font</label><select data-theme="bodyFont">'+['DM Sans','Arial','Georgia','Playfair Display'].map(x=>'<option '+(x===t.bodyFont?'selected':'')+'>'+x+'</option>').join('')+'</select><h4>Spacing & Buttons</h4>'+control('Button radius (px)',t.buttonRadius,'buttonRadius','range')+control('Section spacing (px)',t.spacing,'spacing','range')}
else if(tab==='Advanced'){html='<h4>Page settings</h4>'+field('Page name',current,'pageName')+'<div class="row"><button data-action="duplicatePage">Duplicate</button><button data-action="deletePage" class="danger">Delete</button></div><div class="row"><button data-action="moveUp">Move ↑</button><button data-action="moveDown">Move ↓</button></div><label><input type="checkbox" data-action="hidePage" '+(state.hidden.includes(current)?'checked':'')+'> Hide page from menu</label><h4>Section visibility</h4>'+[['showContact','Contact bar'],['showFooter','Footer'],['showServices','Homepage services'],['showProducts','Homepage products']].map(([k,n])=>'<label><input type="checkbox" data-theme="'+k+'" '+(t[k]?'checked':'')+'> '+n+'</label>').join('')+'<h4>Draft management</h4><button data-action="save">Save draft</button><p class="small">Publishing is not connected. Drafts remain in this browser.</p>'}
else if(selected){const obj=selected.kind==='item'?d.items?.[selected.index]:state.extras[current]?.[selected.index];$('panelTitle').textContent='Edit '+(selected.kind==='item'?current.slice(0,-1):'Element');html='<h4>'+esc(obj?.name||obj?.title||'Selected element')+'</h4>'+Object.entries(obj||{}).filter(([k,v])=>typeof v!=='object').map(([k,v])=>field(k==='desc'?'Description':k[0].toUpperCase()+k.slice(1),v,'item:'+k,k==='desc'?'textarea':k==='price'?'number':'text')).join('')+'<div class="row"><button data-action="duplicateItem">Duplicate</button><button data-action="moveItemUp">↑</button><button data-action="moveItemDown">↓</button></div><button data-action="deleteItem" class="danger">Delete selected</button><button data-action="clearSelection">Back to page</button>'}
else{$('panelTitle').textContent='Edit '+current;html='<h4>Page Content</h4>'+field('Heading',d.title||current,'title')+field('Description',d.desc||'','desc','textarea');if(current==='Home')html+=field('Eyebrow',d.eyebrow,'eyebrow')+field('Button label',d.button,'button')+field('Hero image URL',state.hero,'hero')+field('Business name',state.brand,'brand');if(['Services','Products','Categories','Blog'].includes(current))html+='<h4>Manage '+current+'</h4><button class="gold" data-action="addItem">＋ Add '+(current==='Products'?'Product':current==='Categories'?'Category':current==='Blog'?'Blog Post':'Service')+'</button>'+(d.items||[]).map((it,i)=>'<div class="listitem"><span>'+esc(it.name)+'</span><button data-select="'+i+'">Edit</button><button data-delete="'+i+'" class="danger">×</button></div>').join('');if(current==='Contact')html+=field('Submit button text',d.button||'Send Message','button')+'<h4>Form fields</h4>'+(d.fields||[]).map((x,i)=>'<div class="listitem">'+esc(x)+' <button data-remove-field="'+i+'">×</button></div>').join('')+'<button data-action="addField">＋ Add field</button>'}
f.innerHTML=html;
f.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const k=el.dataset.field,v=el.value;update(()=>{if(k==='brand')state.brand=v;else if(k==='hero')state.hero=v;else if(k==='pageName'){if(!v.trim()||state.pages.includes(v.trim()))return;const i=state.pages.indexOf(current);state.pages[i]=v.trim();state.data[v.trim()]=state.data[current];delete state.data[current];current=v.trim()}else if(k.startsWith('item:')){const obj=selected.kind==='item'?state.data[current].items[selected.index]:state.extras[current][selected.index];obj[k.slice(5)]=k==='item:price'?Number(v):v}else state.data[current][k]=v})});
f.querySelectorAll('[data-theme]').forEach(el=>el.onchange=()=>{const k=el.dataset.theme,v=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;update(()=>{if(k==='accent')state.accent=v;else state.theme[k]=v})});
f.querySelectorAll('[data-swatch]').forEach(el=>el.onclick=()=>update(()=>state.accent=el.dataset.swatch));
f.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>chooseItem(Number(el.dataset.select)));
f.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.delete);notice('Delete item?','Remove this item from the draft?',()=>update(()=>state.data[current].items.splice(i,1)))});
f.querySelectorAll('[data-remove-field]').forEach(el=>el.onclick=()=>update(()=>state.data.Contact.fields.splice(Number(el.dataset.removeField),1)));
f.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='addItem')addItem();if(a==='addField'){const name=prompt('Field label');if(name?.trim())update(()=>state.data.Contact.fields.push(name.trim()))}if(a==='save')save();if(a==='duplicatePage')duplicatePage();if(a==='deletePage')removePage();if(a==='moveUp')movePage(-1);if(a==='moveDown')movePage(1);if(a==='clearSelection'){selected=null;renderFields()}if(a==='duplicateItem'&&selected){update(()=>{const arr=selected.kind==='item'?state.data[current].items:state.extras[current];arr.splice(selected.index+1,0,copy(arr[selected.index]))})}if((a==='moveItemUp'||a==='moveItemDown')&&selected){const arr=selected.kind==='item'?state.data[current].items:state.extras[current],j=selected.index+(a==='moveItemUp'?-1:1);if(j>=0&&j<arr.length)update(()=>{[arr[selected.index],arr[j]]=[arr[j],arr[selected.index]];selected.index=j})}if(a==='deleteItem'&&selected){notice('Delete selected?','Remove this item?',()=>{update(()=>{const arr=selected.kind==='item'?state.data[current].items:state.extras[current];arr.splice(selected.index,1)});selected=null;renderFields()})}});
f.querySelectorAll('[data-action="hidePage"]').forEach(el=>el.onchange=()=>update(()=>state.hidden=el.checked?[...new Set([...state.hidden,current])]:state.hidden.filter(p=>p!==current)));
}
const tools=[['T','Text'],['H','Heading'],['▧','Image'],['▣','Button'],['▻','Video'],['□','Section'],['▤','Container'],['✧','Icon'],['—','Divider'],['＋','Spacer'],['▦','Form'],['♧','Map'],['ⓘ','FAQ'],['♙','Testimonial'],['♧','Team Member'],['▧','Gallery'],['▥','Pricing Table'],['◇','Service Card'],['▤','Product Listing'],['✎','Blog'],['◉','Social Icons']];
$('toolList').innerHTML=tools.map(([icon,name])=>'<button class="tool" data-add="'+name+'"><span class="ico">'+icon+'</span>'+name+'</button>').join('');document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>addElement(el.dataset.add));
render();
</script></body></html>
