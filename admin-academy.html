<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy Builder | SGC Admin</title><style>:root{--bg:#0b0b0b;--panel:#151515;--gold:#c6a15b;--ivory:#f6f0e5;--muted:#aaa;--line:#2b2b2b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font:28px Georgia,serif;letter-spacing:.08em}.brand small{display:block;font:9px Arial;letter-spacing:.28em}.gold{color:var(--gold)}h1,h2,h3{font-family:Georgia,serif}.hero{padding:48px 0 26px}h1{font-size:54px;margin:8px 0}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.btn{display:inline-block;background:var(--gold);color:#111;border:0;border-radius:999px;padding:12px 17px;font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:var(--ivory);border:1px solid #555}.field{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#101010;color:white;margin:6px 0 12px}textarea.field{min-height:110px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:15px 0}.stack{display:grid;gap:14px}.hidden{display:none}.status{font-size:12px;color:var(--gold)}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="admin-dashboard.html">SGC<small>ADMIN</small></a><a class="btn alt" href="admin-dashboard.html">Dashboard</a></div><section class="hero"><div class="gold">ACADEMY CMS</div><h1>Academy Builder.</h1><button class="btn" id="newCourse">+ Module / Course</button></section><div id="editor" class="panel hidden"><h2 id="editorTitle">New module</h2><input id="ctitle" class="field" placeholder="Module title"><input id="cslug" class="field" placeholder="slug"><textarea id="cdesc" class="field" placeholder="Description"></textarea><select id="caccess" class="field"><option value="start">SGC Start</option><option value="build">SGC Build</option></select><select id="cstatus" class="field"><option value="draft">Draft</option><option value="published">Published</option></select><input id="csort" class="field" type="number" value="10" placeholder="Sort order"><button class="btn" id="saveCourse">Save</button></div><section class="panel" style="margin-top:18px"><h2>Modules / Courses</h2><div id="courses">Loading…</div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/admin-guard.js"></script><script src="js/admin-academy.js"></script></body></html>
