<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Application Status | SGC Network</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf8;color:#29232b;font:15px/1.7 Arial,sans-serif}header,main{max-width:750px;margin:auto;padding:22px}header{display:flex;justify-content:space-between}a{color:#62466c}h1{font:clamp(34px,7vw,55px) Georgia,serif}.card{padding:28px;border-radius:20px;background:white;border:1px solid #e9e2e6}.badge{display:inline-block;padding:10px 18px;background:#eee9f7;border-radius:30px;font-weight:bold}small{color:#766e77}</style></head><body><header><strong>SGC NETWORK</strong><a href="jobs.html">Careers</a></header><main><h1>Your application.</h1><section class="card"><p id="msg">Checking your application…</p><h2 id="position"></h2><p id="stage" class="badge" hidden></p><p><small>Your status is updated when SGC Network reviews your application. Keep your private tracking link safe.</small></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>(async()=>{const q=new URLSearchParams(location.search);let id=q.get('id'),token=q.get('token');if(!id||!token){const saved=localStorage.getItem('sgc_last_career_application');if(saved){const p=new URL(saved);id=p.searchParams.get('id');token=p.searchParams.get('token')}}const msg=document.getElementById('msg');if(!id||!token){msg.textContent='No application tracking link found. Please use the private link you received after submitting your application.';return}const {data,error}=await window.sgcSupabase.rpc('career_application_status',{p_id:id,p_token:token});if(error||!data?.length){msg.textContent='Application not found. Check your private tracking link.';return}msg.textContent='Current recruitment stage';document.getElementById('position').textContent=data[0].job_title;const stage=document.getElementById('stage');stage.textContent=data[0].application_status;stage.hidden=false})().catch(e=>document.getElementById('msg').textContent='Unable to check status: '+e.message)</script></body></html>
