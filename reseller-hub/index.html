<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import from Screenshot | SGC Reseller Hub</title>
  <link rel="stylesheet" href="hub.css?v=2">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script defer src="../config.js"></script>
  <script defer src="../supabase-client.js"></script>
  <script defer src="hub.js?v=2"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">♧</span><span>SGC Network<small>RESELLER HUB</small></span></a>
    <nav aria-label="Account links"><a href="#storefront">My Store</a><a href="#products">Products</a><button id="logout" hidden>Sign out</button></nav>
  </header>
  <div class="shell">
    <aside>
      <nav id="navigation" aria-label="Dashboard">
        <a href="#dashboard"><span aria-hidden="true">⌂</span>Dashboard</a>
        <a href="#import"><span aria-hidden="true">⇧</span>Import Product <b>✦</b></a>
        <a href="#products"><span aria-hidden="true">▣</span>My Products</a>
        <a href="#orders"><span aria-hidden="true">▤</span>Orders</a>
        <a href="#customers"><span aria-hidden="true">♙</span>Customers</a>
        <a href="#storefront"><span aria-hidden="true">⌂</span>Storefront</a>
        <a href="#catalogue"><span aria-hidden="true">▥</span>Catalogue</a>
        <a href="#analytics"><span aria-hidden="true">▥</span>Analytics</a>
        <a href="#settings"><span aria-hidden="true">⚙</span>Settings</a>
      </nav>
      <div class="sidebar-art" aria-hidden="true"><span>♧</span><strong>Build<br>Sell<br>Grow</strong><small>with SGC Network</small></div>
    </aside>
    <main id="main">
      <p id="notice" role="status" hidden></p>
      <div id="view"></div>
      <template id="import-template">
        <div class="page-head">
          <div><h1>Import from Screenshot</h1><p>Upload a supplier screenshot and let AI prepare your product listing.</p></div>
          <ol class="steps"><li class="active">Upload</li><li>AI Extracts</li><li>Review &amp; Publish</li></ol>
        </div>
        <div class="workflow">
          <section class="panel upload">
            <h2><b>1</b> Upload Screenshot</h2>
            <label class="drop" id="drop" for="screenshots">
              <img id="source" alt="Uploaded supplier screenshot" hidden>
              <span id="drop-placeholder"><span class="upload-icon" aria-hidden="true">⇧</span><strong>Drop screenshots here</strong><small>PNG, JPG or WEBP</small></span>
            </label>
            <label class="button secondary" for="screenshots">↑ Upload Screenshot</label>
            <input class="sr-only" id="screenshots" type="file" accept="image/png,image/jpeg,image/webp" multiple>
            <small id="upload-status" role="status"></small>
          </section>
          <section class="panel processing">
            <div class="chip" aria-hidden="true">AI</div>
            <h2 class="sr-only">Processing</h2>
            <ul id="processing" aria-live="polite">
              <li>Analyse screenshot</li><li>Detect product photographs</li><li>Extract product images</li><li>Read product details</li><li>Identify variants and offers</li><li>Prepare listing for review</li>
            </ul>
          </section>
          <section class="panel result">
            <h2><b>2</b> Review &amp; Publish</h2>
            <div id="draft-list"></div>
            <div id="review" class="empty"><span aria-hidden="true">✦</span><strong>Your product preview</strong><p>Your extracted photo, product details and selling price fields will appear here.</p></div>
          </section>
        </div>
      </template>
    </main>
  </div>
</body>
</html>
