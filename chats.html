<script>
const sb=window.supabase.createClient('https://bxpexanyoyubxeqqlggh.supabase.co','sb_publishable_Z0_Y-Bj_G5qw4hMgDbQlgA__jj8rGGq');
const $=id=>document.getElementById(id);let me,profiles={},avatarUrls={},friends=[],threads=[],selected=null,filter='all',timer=null,reads={},replying=null,mediaFile=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=id=>profiles[id]?.display_name||'SGC member';

const key=t=>t.kind+':'+t.id;
async function markRead(t){if(!t)return;reads[key(t)]=new Date().toISOString();const r=await sb.from('sgc_chat_reads').upsert({user_id:me.id,thread_kind:t.kind,thread_id:t.id,last_read_at:reads[key(t)]});if(r.error)console.warn(r.error)}
async function loadReads(){const r=await sb.from('sgc_chat_reads').select('thread_kind,thread_id,last_read_at').eq('user_id',me.id);if(r.error)throw r.error;reads=Object.fromEntries((r.data||[]).map(x=>[x.thread_kind+':'+x.thread_id,x.last_read_at]))}
const format=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function error(e){console.error(e);alert(e.message||String(e))}
async function loadProfiles(ids){const missing=[...new Set(ids.filter(Boolean))].filter(id=>!profiles[id]);if(!missing.length)return;const r=await sb.from('sgc_social_profiles').select('user_id,display_name,avatar_path').in('user_id',missing);if(r.error)throw r.error;for(const p of r.data||[]){profiles[p.user_id]=p;if(p.avatar_path&&!avatarUrls[p.user_id]){const signed=await sb.storage.from('sgc-community').createSignedUrl(p.avatar_path,3600);if(!signed.error)avatarUrls[p.user_id]=signed.data.signedUrl}}}

async function loadThreads(){
 const [g,d,gm]=await Promise.all([sb.from('sgc_chat_groups').select('id,name,created_at'),sb.from('sgc_private_messages').select('sender_id,receiver_id,body,media_type,created_at').or('sender_id.eq.'+me.id+',receiver_id.eq.'+me.id).order('created_at',{ascending:false}).limit(1000),sb.from('sgc_chat_group_messages').select('group_id,sender_id,body,media_type,created_at').order('created_at',{ascending:false}).limit(1000)]);
 for(const r of [g,d,gm])if(r.error)throw r.error;
 const dm=new Map();for(const m of d.data||[]){const id=m.sender_id===me.id?m.receiver_id:m.sender_id;if(!dm.has(id))dm.set(id,{kind:'dm',id,label:name(id),preview:m.body||'📎 Media',updated:m.created_at,unread:0});const t=dm.get(id);if(m.sender_id!==me.id&&m.created_at>(reads[key(t)]||'1970-01-01'))t.unread++}
 for(const id of friends)if(!dm.has(id))dm.set(id,{kind:'dm',id,label:name(id),preview:'Start a conversation',updated:'',unread:0});
 await loadProfiles([...dm.keys()]);for(const t of dm.values())t.label=name(t.id);
 const groups=new Map((g.data||[]).map(x=>[x.id,{kind:'group',id:x.id,label:x.name,preview:'Group conversation',updated:x.created_at,unread:0}]));
 for(const m of gm.data||[]){const t=groups.get(m.group_id);if(!t)continue;if(m.created_at>t.updated){t.updated=m.created_at;t.preview=m.body||'📎 Media'}if(m.sender_id!==me.id&&m.created_at>(reads[key(t)]||'1970-01-01'))t.unread++}
 threads=[...dm.values(),...groups.values()].sort((x,y)=>String(y.updated).localeCompare(String(x.updated)));renderThreads();
}
function renderThreads(){const q=$('search').value.toLowerCase();$('threads').innerHTML='';const visible=threads.filter(t=>(filter==='all'||(filter==='groups'?t.kind==='group':t.kind==='dm'))&&t.label.toLowerCase().includes(q));if(!visible.length){$('threads').innerHTML='<div class="notice">No conversations yet. Start a private chat or create a group.</div>';return}
 for(const t of visible){const b=document.createElement('button');b.className='thread'+(selected?.id===t.id&&selected.kind===t.kind?' active':'');b.innerHTML=avatar(t.label,t.kind==='dm'?t.id:null)+'<span class="info"><strong>'+esc(t.label)+'</strong><small>'+esc(t.preview||'')+'</small></span>'+(t.unread?'<span class="badge">'+(t.unread>99?'99+':t.unread)+'</span>':'');b.onclick=()=>openThread(t);$('threads').append(b)}}
async function openThread(t){$('messages').dataset.renderSignature='';selected=t;replying=null;$('reply-banner').hidden=true;await markRead(t);$('shell').classList.add('open');$('chat-name').textContent=t.label;await loadProfiles(t.kind==='dm'?[t.id]:[]);const headAvatar=$('chat-avatar');headAvatar.innerHTML=t.kind==='dm'&&avatarUrls[t.id]?'<img src="'+esc(avatarUrls[t.id])+'" alt="'+esc(t.label)+'">':esc(t.label.slice(0,1).toUpperCase());const profileLink=t.kind==='dm'?'profile.html?user='+encodeURIComponent(t.id):null;headAvatar.style.cursor=profileLink?'pointer':'default';$('chat-name').style.cursor=profileLink?'pointer':'default';headAvatar.title=profileLink?'View member profile':'';$('chat-name').title=headAvatar.title;headAvatar.onclick=profileLink?()=>location.href=profileLink:null;$('chat-name').onclick=profileLink?()=>location.href=profileLink:null;renderThreads();await loadMessages();$('message').focus()}
function sgcChatDialog(title,description,choices){
 return new Promise(resolve=>{
  const shade=document.createElement('div');shade.className='sgc-chat-dialog-shade';
  const dialog=document.createElement('section');dialog.className='sgc-chat-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');

  function onKey(e){if(e.key==='Escape')finish(null)}
  for(const choice of choices){const b=document.createElement('button');b.type='button';b.textContent=choice.label;b.className=choice.kind||'';b.onclick=()=>finish(choice.value);buttons.append(b)}
  dialog.append(buttons);shade.append(dialog);document.body.append(shade);shade.addEventListener('pointerdown',e=>{if(e.target===shade)finish(null)});document.addEventListener('keydown',onKey);buttons.querySelector('button')?.focus()
 })
}
async function loadMessages(){

 if(r.error)throw r.error;if(current!==selected)return;const hiddenIds=new Set(JSON.parse(localStorage.getItem('sgc-chat-hidden:'+me.id)||'[]'));const msgs=(r.data||[]).filter(m=>!hiddenIds.has(m.id));await loadProfiles(msgs.map(x=>x.sender_id));const byId=new Map(msgs.map(x=>[x.id,x]));

 if(current.kind==='dm'&&msgs.length){
