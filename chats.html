<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8eaf3"><title>Chats · SGC Network</title>
<style>
:root{--bg:#f7f0f5;--paper:#fffafc;--pink:#b85b94;--ink:#3f2e3b;--line:#ead8e6;--muted:#887782}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 system-ui,Arial;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}header{height:65px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}header strong{font:26px Georgia,serif}header a{color:var(--pink);text-decoration:none;font-weight:700}.shell{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100dvh - 65px);max-width:1350px;margin:auto;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line)}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidebar-top{padding:16px;border-bottom:1px solid var(--line)}.sidebar-top h2{margin:0 0 12px;font:26px Georgia,serif}.actions{display:flex;gap:7px;margin-bottom:12px}.btn{border:1px solid #e1bfd5;border-radius:14px;padding:10px 13px;background:#f7e5f1;color:#744466;font-weight:700}.btn.primary{background:#ae598f;color:white}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}.tabs{display:flex;gap:7px;margin-top:12px}.tabs button{flex:1}.tabs .selected{background:#b45d95;color:white}.list{overflow:auto;flex:1}.thread{width:100%;text-align:left;display:flex;gap:11px;align-items:center;padding:14px 16px;background:transparent;border:0;border-bottom:1px solid #f2e6ee}.thread:hover,.thread.active{background:#f7e5f1}.avatar{width:45px;height:45px;border-radius:50%;background:#edd4e6;color:#87466f;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.thread .info{min-width:0;flex:1}.thread strong,.thread small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread small{color:var(--muted);margin-top:4px}.conversation{display:flex;flex-direction:column;min-width:0;background:linear-gradient(140deg,#fcf4f9,#f5eaf5)}.chat-head{height:70px;flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff9fc;border-bottom:1px solid var(--line)}.chat-head strong{font-size:17px}.back{display:none;border:0;background:none;font-size:24px}.messages{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(80%,520px);align-self:flex-start;background:#fff;padding:11px 13px;border-radius:16px 16px 16px 4px;box-shadow:0 1px 4px #51324716;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#d978aa;color:#fff;border-radius:16px 16px 4px 16px}.bubble .who{font-size:11px;font-weight:800;color:#a35484;display:block;margin-bottom:4px}.bubble.mine .who{color:#fff}.bubble time{display:block;font-size:10px;text-align:right;opacity:.75;margin-top:5px}.compose{display:flex;gap:10px;padding:13px;background:#fff9fc;border-top:1px solid var(--line)}.compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;padding:13px 17px}.compose button{border:0;background:#b65d96;color:#fff;border-radius:50%;width:46px;height:46px;font-size:21px}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}.notice{padding:12px 16px;color:#875575}.modal{position:fixed;inset:0;background:#2b1d2bb3;display:grid;place-items:center;z-index:100;padding:20px}.modal[hidden]{display:none}.dialog{background:#fffafc;border-radius:22px;padding:24px;width:min(430px,100%);max-height:85dvh;overflow:auto}.dialog h2{margin-top:0;font:26px Georgia,serif}.dialog input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.friend{display:flex;align-items:center;gap:10px;padding:9px 0}.friend input{width:18px;height:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:700px){header{height:58px}.shell{height:calc(100dvh - 58px);display:block;position:relative}.sidebar,.conversation{position:absolute;inset:0}.conversation{display:none}.shell.open .sidebar{display:none}.shell.open .conversation{display:flex}.back{display:block}.sidebar-top{padding:12px}.messages{padding:14px}.bubble{max-width:88%}}
</style></head><body>
<header><strong>SGC <span style="color:#b45d95">Chats</span></strong><a href="community.html">← SGC Community</a></header>
<div class="shell" id="shell"><aside class="sidebar"><div class="sidebar-top"><h2>Messages ♡</h2><div class="actions"><button class="btn primary" id="new-group">＋ New group</button><button class="btn" id="new-chat">＋ Private chat</button></div><input class="search" id="search" placeholder="Search conversations" aria-label="Search conversations"><div class="tabs"><button class="btn selected" id="tab-all">All</button><button class="btn" id="tab-private">Private</button><button class="btn" id="tab-groups">Groups</button></div></div><div id="threads" class="list"></div></aside>
<section class="conversation"><div class="chat-head"><button class="back" id="back" aria-label="Back to chats">‹</button><div class="avatar" id="chat-avatar">♡</div><strong id="chat-name">Select a conversation</strong></div><div class="messages" id="messages"><div class="empty">Your conversations appear here 💗</div></div><form class="compose" id="compose"><input id="message" maxlength="4000" placeholder="Message" autocomplete="off" aria-label="Write a message" required><button type="submit" aria-label="Send message">➤</button></form></section></div>
<div class="modal" id="modal" hidden><div class="dialog"><h2 id="modal-title"></h2><div id="modal-content"></div><div class="dialog-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="create">Continue</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://bxpexanyoyubxeqqlggh.supabase.co','sb_publishable_Z0_Y-Bj_G5qw4hMgDbQlgA__jj8rGGq');
const $=id=>document.getElementById(id);let me,profiles={},friends=[],threads=[],selected=null,filter='all',timer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=id=>profiles[id]?.display_name||'SGC member';
const avatar=(label)=>'<div class="avatar">'+esc((label||'S').slice(0,1).toUpperCase())+'</div>';
const format=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function error(e){console.error(e);alert(e.message||String(e))}
async function loadProfiles(ids){const missing=[...new Set(ids.filter(Boolean))].filter(id=>!profiles[id]);if(!missing.length)return;const r=await sb.from('sgc_social_profiles').select('user_id,display_name,avatar_path').in('user_id',missing);if(r.error)throw r.error;for(const p of r.data||[])profiles[p.user_id]=p}
async function loadFriends(){const r=await sb.from('sgc_friend_requests').select('sender_id,receiver_id,status').eq('status','accepted').or('sender_id.eq.'+me.id+',receiver_id.eq.'+me.id);if(r.error)throw r.error;friends=[...new Set((r.data||[]).map(x=>x.sender_id===me.id?x.receiver_id:x.sender_id))];await loadProfiles(friends)}
async function loadThreads(){
 const [groups,dms]=await Promise.all([sb.from('sgc_chat_groups').select('id,name,created_at').order('created_at',{ascending:false}),sb.from('sgc_private_messages').select('sender_id,receiver_id,body,created_at').or('sender_id.eq.'+me.id+',receiver_id.eq.'+me.id).order('created_at',{ascending:false}).limit(500)]);
 if(groups.error)throw groups.error;if(dms.error)throw dms.error;
 const seen=new Set();const direct=[];
 for(const m of dms.data||[]){const id=m.sender_id===me.id?m.receiver_id:m.sender_id;if(!seen.has(id)){seen.add(id);direct.push({kind:'dm',id,label:name(id),preview:m.body,updated:m.created_at})}}
 for(const id of friends)if(!seen.has(id))direct.push({kind:'dm',id,label:name(id),preview:'Start a conversation',updated:''});
 await loadProfiles(direct.map(x=>x.id));for(const t of direct)t.label=name(t.id);
 threads=[...direct,...(groups.data||[]).map(g=>({kind:'group',id:g.id,label:g.name,preview:'Group conversation',updated:g.created_at}))].sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
 renderThreads();
}
function renderThreads(){const q=$('search').value.toLowerCase();$('threads').innerHTML='';const visible=threads.filter(t=>(filter==='all'||(filter==='groups'?t.kind==='group':t.kind==='dm'))&&t.label.toLowerCase().includes(q));if(!visible.length){$('threads').innerHTML='<div class="notice">No conversations yet. Start a private chat or create a group.</div>';return}
 for(const t of visible){const b=document.createElement('button');b.className='thread'+(selected?.id===t.id&&selected.kind===t.kind?' active':'');b.innerHTML=avatar(t.label)+'<span class="info"><strong>'+esc(t.label)+'</strong><small>'+esc(t.preview||'')+'</small></span>';b.onclick=()=>openThread(t);$('threads').append(b)}}
async function openThread(t){selected=t;$('shell').classList.add('open');$('chat-name').textContent=t.label;$('chat-avatar').textContent=t.label.slice(0,1).toUpperCase();renderThreads();await loadMessages();$('message').focus()}
async function loadMessages(){if(!selected)return;const current=selected;const r=current.kind==='group'?await sb.from('sgc_chat_group_messages').select('id,group_id,sender_id,body,created_at').eq('group_id',current.id).order('created_at',{ascending:true}).limit(300):await sb.from('sgc_private_messages').select('id,sender_id,receiver_id,body,created_at').or('and(sender_id.eq.'+me.id+',receiver_id.eq.'+current.id+'),and(sender_id.eq.'+current.id+',receiver_id.eq.'+me.id+')').order('created_at',{ascending:true}).limit(300);
 if(r.error)throw r.error;if(selected!==current)return;const msgs=r.data||[];await loadProfiles(msgs.map(m=>m.sender_id));const box=$('messages');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML='';for(const m of msgs){const d=document.createElement('div');d.className='bubble'+(m.sender_id===me.id?' mine':'');d.innerHTML=(current.kind==='group'&&m.sender_id!==me.id?'<span class="who">'+esc(name(m.sender_id))+'</span>':'')+'<span>'+esc(m.body)+'</span><time>'+esc(format(m.created_at))+'</time>';box.append(d)}if(nearBottom||!box.dataset.loaded)box.scrollTop=box.scrollHeight;box.dataset.loaded='yes'}
$('compose').onsubmit=async e=>{e.preventDefault();if(!selected)return;const body=$('message').value.trim();if(!body)return;const t=selected;const r=t.kind==='group'?await sb.from('sgc_chat_group_messages').insert({group_id:t.id,sender_id:me.id,body}):await sb.from('sgc_private_messages').insert({sender_id:me.id,receiver_id:t.id,body});if(r.error){error(r.error);return}$('message').value='';t.preview=body;t.updated=new Date().toISOString();renderThreads();await loadMessages()};
function showModal(kind){$('modal').hidden=false;$('modal-title').textContent=kind==='group'?'Create a group chat':'Start a private chat';$('modal-content').innerHTML=(kind==='group'?'<label>Group name<input type="text" id="group-name" maxlength="70" placeholder="e.g. Business besties"></label><p>Select members to add:</p>':'<p>Choose a member:</p>')+friends.map(id=>'<label class="friend"><input type="'+(kind==='group'?'checkbox':'radio')+'" name="friends" value="'+esc(id)+'">'+esc(name(id))+'</label>').join('')+(friends.length?'':'<p>No accepted SGC member connections yet. Connect with members first.</p>');$('create').textContent=kind==='group'?'Create group':'Open chat';$('create').onclick=async()=>{try{const ids=[...document.querySelectorAll('input[name=friends]:checked')].map(x=>x.value);if(kind==='group'){const groupName=$('group-name').value.trim();if(!ids.length)throw Error('Select at least one member');const r=await sb.rpc('sgc_create_chat_group',{p_name:groupName,p_members:ids});if(r.error)throw r.error;$('modal').hidden=true;await loadThreads();const t=threads.find(x=>x.kind==='group'&&x.id===r.data);if(t)await openThread(t)}else{if(ids.length!==1)throw Error('Select one member');$('modal').hidden=true;const t={kind:'dm',id:ids[0],label:name(ids[0]),preview:'',updated:''};await openThread(t)}}catch(e){error(e)}}}
$('new-group').onclick=()=>showModal('group');$('new-chat').onclick=()=>showModal('dm');$('cancel').onclick=()=>{$('modal').hidden=true};$('back').onclick=()=>{$('shell').classList.remove('open')};$('search').oninput=renderThreads;
for(const [id,value] of [['tab-all','all'],['tab-private','private'],['tab-groups','groups']])$(id).onclick=()=>{filter=value;for(const k of ['tab-all','tab-private','tab-groups'])$(k).classList.toggle('selected',k===id);renderThreads()};
(async()=>{try{const r=await sb.auth.getUser();if(!r.data?.user){location.href='login.html?redirect=chats.html';return}me=r.data.user;await loadFriends();await loadThreads();const withId=new URLSearchParams(location.search).get('with');if(withId&&friends.includes(withId))await openThread({kind:'dm',id:withId,label:name(withId),preview:'',updated:''});timer=setInterval(async()=>{try{if(!document.hidden){await loadThreads();if(selected)await loadMessages()}}catch(e){console.warn(e)}},5000)}catch(e){error(e)}})();
</script></body></html>
