<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Payment status | SGC Network</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="/css/policy-links.css"></head><body><main class="container" style="max-width:640px;padding:70px 24px"><h1 id="heading">Checking payment.</h1><p id="status" role="status">Your access updates after PayFast confirms your payment.</p><a class="btn dark" href="dashboard.html">Go to My SGC</a> <a href="shop.html">Return to shop</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
(async()=>{const params=new URLSearchParams(location.search),heading=document.getElementById('heading'),status=document.getElementById('status');if(params.has('cancelled')){heading.textContent='Checkout cancelled.';status.textContent='No payment has been confirmed. You can return to the shop whenever you are ready.';return;}const reference=params.get('reference');if(!reference)return;const sb=window.sgcSupabase;if(!sb){heading.textContent='Payment confirmation pending.';return;}const {data:{user}}=await sb.auth.getUser();if(!user){heading.textContent='Sign in to view payment status.';return;}for(let attempt=0;attempt<12;attempt++){const {data,error}=await sb.from('sgc_stitch_transactions').select('status').eq('merchant_reference',reference).eq('user_id',user.id).maybeSingle();if(error)break;if(data?.status==='paid'){heading.textContent='Payment confirmed.';status.textContent='Thank you! Your payment is verified. Open My SGC to view your access and purchases.';return;}await new Promise(resolve=>setTimeout(resolve,2500));}heading.textContent='Payment confirmation pending.';status.textContent='We are waiting for PayFast confirmation. Check My SGC shortly; please do not pay again while confirmation is pending.';})();
</script><footer class="sgc-policy-footer"><div class="sgc-policy-inner"><span>SGC Network · Customer information</span><nav aria-label="SGC policies"><a href="/policies.html">All policies</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/refunds.html">Refunds</a><a href="/subscriptions.html">Subscriptions &amp; cancellation</a><a href="/enquiry.html">Contact</a></nav></div></footer></body></html>
