<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGC Studio · Business Control</title><style>
:root{--bg:#f7f5f1;--ink:#25221f;--line:#e5e0d9;--muted:#77716b;--accent:#e9d9b4}*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}aside{background:#fff;border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;letter-spacing:2px;font-size:20px;margin:3px 12px 24px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:5px}.nav,.sub{width:100%;text-align:left;border:0;background:transparent;padding:11px 13px;border-radius:9px;color:#3b3734;display:block}.nav:hover,.sub:hover,.nav.active,.sub.active{background:#f3efe7}.nav{font-weight:650;margin:2px 0}.sub{padding-left:31px;font-size:13px}.subgroup[hidden]{display:none}main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:17px 29px;display:flex;justify-content:space-between;align-items:center}.content{padding:30px;max-width:1500px;margin:auto}h1{font-size:28px;margin:0 0 7px}h2{font-size:17px;margin:0}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;margin-top:18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{font-size:28px;font-weight:750;margin:10px 0 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #d6cfc5;background:white;border-radius:8px;padding:10px 13px}.btn.primary{background:#27221f;color:white;border-color:#27221f}.search{padding:11px 13px;border:1px solid #d8d2ca;border-radius:8px;min-width:260px;max-width:100%}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:14px 12px;text-align:left;border-bottom:1px solid #eee9e3;font-size:13px}th{color:#756e68;font-size:12px;font-weight:700}tr:last-child td{border:0}.tag{background:#f1eee8;padding:5px 9px;border-radius:30px;display:inline-block}.tag.paid{background:#e4f3e9}.tag.pending{background:#fff1d8}.notice{margin-top:15px;min-height:20px;color:#675e52}.view[hidden],#app[hidden],#gate[hidden]{display:none}.links{display:flex;flex-wrap:wrap;gap:10px}.links a{padding:12px 15px;border:1px solid var(--line);border-radius:9px;background:white}.detail{white-space:pre-wrap;line-height:1.8}.footnote{font-size:12px;color:#77716b;margin-top:16px}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:195px minmax(0,1fr)}.content{padding:18px}}@media(max-width:600px){.layout{display:block}aside{position:static;height:auto;max-height:230px}.cards{grid-template-columns:1fr}.top{padding:14px}.content{padding:14px}}
</style></head><body><div id="gate" class="content"><h1>SGC Studio</h1><p id="gate-message">Verifying your existing SGC admin session…</p><a href="../sgc-academy-extra/admin.html">Return to Admin</a></div><div id="app" hidden class="layout"><aside><div class="brand">SGC <small>STUDIO</small></div><button class="nav active" data-view="overview">◈ Overview</button><button class="nav" data-toggle="orders">▤ Orders ▾</button><div class="subgroup" id="group-orders"><button class="sub" data-view="orders">All orders</button><button class="sub" data-view="payments">Payments</button><button class="sub" data-view="drafts">Draft orders</button><button class="sub" data-view="create">Create order</button></div><button class="nav" data-toggle="products">▣ Products ▾</button><div class="subgroup" id="group-products" hidden><button class="sub" data-view="products">All products</button><button class="sub" data-view="memberships">Memberships</button><button class="sub" data-view="categories">Categories</button><button class="sub" data-view="collections">Collections</button><button class="sub" data-view="variants">Variants</button><button class="sub" data-view="purchasing">Purchase orders</button><button class="sub" data-view="gifts">Gift cards</button></div><button class="nav" data-view="customers">♧ Customers</button><button class="nav" data-toggle="store">◫ Online Store ▾</button><div class="subgroup" id="group-store" hidden><button class="sub" data-view="pages">Pages</button><button class="sub" data-view="website">Website Studio</button><button class="sub" data-view="navigation">Navigation</button><button class="sub" data-view="theme">Theme settings</button></div><button class="nav" data-toggle="academy">▦ Academy ▾</button><div class="subgroup" id="group-academy" hidden><button class="sub" data-view="academy">Overview</button><button class="sub" data-view="courses">Courses</button><button class="sub" data-view="modules">Modules</button><button class="sub" data-view="lessons">Lessons</button><button class="sub" data-view="students">Students</button><button class="sub" data-view="resources">Resources</button></div><button class="nav" data-toggle="bookings">◷ Bookings ▾</button><div class="subgroup" id="group-bookings" hidden><button class="sub" data-view="bookings">Appointments</button><button class="sub" data-view="calendar">Calendar</button><button class="sub" data-view="services">Services</button></div><button class="nav" data-view="settings">⚙ Settings</button></aside><main><div class="top"><strong>SGC Network / Studio</strong><div><a class="btn" href="../sgc-academy-extra/admin.html">Admin ↗</a> <a class="btn" href="https://sgcnetwork.co.za/" target="_blank" rel="noopener">Website ↗</a></div></div><div class="content"><h1 id="heading">Overview</h1><p id="description" class="muted">Live SGC business information</p><div id="content"></div><div id="notice" class="notice" role="status"></div></div></main></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://bxpexanyoyubxeqqlggh.supabase.co','sb_publishable_Z0_Y-Bj_G5qw4hMgDbQlgA__jj8rGGq',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'R'+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});const date=s=>s?new Date(s).toLocaleString('en-ZA'):'—';const link=(url,label)=>`<a class="btn" href="${esc(url)}">${esc(label)}</a>`;let orders=[],products=[],memberships=[],bookings=[],courses=[],modules=[],lessons=[],profiles=[],section='overview';
function message(t){$('notice').textContent=t}function card(t){return `<div class="card">${t}</div>`}function grid(headers,rows){return `<div class="card scroll"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">No records available.</td></tr>`}</tbody></table></div>`}function metric(label,n){return `<div class="card"><span class="muted">${esc(label)}</span><div class="metric">${esc(n)}</div></div>`}function show(title,desc,html){$('heading').textContent=title;$('description').textContent=desc;$('content').innerHTML=html;message('')}
async function query(table,columns='*'){const {data,error}=await db.from(table).select(columns).limit(500);if(error)throw Error(`${table}: ${error.message}`);return data||[]}async function fetchOrders(){const {data,error}=await db.rpc('sgc_studio_get_orders');if(error)throw error;orders=data||[];return orders}async function load(table,cols='*'){try{return await query(table,cols)}catch(e){message('Some records could not load: '+e.message);return []}}
const routes={overview:async()=>{const results=await Promise.allSettled([fetchOrders(),query('sgc_products','id,name,price_zar,active'),query('sgc_bookings','id,status'),query('courses','id')]);const counts=results.map(r=>r.status==='fulfilled'?r.value.length:'Unavailable');show('Overview','Live totals from connected Supabase tables',`<div class="cards">${metric('Tracked checkouts',counts[0])}${metric('Products',counts[1])}${metric('Bookings',counts[2])}${metric('Courses',counts[3])}</div>${card('<h2>SGC Studio</h2><p class="muted">Your existing admin and public website remain unchanged. Open a section to view connected records.</p>')}`);if(results.some(r=>r.status==='rejected'))message('Some data sources could not be loaded; check permissions and table availability.')},orders:async()=>{await fetchOrders();drawOrders()},payments:async()=>{await fetchOrders();drawOrders('Payments')},drafts:async()=>show('Draft orders','Manual order drafts require a secured order-writing API',card('<p>Draft orders are not yet enabled. Existing payment requests remain visible in All orders.</p>')),create:async()=>show('Create order','Payment creation must be backed by an audited server-side workflow',card('<p>Manual order creation is not enabled yet. This prevents creating misleading or unverified payment records.</p>'+link('../sgc-academy-extra/admin.html','Open existing Admin'))),
products:async()=>{products=await query('sgc_products','id,name,slug,description,price_zar,billing,active,created_at');drawProducts()},memberships:async()=>{memberships=await query('sgc_named_membership_plans','id,name,price_zar,billing,state,description');show('Memberships','Live membership plans',grid(['Name','Price','Billing','Status'],memberships.map(p=>[esc(p.name),money(p.price_zar),esc(p.billing),esc(p.state)]))+card(link('../sgc-academy-extra/admin.html','Manage in existing Admin')))},categories:async()=>{const data=await query('sgc_product_settings','product_id,category,product_type');const count={};data.forEach(x=>{if(x.category)count[x.category]=(count[x.category]||0)+1});show('Categories','Categories assigned to existing shop products',grid(['Category','Products'],Object.entries(count).map(([k,v])=>[esc(k),v])))},customers:async()=>{await fetchOrders();const map=new Map();orders.forEach(o=>{const k=o.user_id||o.customer_email||o.merchant_reference;if(!map.has(k))map.set(k,{name:o.customer_name,email:o.customer_email,orders:0,amount:0});const c=map.get(k);c.orders++;if(o.status==='paid')c.amount+=Number(o.amount_zar||0)});show('Customers','Customers from recorded Stitch checkouts; not a complete Academy user directory',grid(['Name','Email','Checkouts','Verified paid'],[...map.values()].map(c=>[esc(c.name||'Not supplied'),esc(c.email||'Not supplied'),c.orders,money(c.amount)])))},bookings:async()=>{bookings=await query('sgc_bookings','id,name,starts_at,ends_at,amount_zar,status,payment_status,meeting_url');show('Appointments','Live booking records; Google Calendar integration remains in existing Admin',grid(['Customer','Start','Amount','Booking','Payment','Meeting'],bookings.map(b=>[esc(b.name||'—'),date(b.starts_at),money(b.amount_zar),esc(b.status),esc(b.payment_status),b.meeting_url?`<a href="${esc(b.meeting_url)}" target="_blank" rel="noopener">Open ↗</a>`:'—']))+card(link('../sgc-academy-extra/admin.html','Manage bookings in Admin')))},academy:async()=>{const all=await Promise.allSettled([query('courses','id'),query('modules','id'),query('lessons','id')]);show('Academy','Live course structure',`<div class="cards">${metric('Courses',all[0].status==='fulfilled'?all[0].value.length:'Unavailable')}${metric('Modules',all[1].status==='fulfilled'?all[1].value.length:'Unavailable')}${metric('Lessons',all[2].status==='fulfilled'?all[2].value.length:'Unavailable')}</div>${card(link('../sgc-academy-extra/admin.html','Open existing Academy administration'))}`)},courses:async()=>{courses=await query('courses','*');show('Courses','Existing Academy courses',grid(['Course ID','Course details'],courses.map(x=>[esc(x.id),esc(x.title||x.name||x.description||'—')]))+card(link('../sgc-academy-extra/admin.html','Manage courses')))},modules:async()=>{modules=await query('modules','*');show('Modules','Existing Academy modules',grid(['Module','Course','Position'],modules.map(x=>[esc(x.title||x.name||x.id),esc(x.course_id||'—'),esc(x.position??x.sort_order??'—')]))+card(link('../sgc-academy-extra/admin.html','Edit modules')))},lessons:async()=>{lessons=await query('lessons','*');show('Lessons','Existing Academy lessons',grid(['Lesson','Module','Status'],lessons.map(x=>[esc(x.title||x.name||x.id),esc(x.module_id),esc(x.status||'—')]))+card(link('../sgc-academy-extra/admin.html','Edit lessons')))},pages:async()=>show('Online Store · Pages','Website page discovery from the supplied repository',card('<p>Existing website pages remain available on the public website. Only the Business Kits page currently has an integrated draft/publish renderer.</p>'+link('sgc-website-studio.html','Open connected Business Kits editor')+' '+link('../index.html','Homepage')+' '+link('../shop.html','Shop')+' '+link('../academy.html','Academy'))),website:async()=>show('Website Studio','Visual editor connected to the existing Business Kits draft/publish RPCs',card('<p>The Business Kits page supports section editing, draft saving and publishing. Other hardcoded pages are not yet safely editable through this system.</p>'+link('sgc-website-studio.html','Launch Website Studio'))),settings:async()=>show('Settings','Existing site integrations',card('<p>Supabase Authentication · Supabase database · Stitch checkout · Existing Academy · Existing booking integration</p>'+link('../sgc-academy-extra/admin.html','Existing Admin')))};
for(const [key,title] of Object.entries({collections:'Collections',variants:'Variants',purchasing:'Purchase orders',gifts:'Gift cards',navigation:'Navigation',theme:'Theme settings',students:'Students',resources:'Resources',calendar:'Calendar',services:'Services'})){routes[key]=async()=>show(title,'Integration not yet implemented',card(`<p>${esc(title)} management is not yet connected to a verified backend. No sample records or nonfunctional save buttons are shown.</p>${link('../sgc-academy-extra/admin.html','Open existing Admin')}`))}
function drawOrders(title='All orders'){show(title,'Live tracked Stitch payment requests; paid status requires verified confirmation',`<div class="toolbar"><input class="search" id="search" placeholder="Search orders, customers or email"><button class="btn" id="refresh">Refresh</button></div><div id="results"></div><div class="footnote">Only checkout requests tracked after the new Stitch integration appear here. Historical Stitch payments have not been imported.</div>`);const draw=()=>{const q=$('search').value.toLowerCase();const a=orders.filter(o=>[o.merchant_reference,o.customer_name,o.customer_email,o.product_name,o.status].some(x=>String(x||'').toLowerCase().includes(q)));$('results').innerHTML=grid(['Reference','Date','Customer','Email','Product','Amount','Status'],a.map(o=>[`<button class="btn" data-order="${esc(o.id)}">${esc(o.merchant_reference)}</button>`,date(o.created_at),esc(o.customer_name||'Not supplied'),esc(o.customer_email||'Not supplied'),esc(o.product_name),money(o.amount_zar),`<span class="tag ${esc(o.status)}">${esc(o.status)}</span>`]));document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{const o=orders.find(x=>x.id===b.dataset.order);if(o)show('Order '+o.merchant_reference,'Recorded checkout details',card(`<div class="detail"><b>Customer:</b> ${esc(o.customer_name||'Not supplied')}
<b>Email:</b> ${esc(o.customer_email||'Not supplied')}
<b>Product:</b> ${esc(o.product_name)}
<b>Amount:</b> ${money(o.amount_zar)}
<b>Status:</b> ${esc(o.status)}
<b>Reference:</b> ${esc(o.merchant_reference)}
<b>Created:</b> ${date(o.created_at)}
<b>Paid at:</b> ${date(o.paid_at)}</div>`)+card('<button class="btn" id="back-orders">← Back to orders</button>'));$('back-orders').onclick=()=>drawOrders()})};$('search').oninput=draw;$('refresh').onclick=()=>go('orders');draw()}
function drawProducts(){show('All products','Live product catalogue from sgc_products',`<div class="toolbar"><input class="search" id="search" placeholder="Search products"><button class="btn" id="refresh">Refresh</button>${link('../sgc-academy-extra/admin.html','Manage products in Admin ↗')}</div><div id="results"></div>`);const draw=()=>{const q=$('search').value.toLowerCase();$('results').innerHTML=grid(['Name','Slug','Price','Billing','Status'],products.filter(x=>[x.name,x.slug].some(y=>String(y||'').toLowerCase().includes(q))).map(x=>[esc(x.name),esc(x.slug),money(x.price_zar),esc(x.billing),`<span class="tag">${x.active?'Active':'Inactive'}</span>`]))};$('search').oninput=draw;$('refresh').onclick=()=>go('products');draw()}
async function go(v){section=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('heading').textContent='Loading…';$('content').innerHTML='';message('');try{await (routes[v]||routes.overview)()}catch(e){show(v,'Could not load this section',card(`<p>${esc(e.message)}</p><p class="muted">Check Supabase permissions and database configuration.</p>`))}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>go(b.dataset.view);for(const b of document.querySelectorAll('[data-toggle]'))b.onclick=()=>{$('group-'+b.dataset.toggle).hidden=!$('group-'+b.dataset.toggle).hidden};
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(!session){location.replace('../sgc-academy-extra/admin.html');return}const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user)throw Error('Please sign in through SGC Admin.');const {data,error}=await db.rpc('sgc_studio_is_admin');if(error||data!==true)throw Error('Admin authorization failed.');$('gate').hidden=true;$('app').hidden=false;go('overview')}catch(e){$('gate-message').textContent=e.message}})();
</script></body></html>
