emy','Live course structure',`<div class="cards">${metric('Courses',all[0].status==='fulfilled'?all[0].value.length:'Unavailable')}${metric('Modules',all[1].status==='fulfilled'?all[1].value.length:'Unavailable')}${metric('Lessons',all[2].status==='fulfilled'?all[2].value.length:'Unavailable')}</div>${card(link('../sgc-academy-extra/admin.html','Open existing Academy administration'))}`)},courses:async()=>{courses=await query('courses','*');show('Courses','Existing Academy courses',grid(['Course ID','Course details'],courses.map(x=>[esc(x.id),esc(x.title||x.name||x.description||'—')]))+card(link('../sgc-academy-extra/admin.html','Manage courses')))},modules:async()=>{modules=await query('modules','*');show('Modules','Existing Academy modules',grid(['Module','Course','Position'],modules.map(x=>[esc(x.title||x.name||x.id),esc(x.course_id||'—'),esc(x.position??x.sort_order??'—')]))+card(link('../sgc-academy-extra/admin.html','Edit modules')))},lessons:async()=>{lessons=await query('lessons','*');show('Lessons','Existing Academy lessons',grid(['Lesson','Module','Status'],lessons.map(x=>[esc(x.title||x.name||x.id),esc(x.module_id),esc(x.status||'—')]))+card(link('../sgc-academy-extra/admin.html','Edit lessons')))},pages:async()=>show('Online Store · Pages','Website page discovery from the supplied repository',card('<p>Existing website pages remain available on the public website. Only the Business Kits page currently has an integrated draft/publish renderer.</p>'+link('sgc-website-studio.html','Open connected Business Kits editor')+' '+link('../index.html','Homepage')+' '+link('../shop.html','Shop')+' '+link('../academy.html','Academy'))),website:async()=>show('Website Studio','Visual editor connected to the existing Business Kits draft/publish RPCs',card('<p>The Business Kits page supports section editing, draft saving and publishing. Other hardcoded pages are not yet safely editable through this system.</p>'+link('sgc-website-studio.html','Launch Website Studio'))),set         <section class="create-section"><div class="section-icon butter">◇</div><div class="section-body"><div class="section-heading"><div><h3>Payment method</h3><p>Choose how this customer will pay for the order.</p></div></div>
          <div class="method-choices" role="group" aria-label="Payment method">
            <button type="button" class="method-choice" data-method="online"><strong>◈ Online — Stitch</strong><small>Secure online checkout</small></button>

      </div>
      <aside class="order-summary"><h3>▤ &nbsp; Order summary</h3><div class="summary-item"><span class="summary-icon">▧</span><div><strong id="summary-product">No product selected</strong><small id="summary-product-type">Choose an existing or custom product</small></div></div><div class="summary-line"><span>Price</span><strong id="summary-price">R0,00</strong></div><div class="summary-line"><span>Discount</span><strong id="summary-discount">R0,00</strong></div><div class="summary-total"><span>Total</span><strong id="summary-total">R0,00</strong></div><div class="summary-line"><span>Payment method</span><strong id="summary-method">No payment</strong></div><div class="summary-customer"><h4>♙ &nbsp; Customer</h4><strong id="summary-customer-name">Not selected</strong><small id="summary-customer-email">Select or add a customer</small><small id="summary-customer-phone"></small></div><div class="summary-hint">Save as draft or mark the manual order fulfilled. Neither action collects payment or automatically grants access.</div></aside>
    </form>
  </div>`);
  const f=$('manual-form');let productKind='existing',customerKind='existing',paymentMethod='none';
  const methodLabels={online:'Online — Stitch',eft:'EFT / Bank transfer',none:'No payment'};
  const methodDescriptions={online:'<h4>Online — Stitch</h4><p>A secure Stitch checkout must be created by an admin-authorized server function for the selected customer and final discounted total. The current customer checkout function is not suitable for charging on behalf of a selected customer. Until that backend is connected, this screen saves a draft only.</p>',eft:'<h4>EFT / Bank transfer</h4><p>SGC banking details have not been configured yet. Do not send banking instructions until the verified account holder, bank, account number, branch code and payment reference have been added.</p>',none:'<h4>No payment</h4><p>This order will be saved as a draft. No charge is made and no payment is recorded as received.</p>'};
  const setMethod=m=>{paymentMethod=m;document.querySelectorAll('[data-method]').forEach(b=>{b.classList.toggle('selected',b.dataset.method===m);b.setAttribute('aria-pressed',String(b.dataset.method===m))});$('payment-method-detail').innerHTML=methodDescriptions[m];$('summary-method').textContent=methodLabels[m]};
  document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>setMethod(b.dataset.method));setMethod('none');
  const sync=()=>{const custom=productKind==='custom',fresh=customerKind==='new';$('existing-product').hidden=custom;$('custom-product').hidden=!custom;$('product-id').required=!custom;$('custom-name').required=custom;$('existing-customer').hidden=fresh;$('new-customer').hidden=!fresh;$('customer-id').required=!fresh; $('customer-name').required=fresh;document.querySelectorAll('[data-product-kind]').forEach(b=>b.classList.toggle('active',b.dataset.productKind===productKind));document.querySelectorAll('[data-customer-kind]').forEach(b=>b.classList.toggle('active',b.dataset.customerKind===customerKind));refresh()};
  const refresh=()=>{const item=catalogue.find(x=>x.id===$('product-id').value);const cust=existing.find(x=>x.id===$('customer-id').value);const amt=Number($('order-amount').value||0),discount=Number($('order-discount').value||0);$('order-total').textContent=money(Math.max(0,amt-discount));$('summary-total').textContent=money(Math.max(0,amt-discount));$('summary-price').textContent=money(amt);$('summary-discount').textContent='− '+money(discount);$('summary-product').textContent=productKind==='custom'?($('custom-name').value||'Custom product'):item?.name||'No product selected';$('summary-product-type').textContent=productKind==='custom'?'Custom product / service':'Existing SGC catalogue';$('product-preview').innerHTML=item?`<span class="preview-symbol">▧</span><div><strong>${esc(item.name)}</strong><small>Existing SGC product</small></div><div class="preview-price"><small>Price (R)</small><strong>${money(item.price_zar)}</strong></div>`:'<span class="preview-symbol">▧</span><div><strong>No product selected</strong><small>Product details will appear once selected.</small></div>';$('summary-customer-name').textContent=customerKind==='new'?($('customer-name').value||'New customer'):cust?.name||'Not selected';$('summary-customer-email').textContent=customerKind==='new'?($('customer-email').value||'Email not supplied'):cust?.email||'Select or add a customer';$('summary-customer-phone').textContent=customerKind==='new'?$('customer-phone').value:'';$('customer-preview').innerHTML=cust?`<span class="preview-symbol lilac">♙</span><div><strong>${esc(cust.name)}</strong><small>${esc(cust.email||'No email on file')}</small></div>`:'<span class="preview-symbol lilac">♙</span><div><strong>No customer selected</strong><small>Customer details will appear once selected.</small></div>'};
  document.querySelectorAll('[data-product-kind]').forEach(b=>b.onclick=()=>{productKind=b.dataset.productKind;$('product-kind').value=productKind;sync()});
  document.querySelectorAll('[data-customer-kind]').forEach(b=>b.onclick=()=>{customerKind=b.dataset.customerKind;sync()});
  $('product-kind').onchange=()=>{productKind=$('product-kind').value;sync()};
  $('product-id').onchange=()=>{const x=catalogue.find(x=>x.id===$('product-id').value);if(x)$('order-amount').value=Number(x.price_zar).toFixed(2);refresh()};
  ['order-amount','order-discount','custom-name','customer-id','customer-name','customer-email','customer-phone'].forEach(id=>$(id).addEventListener('input',refresh));$('customer-id').addEventListener('change',refresh);
  $('order-notes').oninput=()=>$('notes-count').textContent=$('order-notes').value.length;
  $('back-create').onclick=$('cancel-order').onclick=()=>go('orders');sync();
  async function saveManualOrder(action){
    const draftBtn=$('save-order'), fulfillBtn=$('fulfill-order');
    if(action==='fulfilled' && !confirm('Mark this order as fulfilled? This records manual fulfillment only. It does not confirm payment, charge the customer, or grant access.'))return;
    draftBtn.disabled=true;fulfillBtn.disabled=true;
    message(action==='fulfilled'?'Saving fulfilled order…':'Saving draft order…');
    try{
      const amount=Number($('order-amount').value),discount=Number($('order-discount').value||0);
      if(!Number.isFinite(amount)||amount<0||!Number.isFinite(discount)||discount<0||discount>amount)throw Error('Check the amount and discount.');
      const payload={product_id:productKind==='existing'?$('product-id').value:null,custom_product:productKind==='custom'?$('custom-name').value.trim():null,amount_zar:amount,discount_zar:discount,notes:`[Requested payment method: ${methodLabels[paymentMethod]}]\n${$('order-notes').value.trim()}`.trim(),customer_id:customerKind==='existing'?$('customer-id').value:null,customer_name:customerKind==='new'?$('customer-name').value.trim():null,customer_email:customerKind==='new'?$('customer-email').value.trim():null,customer_phone:customerKind==='new'?$('customer-phone').value.trim():null};
      const {data,error}=await db.rpc('sgc_studio_save_manual_order',{p_order:payload,p_action:action});
      if(error)throw error;
      await go('orders');
      message(`Manual order ${data} saved as ${action}. Payment has not been verified or collected.`);
    }catch(err){message('Could not save: '+err.message);draftBtn.disabled=false;fulfillBtn.disabled=false;}
  }
  f.onsubmit=e=>{e.preventDefault();saveManualOrder('draft')};
  $('fulfill-order').onclick=()=>{if(f.reportValidity())saveManualOrder('fulfilled')};
}

async function productMeta(){const [settings,images]=await Promise.all([load('sgc_product_settings','product_id,category,product_type,colour,delivery'),load('sgc_studio_product_media','product_id,image_url')]);return {settings:new Map(settings.map(x=>[x.product_id,x])),images:new Map(images.map(x=>[x.product_id,x.image_url]))}}
async function drawProducts(onlyKits=false){
 const meta=await productMeta();
 const filtered=products.filter(p=>{const x=meta.settings.get(p.id)||{};const kit=(x.category||'').toLowerCase()==='business kits'||(x.product_type||'').toLowerCase()==='kit'||/business kit/i.test(p.name||'');const member=(x.product_type||'').toLowerCase()==='membership'||/membership/i.test(p.name||'');return onlyKits?kit:!member});
 show(onlyKits?'Business Kits':'All products',onlyKits?'Business Kit products — also included in All Products':'Product catalogue — memberships are managed separately',`<div class="toolbar"><input class="search" id="search" placeholder="Search products"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="add-product">+ Add product</button></div><div id="results"></div>`);
 const draw=()=>{const q=$('search').value.toLowerCase();$('results').innerHTML=grid(['Image / card','Product','Category','Price','Status','Actions'],filtered.filter(p=>[p.name,p.slug].some(v=>String(v||'').toLowerCase().includes(q))).map(p=>{const x=meta.settings.get(p.id)||{};const url=meta.images.get(p.id);const bg=({'Butter yellow':'#f8edc7','Pastel pink':'#f7e4e7','Lavender':'#e9dff5','Cream':'#fff7e9'})[x.colour]||'#f8edc7';const preview=url?`<img src="${esc(url)}" alt="" style="width:76px;height:60px;object-fit:cover;border-radius:9px">`:`<div style="width:76px;height:60px;border-radius:9px;background:${bg};display:grid;place-items:center;font-size:11px;font-weight:bold;text-align:center;padding:4px">SGC</div>`;return [preview,esc(p.name),esc(x.category||'Uncategorised'),money(p.price_zar),p.active?'Published':'Draft',`<button class="btn edit-product" data-id="${esc(p.id)}">Edit</button> <button class="btn delete-product" data-id="${esc(p.id)}">Delete</button>`]}));document.querySelectorAll('.edit-product').forEach(b=>b.onclick=()=>openAddProduct(b.dataset.id));document.querySelectorAll('.delete-product').forEach(b=>b.onclick=async()=>{const item=products.find(x=>x.id===b.dataset.id);if(!confirm('Delete '+item.name+'? This may affect previous orders.'))return;const {error}=await db.rpc('sgc_studio_delete_product',{p_id:b.dataset.id});if(error)return message('Delete failed: '+error.message);go(onlyKits?'businesskits':'products');message('Product deleted.')})};
 $('search').oninput=draw;$('refresh').onclick=()=>go(onlyKits?'businesskits':'products');$('add-product').onclick=()=>go('addproduct');draw()
}
