async function query(table,columns='*'){const {data,error}=await db.from(table).select(columns).limit(500);if(error)throw Error(`${table}: ${error.message}`);return data||[]}async function fetchOrders(){const [stitch,manual]=await Promise.all([db.rpc('sgc_studio_get_orders'),db.rpc('sgc_studio_manual_orders')]);if(stitch.error)throw stitch.error;if(manual.error)throw manual.error;manualOrders=manual.data||[];orders=[...(stitch.data||[]),...manualOrders.map(o=>({...o,merchant_reference:o.order_number,customer_name:o.customer_name,customer_email:o.customer_email,product_name:o.product_name,amount_zar:o.total_zar,status:o.status==='fulfilled'?'fulfilled':'draft',source:'manual',created_at:o.created_at}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return orders}async function load(table,cols='*'){try{return await query(table,cols)}catch(e){message('Some records could not load: '+e.message);return []}}

sgc_extra_resources:{title:'Existing Admin Resources',fields:[['lesson_id','Existing Admin lesson','extra_lesson'],['title','Resource name','text'],['kind','Type','extra_type'],['path','URL or uploaded file','url']],required:['lesson_id','title','kind','path']}
};
let academyCache={},academyArchived=new Set(),academyActiveView='courses',academyActiveTable='courses';
async function academyFetch(table){const {data,error}=await db.from(table).select('*').limit(500);if(error)throw error;return data||[]}
async function academyManager(view='courses',table=(view==='modules'?'sgc_console_modules':view==='lessons'?'sgc_extra_lessons':view)){academyActiveView=view;academyActiveTable=table;const main=view==='resources'?'academy_resources':view==='modules'?'sgc_console_modules':view==='lessons'?'sgc_extra_lessons':table;const extras=view==='modules'?'modules':view==='lessons'?'lessons':view==='resources'?'sgc_extra_resources':null;
const tables=[main,'courses','modules','lessons','academy_resources','sgc_console_modules','sgc_extra_lessons','sgc_extra_resources'];const unique=[...new Set(tables)];
const results=await Promise.allSettled(unique.map(async t=>[t,await academyFetch(t)]));academyCache={};for(const result of results)if(result.status==='fulfilled')academyCache[result.value[0]]=result.value[1];
const {data:archiveRows,error:archiveError}=await db.from('sgc_studio_academy_archives').select('entity,record_id');if(archiveError)throw archiveError;academyArchived=new Set((archiveRows||[]).map(x=>x.entity+':'+x.record_id));
const tabs=extras?'<button class="btn" data-academy-table="'+main+'">'+esc(academyDefs[main].title)+'</button><button class="btn" data-academy-table="'+extras+'">'+esc(academyDefs[extras].title)+'</button>':'';
show(view==='resources'?'Resources':view[0].toUpperCase()+view.slice(1),'Manage your existing Academy content. Archived items are hidden from the active list.',card('<div class="toolbar">'+tabs+'<button class="btn" id="academy-add">+ Add '+esc(academyDefs[table].title.replace('Existing Admin ',''))+'</button><button class="btn" id="academy-reload">Refresh</button></div><div id="academy-list"></div><div id="academy-form"></div><p class="muted">Changes save to Supabase. Published course content appears wherever the student Academy already reads these tables; archived items are managed separately and may still appear on older student pages until their queries are updated.</p>'));
$('academy-add').onclick=()=>{if(table==='sgc_extra_lessons')location.href='academy-lesson-editor.html';else academyForm(table)};$('academy-reload').onclick=()=>academyManager(view,table);document.querySelectorAll('[data-academy-table]').forEach(b=>b.onclick=()=>academyManager(view,b.dataset.academyTable));academyList(table)}
function academyList(table){const rows=academyCache[table]||[];const active=rows.filter(x=>!academyArchived.has(table+':'+x.id)),archived=rows.filter(x=>academyArchived.has(table+':'+x.id));
const display=x=>(table==='courses'&&x.cover_image_url?'<img src="'+esc(x.cover_image_url)+'" alt="Course cover" style="width:88px;height:64px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:12px">':'')+esc(x.title||x.name||x.id)+' <span class="muted">'+esc(x.status||'')+'</span>';
const draw=(items,arch)=>items.map(x=>'<div class="item" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;margin:7px 0;background:#fffafc;border:1px solid #e7d9e9;border-radius:12px"><span style="flex:1;min-width:160px">'+display(x)+'</span><button class="btn" data-ac-edit="'+esc(x.id)+'">Edit</button><button class="btn" data-ac-archive="'+esc(x.id)+'">'+(arch?'Restore':'Archive')+'</button><button class="btn" data-ac-delete="'+esc(x.id)+'">Delete</button></div>').join('');
$('academy-list').innerHTML='<h3>Active ('+active.length+')</h3>'+(draw(active,false)||'<p class="muted">No active records.</p>')+'<details><summary>Archived ('+archived.length+')</summary>'+draw(archived,true)+'</details>';
document.querySelectorAll('[data-ac-edit]').forEach(b=>b.onclick=()=>{const rec=rows.find(x=>x.id===b.dataset.acEdit);if(table==='sgc_extra_lessons')location.href='academy-lesson-editor.html?id='+encodeURIComponent(rec.id);else academyForm(table,rec)});
document.querySelectorAll('[data-ac-archive]').forEach(b=>b.onclick=()=>academyArchive(table,b.dataset.acArchive));
document.querySelectorAll('[data-ac-delete]').forEach(b=>b.onclick=()=>academyDelete(table,b.dataset.acDelete))}
function academyOptions(kind){let list=kind==='course'?academyCache.courses:kind==='module'?academyCache.modules:kind==='lesson'?academyCache.lessons:kind==='extra_lesson'?academyCache.sgc_extra_lessons:[];return (list||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title||x.id)+'</option>').join('')}
function academyInput(f,v){const [key,label,type]=f;const value=v?.[key];const id='ac-'+key;let control='';
if(type==='textarea')control='<textarea id="'+id+'" rows="5">'+esc(value??'')+'</textarea>';
else if(['course','module','lesson','extra_lesson'].includes(type))control='<select id="'+id+'"><option value="">Select…</option>'+academyOptions(type)+'</select>';
else if(type==='unlock_mode')control='<select id="'+id+'"><option value="manual">Manual release</option><option value="fixed">Fixed date & time</option><option value="schedule">After student enrolment</option></select>';else if(type==='image_upload')control='<input type="file" id="'+id+'" accept="image/png,image/jpeg,image/webp"><small>Upload a cover image; '+(value?'Current image saved':'No image yet')+'</small>'+(value?'<img src="'+esc(value)+'" alt="Course cover" style="max-width:230px;border-radius:12px;margin-top:8px">':'');else if(type==='status')control='<select id="'+id+'"><option value="draft">Draft</option><option value="published">Published</option></select>';
else if(type==='resource_type')control='<select id="'+id+'">'+['pdf','video','image','link','document','product','audio','other'].map(x=>'<option value="'+x+'">'+x+'</option>').join('')+'</select>';

async function courseAccessPanel(course){
const box=document.createElement('div');box.className='card';box.style.marginTop='16px';box.innerHTML='<h3>Student access & course modules</h3><p class="muted">Link existing modules to this course. Once linked, the Academy applies the unlock mode to those modules.</p><label class="field">Module<select id="course-module"><option value="">Select module</option></select></label><button class="btn" id="course-module-add">+ Link module</button><div id="course-module-list"></div><h3>Enrol student / manually release course</h3><label class="field">Student user ID (UUID)<input id="course-student-id" placeholder="Student Supabase user ID"></label><button class="btn" id="course-enrol">Enrol student</button> <button class="btn" id="course-release">Manually unlock</button><p class="muted" id="course-access-status"></p>';

async function refresh(){const {data,error}=await db.from('sgc_studio_course_modules').select('module_no').eq('course_id',course.id);if(error)throw error;$('course-module-list').innerHTML=(data||[]).map(m=>'<div class="item">Module '+esc(m.module_no)+' <button class="btn" data-unlink="'+esc(m.module_no)+'">Unlink</button></div>').join('');document.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('sgc_studio_course_modules').delete().eq('course_id',course.id).eq('module_no',Number(b.dataset.unlink));if(error)alert(error.message);else refresh()})}

function academyForm(table,record=null){const def=academyDefs[table];$('academy-form').innerHTML=card('<h2>'+(record?'Edit ':'Add ')+esc(def.title)+'</h2><form id="academy-editor">'+def.fields.map(f=>academyInput(f,record)).join('')+(table==='academy_resources'||table==='sgc_extra_resources'?'<label class="field">Upload file (image, PDF, video, document)<input type="file" id="ac-upload" accept="image/*,video/*,audio/*,.pdf,.docx,.zip,.txt"></label>':'')+'<div class="toolbar"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="ac-cancel">Cancel</button></div><p id="ac-feedback" class="muted"></p></form>');
for(const [key,,type] of def.fields)if(['course','module','lesson','extra_lesson','status','resource_type','extra_type','unlock_mode','datetime-local'].includes(type)&&record?.[key]!=null)$('ac-'+key).value=type==='datetime-local'?String(record[key]).slice(0,16):String(record[key]);
$('ac-cancel').onclick=()=>{$('academy-form').innerHTML=''};$('academy-editor').onsubmit=e=>{e.preventDefault();academySave(table,record)};
$('academy-form').scrollIntoView({behavior:'smooth',block:'nearest'});if(table==='courses'&&record)courseAccessPanel(record).catch(e=>message(e.message))}
async function academySave(table,record){const def=academyDefs[table],payload={};const msg=$('ac-feedback');try{msg.textContent='Saving…';
for(const [key,label,type] of def.fields){const el=$('ac-'+key);let val=type==='checkbox'?el.checked:el.value.trim();if(type==='image_upload'){if(el.files[0]){const file=el.files[0];if(file.size>10*1024*1024)throw Error('Course image must be under 10 MB');const filename='course-covers/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {data,error}=await db.storage.from('sgc-studio-academy').upload(filename,file);if(error)throw error;val=db.storage.from('sgc-studio-academy').getPublicUrl(data.path).data.publicUrl}else val=record?.[key]||null;payload[key]=val;continue}if(type==='number')val=val===''?null:Number(val);if(type==='datetime-local'&&val)val=new Date(val).toISOString();if(type!=='checkbox'&&type!=='number'&&val==='')val=null;if(def.required.includes(key)&&(val===null||val===''))throw Error(label+' is required');payload[key]=val}
if((table==='academy_resources'||table==='sgc_extra_resources')&&$('ac-upload')?.files?.[0]){const file=$('ac-upload').files[0];if(file.size>50*1024*1024)throw Error('Maximum file size is 50 MB');const filename=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {data,error}=await db.storage.from('sgc-studio-academy').upload(filename,file,{upsert:false});if(error)throw error;const url=db.storage.from('sgc-studio-academy').getPublicUrl(data.path).data.publicUrl;payload[table==='academy_resources'?'file_url':'path']=url}
const {error}=record?await db.from(table).update(payload).eq('id',record.id):await db.from(table).insert(payload);if(error)throw error;await academyManager(academyActiveView,table);message('Academy content saved successfully.')}catch(e){msg.textContent='Save failed: '+e.message}}

  const f=$('manual-form');let productKind='existing',customerKind='existing',paymentMethod='none';

  const setMethod=m=>{paymentMethod=m;document.querySelectorAll('[data-method]').forEach(b=>{b.classList.toggle('selected',b.dataset.method===m);b.setAttribute('aria-pressed',String(b.dataset.method===m))});$('payment-method-detail').innerHTML=methodDescriptions[m];$('summary-method').textContent=methodLabels[m]};

  const sync=()=>{const custom=productKind==='custom',fresh=customerKind==='new';$('existing-product').hidden=custom;$('custom-product').hidden=!custom;$('product-id').required=!custom;$('custom-name').required=custom;$('existing-customer').hidden=fresh;$('new-customer').hidden=!fresh;$('customer-id').required=!fresh; $('customer-name').required=fresh;document.querySelectorAll('[data-product-kind]').forEach(b=>b.classList.toggle('active',b.dataset.productKind===productKind));document.querySelectorAll('[data-customer-kind]').forEach(b=>b.classList.toggle('active',b.dataset.customerKind===customerKind));refresh()};
  const refresh=()=>{const item=catalogue.find(x=>x.id===$('product-id').value);const cust=existing.find(x=>x.id===$('customer-id').value);const amt=Number($('order-amount').value||0),discount=Number($('order-discount').value||0);$('order-total').textContent=money(Math.max(0,amt-discount));$('summary-total').textContent=money(Math.max(0,amt-discount));$('summary-price').textContent=money(amt);$('summary-discount').textContent='− '+money(discount);$('summary-product').textContent=productKind==='custom'?($('custom-name').value||'Custom product'):item?.name||'No product selected';$('summary-product-type').textContent=productKind==='custom'?'Custom product / service':'Existing SGC catalogue';$('product-preview').innerHTML=item?`<span class="preview-symbol">▧</span><div><strong>${esc(item.name)}</strong><small>Existing SGC product</small></div><div class="preview-price"><small>Price (R)</small><strong>${money(item.price_zar)}</strong></div>`:'<span class="preview-symbol">▧</span><div><strong>No product selected</strong><small>Product details will appear once selected.</small></div>';$('summary-customer-name').textContent=customerKind==='new'?($('customer-name').value||'New customer'):cust?.name||'Not selected';$('summary-customer-email').textContent=customerKind==='new'?($('customer-email').value||'Email not supplied'):cust?.email||'Select or add a customer';$('summary-customer-phone').textContent=customerKind==='new'?$('customer-phone').value:'';$('customer-preview').innerHTML=cust?`<span class="preview-symbol lilac">♙</span><div><strong>${esc(cust.name)}</strong><small>${esc(cust.email||'No email on file')}</small></div>`:'<span class="preview-symbol lilac">♙</span><div><strong>No customer selected</strong><small>Customer details will appear once selected.</small></div>'};

  async function saveManualOrder(action){
    const draftBtn=$('save-order'), fulfillBtn=$('fulfill-order');
    if(action==='fulfilled' && !confirm('Mark this order as fulfilled? This records manual fulfillment only. It does not confirm payment, charge the customer, or grant access.'))return;
    draftBtn.disabled=true;fulfillBtn.disabled=true;
    message(action==='fulfilled'?'Saving fulfilled order…':'Saving draft order…');
    try{
      const amount=Number($('order-amount').value),discount=Number($('order-discount').value||0);
      if(!Number.isFinite(amount)||amount<0||!Number.isFinite(discount)||discount<0||discount>amount)throw Error('Check the amount and discount.');
      const payload={product_id:productKind==='existing'?$('product-id').value:null,custom_product:productKind==='custom'?$('custom-name').value.trim():null,amount_zar:amount,discount_zar:discount,notes:`[Requested payment method: ${methodLabels[paymentMethod]}]\n${$('order-notes').value.trim()}`.trim(),customer_id:customerKind==='existing'?$('customer-id').value:null,customer_name:customerKind==='new'?$('customer-name').value.trim():null,customer_email:customerKind==='new'?$('customer-email').value.trim():null,customer_phone:customerKind==='new'?$('customer-phone').value.trim():null};
      const {data,error}=await db.rpc('sgc_studio_save_manual_order',{p_order:payload,p_action:action});
      if(error)throw error;
      await go('orders');
      message(`Manual order ${data} saved as ${action}. Payment has not been verified or collected.`);
    }catch(err){message('Could not save: '+err.message);draftBtn.disabled=false;fulfillBtn.disabled=false;}
  }
  f.onsubmit=e=>{e.preventDefault();saveManualOrder('draft')};
  $('fulfill-order').onclick=()=>{if(f.reportValidity())saveManualOrder('fulfilled')};
}

async function editKitVariant(productId,v=null){
 show(v?'Edit Business Kit variant':'Add Business Kit variant','Each niche can have its own price, publishing status and private files',`<div class="product-panel" style="max-width:650px"><label class="product-label">Variant name<input id="kit-name" maxlength="120" placeholder="Beauty, Fashion, Finance…" required value="${esc(v?.name||'')}"></label><label class="product-label">Price (R)<input id="kit-price" type="number" min="0" step="0.01" value="${esc(v?.price_zar??499)}"></label><label class="product-label">Variant resources (optional)<input id="kit-variant-files" type="file" multiple accept=".pdf,.ppt,.pptx,.doc,.docx,.zip,.mp4,.webm,.png,.jpg,.jpeg"></label><div class="toolbar"><button class="btn" id="kit-back">Cancel</button><button class="btn" id="kit-draft">Save Draft</button><button class="btn primary" id="kit-publish">Save & Publish</button></div><p class="muted">A published variant is visible only while its parent kit is published. Payment and secure delivery must be linked before selling variants.</p></div>`);

async function openDiscounts(){
 const {data,error}=await db.from('sgc_discounts').select('*').order('created_at',{ascending:false});
 if(error){show('Discounts','Manage discounts and promotions',card('<p>Discounts backend is not ready: '+esc(error.message)+'</p><p>Run the accompanying Supabase SQL first.</p>'));return}
 const rows=data||[];
 show('Discounts','Create and manage your SGC promotions',`<div class="toolbar"><button class="btn primary" id="discount-new">+ Create discount</button><button class="btn" id="discount-refresh">Refresh</button></div><div id="discount-list"></div><p class="footnote">Discounts are stored in Supabase. They are not applied at Stitch checkout until the server-side discount validation and payment total calculation are connected. Free shipping is for physical products only.</p>`);
 $('discount-refresh').onclick=()=>openDiscounts();$('discount-new').onclick=()=>editDiscount();
 $('discount-list').innerHTML=grid(['Code','Type','Value','Applies to','Status','Dates','Actions'],rows.map(d=>[esc(d.code),esc(({product_amount:'Amount off products',buy_x_get_y:'Buy X Get Y',order_amount:'Amount off order',free_shipping:'Free shipping'})[d.discount_type]||d.discount_type),d.discount_type==='free_shipping'?'Free shipping':d.discount_type==='buy_x_get_y'?`${esc(d.buy_quantity)} + ${esc(d.get_quantity)}`:d.value_type==='percent'?`${esc(d.value)}%`:money(d.value),esc(d.product_id||'All eligible products'),`<span class="tag">${d.active?'Active':'Inactive'}</span>`,esc(d.starts_at?date(d.starts_at):'Now')+' – '+esc(d.ends_at?date(d.ends_at):'No expiry'),`<button class="btn" data-discount-edit="${esc(d.id)}">Edit</button> <button class="btn" data-discount-delete="${esc(d.id)}">Delete</button>`]));
 document.querySelectorAll('[data-discount-edit]').forEach(b=>b.onclick=()=>editDiscount(rows.find(x=>x.id===b.dataset.discountEdit)));
 document.querySelectorAll('[data-discount-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this discount permanently?'))return;const {error}=await db.from('sgc_discounts').delete().eq('id',b.dataset.discountDelete);if(error)message(error.message);else await openDiscounts()});
}
async function editDiscount(d=null){
 const productsList=await load('sgc_products','id,name,active');
 show(d?'Edit discount':'Create discount','Set up a discount for SGC Network',`<div class="product-panel" style="max-width:790px"><form id="discount-form"><div class="product-fields"><label class="product-label">Discount type<select id="disc-type"><option value="product_amount">Amount off products</option><option value="buy_x_get_y">Buy X Get Y</option><option value="order_amount">Amount off order</option><option value="free_shipping">Free shipping</option></select></label><label class="product-label">Discount code<input id="disc-code" required maxlength="60" placeholder="e.g. SGC10" autocomplete="off"></label><label class="product-label">Value type<select id="disc-value-type"><option value="percent">Percentage (%)</option><option value="fixed">Fixed amount (R)</option></select></label><label class="product-label">Value<input id="disc-value" type="number" min="0" step="0.01" value="10" required></label><label class="product-label">Applies to product (optional)<select id="disc-product"><option value="">All eligible products</option>${productsList.filter(x=>!(/membership/i.test(x.name||''))).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label><label class="product-label">Minimum order value (R)<input id="disc-minimum" type="number" min="0" step="0.01" value="0"></label><label class="product-label">Buy quantity<input id="disc-buy" type="number" min="1" step="1" value="1"></label><label class="product-label">Get quantity<input id="disc-get" type="number" min="1" step="1" value="1"></label><label class="product-label">Start date (optional)<input id="disc-start" type="datetime-local"></label><label class="product-label">End date (optional)<input id="disc-end" type="datetime-local"></label></div><label class="product-label"><span><input id="disc-active" type="checkbox" checked> Active</span></label><div class="toolbar"><button type="button" class="btn" id="disc-cancel">Cancel</button><button class="btn primary" type="submit">${d?'Save changes':'Create discount'}</button></div></form><p class="footnote">Discount codes are not yet wired to checkout; creating a discount will not change payment amounts until server-side validation is implemented.</p></div>`);
 const put=(id,v)=>{if(v!==null&&v!==undefined)$(id).value=v};
 if(d){for(const [id,v] of Object.entries({'disc-type':d.discount_type,'disc-code':d.code,'disc-value-type':d.value_type,'disc-value':d.value,'disc-product':d.product_id||'','disc-minimum':d.min_order_zar,'disc-buy':d.buy_quantity,'disc-get':d.get_quantity}))put(id,v);$('disc-active').checked=d.active;if(d.starts_at)put('disc-start',new Date(d.starts_at).toISOString().slice(0,16));if(d.ends_at)put('disc-end',new Date(d.ends_at).toISOString().slice(0,16));}
 const adjust=()=>{const t=$('disc-type').value;const shipping=t==='free_shipping',bx=t==='buy_x_get_y';$('disc-value').disabled=shipping||bx;$('disc-value-type').disabled=shipping||bx;$('disc-buy').disabled=!bx;$('disc-get').disabled=!bx;$('disc-product').disabled=t==='order_amount'||shipping;};$('disc-type').onchange=adjust;adjust();
 $('disc-cancel').onclick=()=>go('discounts');
 $('discount-form').onsubmit=async e=>{e.preventDefault();const type=$('disc-type').value;const start=$('disc-start').value,end=$('disc-end').value;if(start&&end&&new Date(end)<=new Date(start))return message('End date must be after start date.');const v=Number($('disc-value').value);if(type!=='free_shipping'&&type!=='buy_x_get_y'&&(!Number.isFinite(v)||v<=0||($('disc-value-type').value==='percent'&&v>100)))return message('Enter a valid discount value (percentage maximum 100).');const payload={discount_type:type,code:$('disc-code').value.trim().toUpperCase(),value_type:$('disc-value-type').value,value:type==='free_shipping'||type==='buy_x_get_y'?0:v,product_id:['order_amount','free_shipping'].includes(type)?null:($('disc-product').value||null),min_order_zar:Number($('disc-minimum').value||0),buy_quantity:Number($('disc-buy').value),get_quantity:Number($('disc-get').value),active:$('disc-active').checked,starts_at:start?new Date(start).toISOString():null,ends_at:end?new Date(end).toISOString():null};const result=d?await db.from('sgc_discounts').update(payload).eq('id',d.id):await db.from('sgc_discounts').insert(payload);if(result.error)return message('Could not save discount: '+result.error.message);await go('discounts');message('Discount saved in Supabase. Checkout integration is still required.')};
}

async function go(v){section=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('heading').textContent='Loading…';$('content').innerHTML='';message('');try{await (routes[v]||routes.overview)()}catch(e){show(v,'Could not load this section',card(`<p>${esc(e.message)}</p><p class="muted">Check Supabase permissions and database configuration.</p>`))}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>go(b.dataset.view);for(const group of document.querySelectorAll('.subgroup'))group.hidden=true;for(const b of document.querySelectorAll('[data-toggle]'))b.onclick=()=>{const group=$('group-'+b.dataset.toggle);group.hidden=!group.hidden;b.setAttribute('aria-expanded',String(!group.hidden))};
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(!session){location.replace('/sgc-academy-extra/admin.html');return}const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user)throw Error('Please sign in through SGC Admin.');const {data,error}=await db.rpc('sgc_studio_is_admin');if(error||data!==true)throw Error('Admin authorization failed.');$('gate').hidden=true;$('app').hidden=false;go('overview')}catch(e){$('gate-message').textContent=e.message}})();
</script></body></html>
