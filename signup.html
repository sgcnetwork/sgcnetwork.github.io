<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join SGC | SGC Network</title><style>body{margin:0;background:#faf7f2;color:#29242c;font:14px Arial,sans-serif}.auth-wrap{max-width:500px;margin:55px auto;padding:0 22px}.auth-brand{font:30px Georgia,serif;text-decoration:none;color:inherit;letter-spacing:3px}.auth-brand small{display:block;font:9px Arial,sans-serif;letter-spacing:4px;margin-top:5px}.auth-card{background:#fffdf9;border:1px solid #e4dde2;border-radius:12px;padding:36px;margin-top:30px}.eyebrow{font-size:10px;letter-spacing:2px;color:#796778}h1{font:46px/1.05 Georgia,serif;margin:18px 0}p{line-height:1.7;color:#746a74}label{display:block;margin-top:18px;font-size:12px}input{box-sizing:border-box;width:100%;padding:14px;margin-top:7px;border:1px solid #d8cdd7;border-radius:5px;background:white;font:inherit}button{padding:14px 20px;border:0;border-radius:5px;background:#322936;color:white;font:inherit;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}a{color:#71566d}.text-button{background:none;color:#71566d;padding:0;font-size:12px}small{color:#817581;line-height:1.6}.status{font-size:13px}[hidden]{display:none!important}@media(max-width:600px){.auth-card{padding:25px}h1{font-size:38px}}</style></head><body><main class="auth-wrap"><a class="auth-brand" href="index.html">SGC<small>NETWORK</small></a><section class="auth-card"><div class="eyebrow">JOIN SGC</div><h1>Your next chapter.</h1><form id="join-form"><label for="full-name">Full name</label><input id="full-name" autocomplete="name" minlength="3" maxlength="150" required><small>Your full name becomes your username. If it is already used, we’ll add a unique suffix.</small><label for="email">Email address</label><input type="email" id="email" autocomplete="email" required><label for="phone">Phone number <small>(optional)</small></label><input type="tel" id="phone" autocomplete="tel" placeholder="+27…"><label for="password">Password</label><input type="password" id="password" autocomplete="new-password" minlength="8" required><small>Use at least 8 characters.</small><button id="join-button" type="submit">Create account</button></form><p id="status" class="status" role="status" aria-live="polite"></p><p>Already a member? <a href="login.html">Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
const $=id=>document.getElementById(id),sb=window.sgcSupabase;
$('join-form').onsubmit=async e=>{
 e.preventDefault();$('join-button').disabled=true;$('status').textContent='Creating your account…';
 try{
  if(!sb)throw Error('Account connection unavailable. Refresh to retry.');
  const full_name=$('full-name').value.trim().replace(/\s+/g,' ');
  const phone=$('phone').value.trim();
  if(phone&&!/^[+\d ()-]{7,25}$/.test(phone))throw Error('Enter a valid phone number, or leave it blank.');
  const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name,phone},emailRedirectTo:'https://sgcnetwork.co.za/dashboard.html'}});
  if(r.error)throw r.error;
  $('status').textContent='Check your email to confirm your account, then log in with your email. Your full-name username will appear in My SGC.';
  $('join-form').reset();
 }catch(error){$('status').textContent=error.message;}finally{$('join-button').disabled=false;}
};</script></body></html>
