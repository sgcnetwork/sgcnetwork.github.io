<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | SGC Network</title><link rel="stylesheet" href="css/style.css"></head><body><main class="hero"><div class="container" style="max-width:520px"><a class="logo" href="index.html">SGC<small>NETWORK</small></a><div class="card" style="margin-top:40px"><div class="eyebrow">JOIN SGC</div><h1 style="font:700 52px/.95 Georgia,serif">Create your account.</h1><form id="signupForm"><input id="name" placeholder="Full name" required style="width:100%;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:12px"><input id="email" type="email" placeholder="Email address" required style="width:100%;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:12px"><input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" required style="width:100%;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:12px"><button class="btn dark" style="border:0;margin-top:10px" type="submit">Create account</button></form><p id="msg"></p><p>Already have an account? <a href="login.html">Log in</a></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script>signupForm.onsubmit=async e=>{e.preventDefault();if(!window.sgcSupabase){msg.textContent='Connect your Supabase project in js/config.js first.';return}const r=await sgcAuth.signUp(email.value,password.value,name.value);msg.textContent=r.error?r.error.message:'Account created. Check your email if confirmation is enabled, then log in.';}</script></body></html>
