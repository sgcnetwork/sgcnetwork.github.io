<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member login | SGC Network</title><style>
:root{--ink:#302731;--muted:#857681;--line:#e8dfe3;--paper:#fffdfa;--gold:#ad8c58}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 15%,#f2dfe4 0,transparent 45%),radial-gradient(ellipse at 95% 80%,#e8e0f2 0,transparent 42%),#faf6ee;color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}
.auth-wrap{width:min(100%,550px);margin:0 auto;padding:42px 24px 52px}
.auth-brand{display:block;width:max-content;margin:0 auto;text-align:center;font:35px/.9 Georgia,serif;text-decoration:none;color:var(--ink);letter-spacing:5px}
.auth-brand small{display:block;font:8px Arial,sans-serif;letter-spacing:5px;margin:10px 0 0 4px;color:var(--muted)}
.auth-card{position:relative;background:var(--paper);border:1px solid rgba(173,140,88,.22);border-radius:25px;padding:38px 42px 28px;margin-top:28px;box-shadow:0 20px 65px rgba(74,49,61,.075);overflow:hidden}
.auth-card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ecced7,#e8daa6,#d9cdec)}
.eyebrow{text-align:center;font-size:9px;font-weight:600;letter-spacing:3px;color:var(--gold);margin:3px 0 14px}
h1{text-align:center;font:42px/1.12 Georgia,"Times New Roman",serif;letter-spacing:-1.6px;margin:0 0 11px}
.intro{text-align:center;font-size:12px;color:var(--muted);margin:0 0 25px;line-height:1.7}
p{line-height:1.7;color:var(--muted)}
label{display:block;margin-top:17px;font-size:11px;font-weight:600;letter-spacing:.25px}
input{display:block;width:100%;height:49px;padding:12px 15px;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:14px Arial,sans-serif;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:#b69b79;box-shadow:0 0 0 3px rgba(173,140,88,.12)}
input::placeholder{color:#b0a3ae}
button{width:100%;padding:15px 20px;border:1px solid #40323f;border-radius:10px;background:#342934;color:#fffaf2;font:600 12px Arial,sans-serif;letter-spacing:.5px;cursor:pointer;margin-top:25px;box-shadow:0 6px 16px rgba(48,39,49,.1);transition:background .2s,transform .2s}
button:hover{background:#4a3a48}button:active{transform:translateY(1px)}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}button:disabled{opacity:.5;cursor:wait}
a{color:#775b6d;text-underline-offset:4px}
small{font-size:10px;color:#9b8c97;line-height:1.6}
label small{font-weight:400;margin-left:4px}
input+small{display:block;margin:7px 2px 0}
.status{font-size:12px;margin:14px 0 0}
.status:empty{display:none}
.auth-card>p:last-child{text-align:center;font-size:11px;border-top:1px solid var(--line);padding-top:20px;margin:24px 0 0}
.auth-card>p:last-child a{font-weight:600}
[hidden]{display:none!important}
@media(max-width:600px){.auth-wrap{padding:28px 18px 35px}.auth-card{padding:30px 25px 24px;margin-top:23px;border-radius:20px}h1{font-size:36px}.intro{font-size:11px}}
@media(prefers-reduced-motion:reduce){input,button{transition:none}}

.text-button{display:block;width:max-content;margin:15px 0 0 auto;background:transparent;color:#775b6d;border:0;padding:0;box-shadow:none;font-size:11px;font-weight:400;letter-spacing:0;text-decoration:underline;text-underline-offset:4px}
.text-button:hover{background:transparent;color:#342934}
#recovery{margin-top:24px;padding:22px;background:#f8f2f7;border:1px solid #e7dce6;border-radius:14px}
#recovery h2{font:25px/1.2 Georgia,serif;margin:0 0 10px;letter-spacing:-.5px}
#recovery p{font-size:12px;margin:0}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f4dfe0"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="/sgc-app-icon.svg"></head><body><main class="auth-wrap"><a class="auth-brand" href="index.html">SGC<small>NETWORK</small></a><section class="auth-card"><div class="eyebrow">MEMBER LOGIN</div><h1>Welcome back.</h1><p class="intro">Your space to learn, connect and grow.<br>Pick up where your next chapter began.</p><form id="login-form"><label for="identifier">Email or username</label><input id="identifier" autocomplete="username" required placeholder="Your email or username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="login-button">Log in</button></form><button class="text-button" id="forgot" type="button">Forgot password?</button><section id="recovery" hidden><h2 style="font-family:Georgia,serif">Reset your password</h2><p>Enter your account email. We’ll email you a secure reset link.</p><form id="recovery-form"><label for="recovery-email">Email address</label><input type="email" id="recovery-email" autocomplete="email" required><button type="submit" id="recovery-button">Send reset email</button></form></section><p id="status" class="status" role="status" aria-live="polite"></p><p>New to SGC? <a href="signup.html">Join SGC</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
const $=id=>document.getElementById(id),sb=window.sgcSupabase;
$('login-form').onsubmit=async e=>{
 e.preventDefault();$('login-button').disabled=true;$('status').textContent='Signing in…';
 try{
  if(!sb)throw Error('Account connection is unavailable. Refresh to retry.');
  const identifier=$('identifier').value.trim(),password=$('password').value;
  let result;
  if(identifier.includes('@'))result=await sb.auth.signInWithPassword({email:identifier,password});
  else{
   const response=await fetch('https://bxpexanyoyubxeqqlggh.supabase.co/functions/v1/sgc-member-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,password})});
   const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to sign in.');
   result=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});
  }
  if(result.error)throw Error('Email, username or password is incorrect. Check that your email is confirmed.');
  const next=new URLSearchParams(location.search).get('next');
  const target=new URL(next||'dashboard.html',location.href);
  location.assign(target.origin===location.origin?target.href:'dashboard.html');
 }catch(error){$('status').textContent=error.message;}finally{$('login-button').disabled=false;}
};
$('forgot').onclick=()=>{$('recovery').hidden=!$('recovery').hidden;if(!$('recovery').hidden){if($('identifier').value.includes('@'))$('recovery-email').value=$('identifier').value;$('recovery-email').focus();}};
$('recovery-form').onsubmit=async e=>{
 e.preventDefault();$('recovery-button').disabled=true;$('status').textContent='Requesting reset email…';
 try{if(!sb)throw Error('Account connection unavailable.');const r=await sb.auth.resetPasswordForEmail($('recovery-email').value.trim(),{redirectTo:'https://sgcnetwork.co.za/reset-password.html'});if(r.error)throw r.error;$('status').textContent='If an account uses this email, a reset link has been sent. Check your inbox and spam folder.';}
 catch(error){$('status').textContent=error.message;}finally{$('recovery-button').disabled=false;}
};</script></body></html>
