<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | SGC Network</title><link rel="stylesheet" href="css/style.css"></head><body><main class="hero"><div class="container" style="max-width:520px"><a class="logo" href="index.html">SGC<small>NETWORK</small></a><div class="card" style="margin-top:40px"><div class="eyebrow">MEMBER LOGIN</div><h1 style="font:700 52px/.95 Georgia,serif">Welcome back.</h1><p>Log in to access your SGC learning space, payments and Business Kit.</p><form id="loginForm"><input id="email" type="email" placeholder="Email address" required style="width:100%;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:12px"><input id="password" type="password" placeholder="Password" required style="width:100%;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:12px"><button class="btn dark" style="border:0;margin-top:10px" type="submit">Log in</button></form><p id="msg"></p><p>New to SGC? <a href="signup.html">Create your account</a></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();if(!window.sgcSupabase){msg.textContent='Connect your Supabase project in js/config.js first.';return}const r=await sgcAuth.signIn(email.value,password.value);msg.textContent=r.error?r.error.message:'Logged in — opening your dashboard...';if(!r.error){const next=new URLSearchParams(location.search).get('next');location.href=next||'dashboard.html';}}</script></body></html>
