<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member login | SGC Network</title><style>body{margin:0;background:#faf7f2;color:#29242c;font:14px Arial,sans-serif}.auth-wrap{max-width:500px;margin:55px auto;padding:0 22px}.auth-brand{font:30px Georgia,serif;text-decoration:none;color:inherit;letter-spacing:3px}.auth-brand small{display:block;font:9px Arial,sans-serif;letter-spacing:4px;margin-top:5px}.auth-card{background:#fffdf9;border:1px solid #e4dde2;border-radius:12px;padding:36px;margin-top:30px}.eyebrow{font-size:10px;letter-spacing:2px;color:#796778}h1{font:46px/1.05 Georgia,serif;margin:18px 0}p{line-height:1.7;color:#746a74}label{display:block;margin-top:18px;font-size:12px}input{box-sizing:border-box;width:100%;padding:14px;margin-top:7px;border:1px solid #d8cdd7;border-radius:5px;background:white;font:inherit}button{padding:14px 20px;border:0;border-radius:5px;background:#322936;color:white;font:inherit;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}a{color:#71566d}.text-button{background:none;color:#71566d;padding:0;font-size:12px}small{color:#817581;line-height:1.6}.status{font-size:13px}[hidden]{display:none!important}@media(max-width:600px){.auth-card{padding:25px}h1{font-size:38px}}</style></head><body><main class="auth-wrap"><a class="auth-brand" href="index.html">SGC<small>NETWORK</small></a><section class="auth-card"><div class="eyebrow">MEMBER LOGIN</div><h1>Welcome back.</h1><p>Your learning, kits and next chapter.</p><form id="login-form"><label for="identifier">Email or username</label><input id="identifier" autocomplete="username" required placeholder="Your email or full-name username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="login-button">Log in</button></form><button class="text-button" id="forgot" type="button">Forgot password?</button><section id="recovery" hidden><h2 style="font-family:Georgia,serif">Reset your password</h2><p>Enter your account email. We’ll email you a secure reset link.</p><form id="recovery-form"><label for="recovery-email">Email address</label><input type="email" id="recovery-email" autocomplete="email" required><button type="submit" id="recovery-button">Send reset email</button></form></section><p id="status" class="status" role="status" aria-live="polite"></p><p>New to SGC? <a href="signup.html">Join SGC</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
const $=id=>document.getElementById(id),sb=window.sgcSupabase;
$('login-form').onsubmit=async e=>{
 e.preventDefault();$('login-button').disabled=true;$('status').textContent='Signing in…';
 try{
  if(!sb)throw Error('Account connection is unavailable. Refresh to retry.');
  const identifier=$('identifier').value.trim(),password=$('password').value;
  let result;
  if(identifier.includes('@'))result=await sb.auth.signInWithPassword({email:identifier,password});
  else{
   const response=await fetch('https://bxpexanyoyubxeqqlggh.supabase.co/functions/v1/sgc-member-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,password})});
   const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to sign in.');
   result=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});
  }
  if(result.error)throw Error('Email, username or password is incorrect. Check that your email is confirmed.');
  const next=new URLSearchParams(location.search).get('next');
  const target=new URL(next||'dashboard.html',location.href);
  location.assign(target.origin===location.origin?target.href:'dashboard.html');
 }catch(error){$('status').textContent=error.message;}finally{$('login-button').disabled=false;}
};
$('forgot').onclick=()=>{$('recovery').hidden=!$('recovery').hidden;if(!$('recovery').hidden){if($('identifier').value.includes('@'))$('recovery-email').value=$('identifier').value;$('recovery-email').focus();}};
$('recovery-form').onsubmit=async e=>{
 e.preventDefault();$('recovery-button').disabled=true;$('status').textContent='Requesting reset email…';
 try{if(!sb)throw Error('Account connection unavailable.');const r=await sb.auth.resetPasswordForEmail($('recovery-email').value.trim(),{redirectTo:'https://sgcnetwork.co.za/reset-password.html'});if(r.error)throw r.error;$('status').textContent='If an account uses this email, a reset link has been sent. Check your inbox and spam folder.';}
 catch(error){$('status').textContent=error.message;}finally{$('recovery-button').disabled=false;}
};</script></body></html>
