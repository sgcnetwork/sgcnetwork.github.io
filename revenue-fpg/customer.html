<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>FPG · Customer evidence upload</title><link rel="stylesheet" href="./style.css"><script src="./config.js" defer></script><script src="./customer.js" defer></script></head><body><main style="max-width:650px;margin:5vh auto;padding:25px"><a class="brand" href="./index.html">FPG <em>Finance</em></a><div class="panel section-space"><div class="panel-body"><span class="eyebrow">SECURE CUSTOMER UPLOAD</span><h1 style="font-size:32px">Send your evidence</h1><p id="customerInfo">Checking your upload link…</p><form id="customerForm" hidden><label id="cardLabel" hidden>Last four digits of the virtual card<input id="last4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label><p class="muted" id="customerGuidance"></p><label>PDF, JPG or PNG · maximum 10 MB<input type="file" id="customerFile" accept="application/pdf,image/jpeg,image/png" required></label><label class="check-label"><input type="checkbox" required> I confirm this evidence belongs to the linked request and can be used to investigate it.</label><button class="button" id="customerSubmit">Upload securely →</button></form><p id="customerResult" role="status"></p><small>This link expires after 48 hours or one successful submission. Evidence is reviewed before approval. Never upload a PIN, CVV or full card number.</small></div></div></main></body></html>
