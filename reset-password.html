<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | SGC Network</title><style>body{margin:0;background:#faf7f2;color:#29242c;font:14px Arial,sans-serif}.auth-wrap{max-width:500px;margin:55px auto;padding:0 22px}.auth-brand{font:30px Georgia,serif;text-decoration:none;color:inherit;letter-spacing:3px}.auth-brand small{display:block;font:9px Arial,sans-serif;letter-spacing:4px;margin-top:5px}.auth-card{background:#fffdf9;border:1px solid #e4dde2;border-radius:12px;padding:36px;margin-top:30px}.eyebrow{font-size:10px;letter-spacing:2px;color:#796778}h1{font:46px/1.05 Georgia,serif;margin:18px 0}p{line-height:1.7;color:#746a74}label{display:block;margin-top:18px;font-size:12px}input{box-sizing:border-box;width:100%;padding:14px;margin-top:7px;border:1px solid #d8cdd7;border-radius:5px;background:white;font:inherit}button{padding:14px 20px;border:0;border-radius:5px;background:#322936;color:white;font:inherit;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}a{color:#71566d}.text-button{background:none;color:#71566d;padding:0;font-size:12px}small{color:#817581;line-height:1.6}.status{font-size:13px}[hidden]{display:none!important}@media(max-width:600px){.auth-card{padding:25px}h1{font-size:38px}}</style></head><body><main class="auth-wrap"><a class="auth-brand" href="index.html">SGC<small>NETWORK</small></a><section class="auth-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>A fresh start.</h1><p>Choose your new password.</p><form id="reset-form" hidden><label for="password">New password</label><input type="password" id="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input type="password" id="confirm" minlength="8" autocomplete="new-password" required><button id="save" type="submit">Save password</button></form><p id="status" role="status" aria-live="polite">Checking your reset link…</p><p><a href="login.html">Back to login</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
const $=id=>document.getElementById(id),sb=window.sgcSupabase;
let recovery=false;
async function ready(){recovery=true;$('reset-form').hidden=false;$('status').textContent='Your reset link is ready.';history.replaceState(null,'',location.pathname);}
if(sb){
 sb.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')ready();});
 const hash=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);
 (async()=>{try{
  if(hash.get('error')||q.get('error'))throw Error('This reset link is invalid or expired. Request another from the login page.');
  if(hash.get('type')==='recovery'&&hash.get('access_token')&&hash.get('refresh_token')){
   const r=await sb.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(r.error)throw r.error;await ready();
  }else if(q.get('code')){const r=await sb.auth.exchangeCodeForSession(q.get('code'));if(r.error)throw r.error;await ready();}
  else if(!recovery)$('status').textContent='Open the reset link in your email, or request a new one from the login page.';
 }catch(error){$('status').textContent=error.message;}})();
}else $('status').textContent='Account connection unavailable. Refresh to retry.';
$('reset-form').onsubmit=async e=>{
 e.preventDefault();if(!recovery)return;
 if($('password').value!==$('confirm').value){$('status').textContent='Passwords do not match.';return;}
 $('save').disabled=true;
 try{const r=await sb.auth.updateUser({password:$('password').value});if(r.error)throw r.error;await sb.auth.signOut();$('reset-form').hidden=true;$('status').textContent='Password updated. You can now log in with your new password.';}
 catch(error){$('status').textContent=error.message;}finally{$('save').disabled=false;}
};</script></body></html>
