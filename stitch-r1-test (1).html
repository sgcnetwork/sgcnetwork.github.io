<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R1 Stitch Test | SGC Network</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="product-add-on.css">
</head>
<body>
<nav class="nav"><div class="container nav-inner"><a class="logo" href="index.html">SGC<small>NETWORK</small></a><button class="menu" aria-label="Open menu">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="start.html">Start</a><a href="build.html">Build</a><a href="kits.html">Business Kits</a><a href="dashboard.html">My SGC</a></div></div></nav>
<section class="page-hero"><div class="container"><div class="eyebrow">STITCH TEST CHECKOUT</div><h1>R1 test payment.</h1><p>This page is only for completing the Stitch test payment.</p><div class="mini-art"></div></div></section>
<section class="section soft"><div class="container"><div class="product-card featured" style="max-width:720px;margin:auto"><span class="tag">TEST PAYMENT</span><h2>Stitch Test Payment</h2><div class="product-price">R1.00</div><p>Continue to the secure Stitch test checkout.</p><button class="btn dark" id="pay">Continue to Stitch →</button><p class="buy-note" id="status">Separate R1 test — your R20 product is untouched.</p></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="script.js"></script>
<script>
const FUNCTION_URL='https://bxpexanyoyubxeqqlggh.supabase.co/functions/v1/create-stitch-payment';
const btn=document.getElementById('pay'),status=document.getElementById('status');
btn.onclick=async()=>{try{
if(!window.sgcSupabase)throw new Error('SGC account connection is unavailable.');
btn.disabled=true;btn.textContent='Preparing secure checkout…';status.textContent='Checking your SGC account…';
const {data:{session},error}=await window.sgcSupabase.auth.getSession();if(error)throw error;
const user=session?.user;if(!user){location.href='login.html?next='+encodeURIComponent(location.pathname);return;}
const payerName=(user.user_metadata?.full_name||user.email?.split('@')[0]||'SGC Customer').trim();
status.textContent='Connecting to Stitch…';
const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:1,payerName:payerName.length>=3?payerName:'SGC Customer',email:user.email,userId:user.id,product:'preview',productName:'Stitch R1 Test Payment'})});
const result=await response.json();if(!response.ok||!result.success||!result.checkoutUrl)throw new Error(result.error||'Could not start test payment.');
location.href=result.checkoutUrl;
}catch(err){console.error(err);status.textContent=err?.message||'Could not start test payment.';btn.disabled=false;btn.textContent='Continue to Stitch →';}};
</script></body></html>
