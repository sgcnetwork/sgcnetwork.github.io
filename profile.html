<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf5f9"><title>Member Profile — SGC Network</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#faf5f9;color:#382b38;font-family:Inter,Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,calc((100vw - 1060px)/2));background:#fffafd;border-bottom:1px solid #e8dbe8}.logo{font:26px Georgia,serif;letter-spacing:.09em;text-decoration:none;color:inherit}.logo small{display:block;font:9px Arial,sans-serif;letter-spacing:.2em}.back{background:#f1e5f1;border-radius:20px;padding:11px 16px;text-decoration:none;color:#5c435a;font-size:13px;font-weight:700}main{width:min(100%,1050px);margin:18px auto 0;background:white;border:1px solid #ebdeea;border-radius:18px;overflow:hidden}iframe{display:block;width:100%;height:calc(100dvh - 120px);min-height:700px;border:0;background:white}@media(max-width:700px){header{padding:12px 15px}.logo{font-size:23px}main{margin:0;border:0;border-radius:0}iframe{height:calc(100dvh - 70px);min-height:650px}}</style>
<link rel="stylesheet" href="css/sgc-theme.css?v=6"><script src="js/sgc-theme.js?v=2"></script></head><body><header><a class="logo" href="dashboard.html">SGC<small>NETWORK</small></a><a class="back" href="members.html">← All members</a></header><main><iframe id="member-profile" title="SGC member profile" loading="eager"></iframe></main>
<script>
const id=new URLSearchParams(location.search).get('user');
if(!id||!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id)){document.querySelector('main').textContent='Invalid member profile link.';}
else{document.getElementById('member-profile').src='community.html?view=profile&profile='+encodeURIComponent(id)}
</script></body></html>
