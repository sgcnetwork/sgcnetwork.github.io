<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGC Academy Classroom</title><style>:root{--bg:#0b0b0b;--panel:#151515;--gold:#c6a15b;--ivory:#f6f0e5;--muted:#aaa;--line:#2b2b2b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font:28px Georgia,serif;letter-spacing:.08em}.brand small{display:block;font:9px Arial;letter-spacing:.28em}.gold{color:var(--gold)}h1,h2,h3{font-family:Georgia,serif}.hero{padding:48px 0 26px}h1{font-size:54px;margin:8px 0}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.btn{display:inline-block;background:var(--gold);color:#111;border:0;border-radius:999px;padding:12px 17px;font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:var(--ivory);border:1px solid #555}.field{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#101010;color:white;margin:6px 0 12px}textarea.field{min-height:110px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:15px 0}.stack{display:grid;gap:14px}.hidden{display:none}.status{font-size:12px;color:var(--gold)}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="academy.html">SGC<small>ACADEMY</small></a><a class="btn alt" href="academy.html">Exit classroom</a></div><section class="hero"><div class="gold">YOUR CLASSROOM</div><h1 id="courseTitle">Loading…</h1><p id="courseDesc" class="muted"></p></section><section class="panel"><div id="lessons">Loading lessons…</div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/classroom.js"></script></body></html>
