<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advertising Budgets | SGC Network</title><style>:root{--gold:#c7a46a}*{box-sizing:border-box}body{background:#0d0d0d;color:#f7f1e7;font:15px Arial;margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}a{color:var(--gold)}header{display:flex;justify-content:space-between;gap:12px}h1{font:clamp(34px,5vw,55px) Georgia}h2{font:27px Georgia}.panel{background:#191919;border:1px solid #333;border-radius:18px;padding:23px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}label{display:block;color:#ccc;font-size:13px}input,select{display:block;width:100%;margin:8px 0 15px;padding:12px;background:#101010;border:1px solid #555;border-radius:9px;color:white}button{background:var(--gold);border:0;border-radius:22px;padding:11px 17px;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}.secondary{background:transparent;border:1px solid #666;color:white}.card{border:1px solid #444;padding:17px;border-radius:13px;margin:12px 0}.meter{height:9px;border-radius:10px;background:#444;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--gold)}.muted{color:#aaa}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #444;padding:10px}.scroll{overflow:auto}@media(max-width:600px){.panel{padding:15px}.wrap{padding:14px}}</style></head><body><main class="wrap"><header><b>SGC NETWORK · ADMIN</b><a href="admin-financials.html">Financials</a></header><h1>Advertising budgets.</h1><p class="muted">Set a monthly advertising budget, record each actual payment and attach its invoice or receipt.</p><p id="status">Checking access…</p><div id="app" hidden><section class="panel"><h2>Set advertising budget</h2><form id="budgetForm"><div class="grid"><label>Client / business<input name="client_name" placeholder="DJP" required></label><label>Platform<input name="platform" placeholder="Google Ads" required></label><label>Budget month<input name="period" type="month" required></label><label>Budget amount (R)<input name="budget" type="number" min="0" step=".01" required></label></div><button type="submit">Save budget</button></form><p class="muted">Saving the same client, platform and month updates its budget amount.</p></section><section class="panel"><h2>Record ad payment</h2><form id="paymentForm"><div class="grid"><label>Advertising budget<select name="ad_budget_id" id="budgetSelect" required></select></label><label>Payment date<input name="expense_date" type="date" required></label><label>Amount actually paid (R)<input name="amount" type="number" min=".01" step=".01" required></label><label>Receipt / invoice<input id="receipt" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" required></label></div><button type="submit" id="paySave">Save payment and receipt</button></form></section><section class="panel"><h2>Budget balances</h2><div id="cards"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),db=window.sgcSupabase,fmt=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(n);let user,budgets=[],docs=[];try{if(!db)throw Error('Database unavailable');const a=await db.auth.getUser();user=a.data.user;if(!user){location.replace('admin-login.html');return}const p=await db.from('profiles').select('role').eq('id',user.id).single();if(p.error||p.data?.role!=='admin')throw Error('Admin only');$('app').hidden=false;const now=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Johannesburg'});$('budgetForm').elements.period.value=now.slice(0,7);$('paymentForm').elements.expense_date.value=now;
async function load(){const [b,d]=await Promise.all([db.from('sgc_ad_budgets').select('*').order('period',{ascending:false}),db.from('sgc_financial_documents').select('*').not('ad_budget_id','is',null)]);if(b.error)throw b.error;if(d.error)throw d.error;budgets=b.data;docs=d.data;render()}
function render(){$('budgetSelect').replaceChildren();$('cards').replaceChildren();for(const b of budgets){const o=document.createElement('option');o.value=b.id;o.textContent=b.period+' · '+b.client_name+' · '+b.platform;$('budgetSelect').append(o);const group=docs.filter(d=>d.ad_budget_id===b.id);const paid=group.reduce((s,d)=>s+Number(d.amount),0);const card=document.createElement('div');card.className='card';const heading=document.createElement('div');heading.className='row';const title=document.createElement('strong');title.textContent=b.client_name+' · '+b.platform+' · '+b.period;const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit budget';edit.onclick=()=>{const v=prompt('New budget amount (R)',b.budget);if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<0){$('status').textContent='Enter a valid amount';return}db.from('sgc_ad_budgets').update({budget:n}).eq('id',b.id).then(async r=>{if(r.error)$('status').textContent=r.error.message;else await load()})};heading.append(title,edit);card.append(heading);const p=document.createElement('p');p.textContent='Budget '+fmt(b.budget)+' · Paid '+fmt(paid)+' · Remaining '+fmt(Number(b.budget)-paid);card.append(p);const meter=document.createElement('div');meter.className='meter';const fill=document.createElement('div');fill.className='fill';fill.style.width=(Number(b.budget)>0?Math.min(100,paid/Number(b.budget)*100):0)+'%';meter.append(fill);card.append(meter);for(const d of group){const row=document.createElement('div');row.className='row';row.style.marginTop='10px';const t=document.createElement('span');t.textContent=d.expense_date+' · '+fmt(d.amount)+' · '+d.file_name;const actions=document.createElement('span');const view=document.createElement('button');view.className='secondary';view.textContent='Receipt';view.onclick=async()=>{const r=await db.storage.from('sgc-finance-documents').createSignedUrl(d.file_path,120);if(r.error)$('status').textContent=r.error.message;else window.open(r.data.signedUrl,'_blank','noopener')};const del=document.createElement('button');del.className='secondary';del.textContent='Remove payment';del.onclick=async()=>{if(!confirm('Remove this payment and its receipt?'))return;const r=await db.from('sgc_financial_documents').delete().eq('id',d.id);if(r.error){$('status').textContent=r.error.message;return}await db.storage.from('sgc-finance-documents').remove([d.file_path]);await load()};actions.append(view,del);row.append(t,actions);card.append(row)}$('cards').append(card)}}
$('budgetForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),client_name=String(f.get('client_name')).trim(),platform=String(f.get('platform')).trim(),period=f.get('period'),budget=Number(f.get('budget'));const existing=budgets.find(b=>b.client_name===client_name&&b.platform===platform&&b.period===period);const r=existing?await db.from('sgc_ad_budgets').update({budget}).eq('id',existing.id):await db.from('sgc_ad_budgets').insert({client_name,platform,period,budget,created_by:user.id});$('status').textContent=r.error?r.error.message:'Budget saved';if(!r.error)await load()};
$('paymentForm').onsubmit=async e=>{e.preventDefault();const btn=$('paySave');btn.disabled=true;let path;try{const f=new FormData(e.target),b=budgets.find(b=>b.id===f.get('ad_budget_id')),file=$('receipt').files[0];if(!b)throw Error('Select a budget');if(file.size>10485760||!['application/pdf','image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use PDF or image up to 10 MB');path=user.id+'/'+crypto.randomUUID()+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const upload=await db.storage.from('sgc-finance-documents').upload(path,file,{contentType:file.type});if(upload.error)throw upload.error;const r=await db.from('sgc_financial_documents').insert({created_by:user.id,expense_date:f.get('expense_date'),supplier:b.platform,category:'Advertising',client_name:b.client_name,amount:Number(f.get('amount')),file_path:path,file_name:file.name,mime_type:file.type,ad_budget_id:b.id,payment_group:crypto.randomUUID()});if(r.error)throw r.error;$('status').textContent='Ad payment and receipt saved';e.target.reset();await load()}catch(err){$('status').textContent='Could not save: '+err.message;if(path)await db.storage.from('sgc-finance-documents').remove([path])}finally{btn.disabled=false}};await load();$('status').textContent='Ready'}catch(err){$('status').textContent=err.message}})();
</script></body></html>
