<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequently Asked Questions — SGC Network</title>
<style>
:root{--ink:#322b2e;--muted:#796d75;--line:#eadfe5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#eee3f4 0%,transparent 42%),#fbf8f4;color:var(--ink);font:15px/1.65 Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:950px;width:calc(100% - 34px);margin:auto}header{padding:25px 0;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}.brand{font:27px Georgia,serif;letter-spacing:.09em}.brand small{display:block;font:10px Arial;letter-spacing:.23em}.back{padding:10px 16px;border-radius:24px;background:#f0e6f4;font-size:13px}.hero{padding:58px 0 30px;text-align:center}.eyebrow{color:#947184;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.hero h1{font:clamp(35px,6vw,57px)/1.15 Georgia,serif;letter-spacing:-.035em;margin:12px 0}.hero p{color:var(--muted);margin:14px 0 25px}.search{position:relative;max-width:680px;margin:0 auto}.search input{width:100%;border:1px solid #dfd1df;border-radius:17px;background:#fff;padding:18px 22px 18px 48px;font:16px Arial;box-shadow:0 7px 24px #55405b0a;outline-color:#b89cb8}.search span{position:absolute;top:15px;left:18px;font-size:22px;color:#90788c}.count{color:var(--muted);font-size:12px;margin:30px 0 14px}.faq{background:#fffefa;border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:0 3px 12px #43334405}.faq summary{cursor:pointer;padding:22px 25px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:15px;list-style:none}.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:'+';font-size:23px;font-weight:400;color:#997d98}.faq[open] summary:after{content:'−'}.faq[open] summary{background:#f7eef5}.answer{padding:4px 25px 22px;white-space:pre-wrap;color:#574d54;line-height:1.85}.empty{text-align:center;padding:35px;color:var(--muted)}footer{text-align:center;padding:50px 0;font-size:12px;color:var(--muted)}@media(max-width:600px){.hero{padding-top:36px}.faq summary{padding:17px;font-size:14px}.answer{padding:3px 17px 19px}}
</style></head><body><div class="wrap"><header><a class="brand" href="index.html">SGC<small>NETWORK</small></a><a class="back" href="community.html">← Back to Community</a></header>
<section class="hero"><span class="eyebrow">We're here to help</span><h1>Frequently Asked Questions</h1><p>Find the answers you need, without the fuss.</p><div class="search"><span aria-hidden="true">⌕</span><input id="faq-search" type="search" placeholder="Search a question or keyword…" aria-label="Search frequently asked questions" autocomplete="off"></div></section>
<div id="faq-count" class="count">Loading FAQs…</div><main id="faq-list" aria-live="polite"></main><footer>Still have questions? <a href="community.html?group=6a1f01e7-784b-441d-82cc-2d2066c8e217" style="text-decoration:underline">Ask the SGC community →</a></footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://bxpexanyoyubxeqqlggh.supabase.co','sb_publishable_Z0_Y-Bj_G5qw4hMgDbQlgA__jj8rGGq');
const groupId='6a1f01e7-784b-441d-82cc-2d2066c8e217',list=document.getElementById('faq-list'),counter=document.getElementById('faq-count'),search=document.getElementById('faq-search');let faqs=[];
function render(){const q=search.value.trim().toLocaleLowerCase();const matches=faqs.filter(f=>(f.question+' '+f.answer).toLocaleLowerCase().includes(q));list.replaceChildren();counter.textContent=matches.length+' question'+(matches.length===1?'':'s')+(q?' found':'');if(!matches.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching questions. Try another keyword.';list.append(p)}for(const f of matches){const card=document.createElement('details'),summary=document.createElement('summary'),answer=document.createElement('div');card.className='faq';summary.textContent=f.question;answer.className='answer';answer.textContent=f.answer;card.append(summary,answer);list.append(card)}}
search.addEventListener('input',render);
async function load(){try{const posts=await sb.from('community_posts').select('id,title').eq('group_id',groupId).order('created_at',{ascending:true});if(posts.error)throw posts.error;const ids=(posts.data||[]).map(p=>p.id);if(!ids.length){faqs=[];render();return}const comments=await sb.from('community_comments').select('post_id,body,title').in('post_id',ids).eq('title','Official SGC Network answer');if(comments.error)throw comments.error;const answers=new Map((comments.data||[]).map(c=>[c.post_id,c.body]));faqs=(posts.data||[]).filter(p=>answers.has(p.id)).map(p=>({question:p.title,answer:answers.get(p.id)}));render()}catch(e){counter.textContent='FAQs unavailable';list.textContent='Could not load questions right now. Please try again later.';console.error(e)}}
load();
</script></body></html>
